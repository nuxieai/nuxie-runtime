[[findings]]
id = "SR-C087-01"
severity = "P2"
summary = "The pinned WebGL2 source activates texture unit zero and binds the texture before resolving its internal format. Consequently, BC1, BC3, and BC7, whose extension constants are absent in the frozen configuration, reach RIVE_UNREACHABLE only after those observable GL-state mutations. The target resolves and panics on the unsupported format before recording ActiveTexture or BindTexture, reversing failure order and suppressing both source mutations."
