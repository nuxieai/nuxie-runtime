expected_status_counts = { pending = 8, in-progress = 5, ported = 1, verified = 0 }

# Status is independent from the source manifest. A translated file may not
# advance an ownership row until construction, mutation, submission,
# completion, abandonment, and drop behavior are all exercised as applicable.
# `ported` and `verified` additionally require `evidence_paths` naming checked-in
# test or evidence files; prose test names alone cannot promote a row.

[[owner]]
id = "renderer.target_textures_and_atomic_storage"
issue = "UNIV-2086"
status = "ported"
# Wave four's native Weak observations execute after an explicit autorelease
# pool drains and prove the replaced generation releases every attachment and
# realized atomic buffer after its last frame drops.
rule = "The render target retains its target texture, memoryless attachments, and lazily allocated private atomic buffers; resize replaces the complete size-dependent owner set."
citations = ["cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:21-87", "cpp:renderer/src/metal/render_context_metal_impl.mm:735-781"]
required_tests = ["target compatibility and replacement", "lazy atomic allocation", "resize invalidates size-dependent storage", "drop releases all retained Metal objects"]
evidence_paths = [
  "crates/nuxie-renderer/src/native_metal/mod.rs",
  "crates/nuxie-renderer/src/native_metal/render_target.rs",
  "crates/nuxie-renderer/tests/native_metal_tracer.rs",
]

[[owner]]
id = "renderer.device_queue_and_command_buffer"
issue = "UNIV-2086"
status = "in-progress"
# Wave three moves acquisition to begin_frame and makes the consuming frame own
# that concrete command buffer through commit or abandonment. Wave four's
# native Weak observation proves uncommitted release after the autorelease pool
# drains. This remains in-progress until a safe live Metal command-buffer
# failure covers error completion; the checked-in status-policy test alone is
# not sufficient for promotion.
rule = "The context retains the device and queue. Each frame acquires exactly one concrete Metal command buffer at begin_frame; finish consumes and commits it once, while abandonment releases it uncommitted."
citations = ["cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:112-133", "cpp:renderer/src/metal/render_context_metal_impl.mm:1227-1249"]
required_tests = ["queue required before product submission", "one command buffer per flush", "completion and error status propagation", "abandoned frame releases uncommitted resources"]
evidence_paths = [
  "crates/nuxie-renderer/src/native_metal/context.rs",
  "crates/nuxie-renderer/src/native_metal/mod.rs",
  "crates/nuxie-renderer/tests/native_metal_tracer.rs",
]

