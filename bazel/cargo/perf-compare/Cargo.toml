# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "perf-compare"
version = "0.1.0"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
path = "lib.rs"

[dependencies]
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1" }
"sha2" = { "version" = "0.10" }
"toml" = { "version" = "0.9" }
