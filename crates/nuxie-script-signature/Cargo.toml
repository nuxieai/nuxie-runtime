[package]
name = "nuxie-script-signature"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compile the exact freestanding verifier alongside the original native
# backend for differential tests. Never needed by a shipping consumer.
freestanding-tests = []

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
libhydrogen = "=0.4.6"
# Keep the native oracle and vendored verifier on the same C source even when
# this crate is consumed from a different workspace lockfile.
libhydrogen-sys = "=0.9.4"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[[example]]
name = "wasm_probe"
crate-type = ["cdylib"]

[lints]
workspace = true
