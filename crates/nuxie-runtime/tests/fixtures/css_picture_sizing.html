<script>
// Run in headless Chrome with --dump-dom --virtual-time-budget=2000.
// No remote resources are needed. Rectangles are border boxes in CSS pixels.
const cases = JSON.parse(document.getElementById('cases').textContent);
for (const row of cases) {
  const parent = document.createElement('div');
  parent.className = 'parent'; parent.style = row.parent;
  for (const [index, item] of [row, ...(row.siblings || [])].entries()) {
    const image = document.createElement('img');
    image.id = index === 0 ? row.name : `${row.name}-${index}`;
    image.style = item.css;
    if (row.natural.every(value => value > 0)) image.src = row.src;
    parent.append(image);
  }
  fixtures.append(parent);
}
window.onload = () => {
  for (const row of cases) {
    const image = document.getElementById(row.name);
    if (row.src && (image.naturalWidth !== row.natural[0] || image.naturalHeight !== row.natural[1])) {
      throw new Error(`PNG failed to decode: ${row.name}`);
    }
  }
  results.textContent = JSON.stringify({userAgent:navigator.userAgent,cases:cases.map(row => {
    const rect = document.getElementById(row.name).getBoundingClientRect();
    const {src, ...input} = row;
    const measured = {...input, expected:[rect.width, rect.height]};
    if (row.siblings) measured.siblings = row.siblings.map((item, index) => {
      const sibling = document.getElementById(`${row.name}-${index + 1}`).getBoundingClientRect();
      return {...item, expected:[sibling.width, sibling.height]};
    });
    return measured;
  })});
};
