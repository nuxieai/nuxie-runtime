<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exact WebGL2 candidate replay</title>
  </head>
  <body data-status="loading">
    <pre id="status">loading exact WebGL2 candidate</pre>
    <script type="module">
      import init, { run_webgl2_replay } from "./pkg/webgl2_renderer_replay.js";

      const status = document.querySelector("#status");
      window.webgl2CandidateReady = init().then(() => {
        document.body.dataset.status = "ready";
        status.textContent = "ready: exact Rust WebGL2 candidate";
      });

      window.runWebgl2Candidate = async ({ stream, mode, frame = 0 }) => {
        await window.webgl2CandidateReady;
        const canvas = document.createElement("canvas");
        const result = run_webgl2_replay(canvas, stream, mode, frame);
        try {
          const png = result.png;
          const digest = await crypto.subtle.digest("SHA-256", png);
          const sha256 = Array.from(new Uint8Array(digest), (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");
          let binary = "";
          for (let offset = 0; offset < png.length; offset += 32768) {
            binary += String.fromCharCode(...png.subarray(offset, offset + 32768));
          }
          return {
            adapter: result.adapter,
            width: result.width,
            height: result.height,
            pngBase64: btoa(binary),
            pngBytes: png.length,
            sha256,
          };
        } finally {
          result.free();
        }
      };

      const candidateWorker = new URLSearchParams(location.search).has(
        "candidate-worker",
      );
      if (candidateWorker) {
        let completedRenders = 0;
        const delay = (milliseconds) =>
          new Promise((resolve) => setTimeout(resolve, milliseconds));
        const postJson = (path, payload) =>
          fetch(path, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
        const browserName = navigator.userAgent.includes("Firefox/")
          ? "firefox"
          : navigator.userAgent.includes("Safari/") &&
              !navigator.userAgent.includes("Chrome/")
            ? "safari"
            : "chromium";

        const work = async () => {
          await window.webgl2CandidateReady;
          const registration = await postJson("/worker/register", {
            name: browserName,
            user_agent: navigator.userAgent,
            webgl2: Boolean(document.createElement("canvas").getContext("webgl2")),
          });
          if (!registration.ok) {
            throw new Error(`candidate registration failed: ${registration.status}`);
          }
          document.body.dataset.status = "worker-ready";
          status.textContent = "ready: exact Rust WebGL2 corpus worker";

          for (;;) {
            const response = await fetch("/worker/next", { cache: "no-store" });
            if (response.status === 204) {
              await delay(10);
              continue;
            }
            if (!response.ok) {
              throw new Error(`candidate work request failed: ${response.status}`);
            }
            const job = await response.json();
            try {
              const result = await window.runWebgl2Candidate(job);
              const completion = await postJson("/worker/complete", {
                id: job.id,
                result,
              });
              if (!completion.ok) {
                throw new Error(`candidate completion failed: ${completion.status}`);
              }
            } catch (error) {
              await postJson("/worker/complete", {
                id: job.id,
                error: error?.stack || String(error),
              });
            }
            completedRenders += 1;
            if (completedRenders >= 16) {
              location.reload();
              return;
            }
          }
        };
        work().catch((error) => {
          document.body.dataset.status = "worker-failed";
          status.textContent = error?.stack || String(error);
        });
      }
    </script>
  </body>
</html>
