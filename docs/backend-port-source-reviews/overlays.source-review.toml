[[findings]]
id = "SR-OVL-02-01"
overlay_id = "webgpu-to-webgl2-load-store"
severity = "P1"
summary = "The sole WebGPU-to-WebGL2 edge wires BuildLoadStoreEXTGLSL into WebGPU's EXT-PLS load/store pipelines, but the target emits minified stage/action keys while appending payload bytes whose conditionals retain the long identifiers. The vertex and fragment branches, including clear/load/store bodies, are therefore not selected, so the EXT-PLS load/store shader modules cannot provide the authored executable stages."
citations = [
