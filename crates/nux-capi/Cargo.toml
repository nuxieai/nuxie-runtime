[package]
name = "nux-capi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
scripting = ["nuxie/scripting"]

[dependencies]
nuxie = { path = "../nuxie", default-features = false }

[dev-dependencies]
nuxie = { path = "../nuxie", default-features = false, features = ["test-support"] }
nuxie-schema = { path = "../nuxie-schema" }
serde_json = "1"

[build-dependencies]
cbindgen = "=0.29.2"

# Opt into the workspace panic-freedom clippy lints (root Cargo.toml).
[lints]
workspace = true
