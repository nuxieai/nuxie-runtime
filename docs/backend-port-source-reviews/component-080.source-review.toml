id = "SR-C080-16"
severity = "P3"
summary = "colorAttachmentCount turns source release-mode computation into unconditional panic behavior for out-of-domain subpass indices. Source uses C assertions, which disappear under NDEBUG, then evaluates the return expression; target uses unconditional assert! and assert_eq! checks."
