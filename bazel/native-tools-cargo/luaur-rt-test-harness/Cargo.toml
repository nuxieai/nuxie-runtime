# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "luaur-rt-test-harness"
version = "0.1.0"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
path = "lib.rs"

[features]
"send" = ["luaur-rt/send"]
"async" = ["luaur-rt/async"]
"serde" = ["luaur-rt/serde"]

[dependencies]
"luaur-common" = { "version" = "=0.1.8", "path" = "../luaur-common", "default-features" = false, "features" = ["__bazel_dependency_default"] }
"luaur-rt" = { "version" = "=0.1.8", "path" = "../luaur-rt", "default-features" = false, "features" = ["__bazel_dependency_default"] }
"luaur-vm" = { "version" = "=0.1.8", "path" = "../luaur-vm", "default-features" = false, "features" = ["__bazel_dependency_default"] }
