[[findings]]
id = "SR-C109-01"
severity = "P1"
summary = "The target emits exported/minified feature keys such as DB and GB, but concatenates raw generated GLSL payloads whose conditionals still use long identifiers such as VERTEX, FRAGMENT, and POST_INVERT_Y. Source uses export-substituted generated headers, so the target's selected stage and feature branches are not activated consistently in Wagyu shader families."
