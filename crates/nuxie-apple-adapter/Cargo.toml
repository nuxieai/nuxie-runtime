[package]
name = "nuxie-apple-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
nuxie-image-codec = { path = "../nuxie-image-codec" }
nuxie-render-api = { path = "../nuxie-render-api" }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
nuxie-renderer = { path = "../nuxie-renderer" }

[dev-dependencies]
png = "0.18"

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
