status = "in-progress"
# Adaptation: the upstream context permits a nil queue until the product sets
# it. The explicitly selected Rust factory creates its retained queue during
# context construction, then `begin_frame` fails closed if that queue cannot
# return the one concrete command buffer owned by the frame. Context policy
# tests cover missing acquisition and completion errors; the live tracer test
# covers successful completion and abandoned-frame reuse.
# Wave four additionally adapts the upstream product-supplied target-texture
# seam to a caller-acquired drawable: the native renderer validates its BGRA
# texture, borrows its presentation owner, commits rendering, then uses the
# next command buffer from the same queue for presentation, matching
# `renderer/path_fiddle/fiddle_context_metal.mm:65-84,100-120,186-191`. The
# live layer test covers the real drawable path. The rooted tracer executable
# explicitly selects this adapter and executes both readback and the Apple
# presentation seam; the shipping C-ABI cutover remains deferred to UNIV-2092.
# The same-flush atlas checkpoint lazily compiles the exact synchronous
# AtlasBlit + ENABLE_DITHER key selected by the pinned oracle; compatible
# precompiled ubershaders remain fallback inventory, not parity evidence.
