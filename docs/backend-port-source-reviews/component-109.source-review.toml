]

[[findings]]
id = "SR-C109-12"
severity = "P3"
summary = "Source computes premultiplied clear channels in float32 and then widens them into WebGPU doubles. Target performs division and premultiplication directly in float64, so partial-alpha colors can submit numerically different clear values."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:185-190",
