[[phase]]
id = "compiler"
label = "Compiler queue"
status = "queued"
detail = "Wire the complete translation and resolve diagnostics without deleting source behavior."

[[phase]]
id = "behavior"
label = "Behavior verification"
status = "queued"
detail = "Run structural, lifecycle, failure, platform, image, work-count, and no-WGPU gates."

[[phase]]
id = "review"
label = "Independent review"
status = "queued"
detail = "Complete separate source/spec and ownership/standards reviews, then fix accepted findings."

[[phase]]
id = "promotion"
label = "Whole-owner promotion"
status = "queued"
detail = "Promote the header and implementation only when every line, field, configuration, and reachable branch is closed."

