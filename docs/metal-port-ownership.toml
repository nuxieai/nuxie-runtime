expected_status_counts = { pending = 12, in-progress = 0, ported = 0, verified = 0 }

# Status is independent from the source manifest. A translated file may not
# advance an ownership row until construction, mutation, submission,
# completion, abandonment, and drop behavior are all exercised as applicable.
# `ported` and `verified` additionally require `evidence_paths` naming checked-in
# test or evidence files; prose test names alone cannot promote a row.

[[owner]]
id = "renderer.target_textures_and_atomic_storage"
issue = "UNIV-2086"
status = "pending"
rule = "The render target retains its target texture, memoryless attachments, and lazily allocated private atomic buffers; resize replaces the complete size-dependent owner set."
citations = ["cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:21-87"]
required_tests = ["target compatibility and replacement", "lazy atomic allocation", "resize invalidates size-dependent storage", "drop releases all retained Metal objects"]

[[owner]]
id = "renderer.device_queue_and_command_buffer"
issue = "UNIV-2086"
status = "pending"
rule = "The context retains the device and optional queue. Each flush receives exactly one command buffer, and commit/abandon paths cannot double-submit or leak it."
citations = ["cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:112-133", "cpp:renderer/src/metal/render_context_metal_impl.mm:1227-1246"]
required_tests = ["queue required before product submission", "one command buffer per flush", "completion and error status propagation", "abandoned frame releases uncommitted resources"]

[[owner]]
id = "renderer.buffer_ring_reuse"
issue = "UNIV-2087"
status = "pending"
rule = "Uniform, storage, and vertex rings rotate only after the corresponding GPU frame is safe; CPU writes never race an in-flight frame."
citations = ["cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:193-212", "cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:277-280", "cpp:renderer/src/metal/render_context_metal_impl.mm:1255-1276"]
required_tests = ["ring rollover", "more than kBufferRingSize concurrent submissions", "completion unblocks reuse", "abandonment does not permanently lock a ring"]

[[owner]]
id = "renderer.offline_library_and_pipeline_cache"
issue = "UNIV-2086"
