[package]
name = "webgl2-renderer-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nuxie-render-stream = { path = "../../crates/nuxie-render-stream" }
png = "0.18.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[dependencies.nuxie-renderer]
path = "../../crates/nuxie-renderer"
default-features = false
features = ["renderer-webgl2", "rive-decoders"]
