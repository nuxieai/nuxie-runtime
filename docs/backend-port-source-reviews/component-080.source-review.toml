[[findings]]
id = "SR-C080-01"
severity = "P1"
summary = "ORE Canvas texture wrapping dispatches the Canvas-created render target as the wrong concrete variant. Source creates RenderTargetVulkanTexture and accesses it polymorphically through RenderTargetVulkan; target also creates RenderTargetVulkanTexture but wrapCanvasTexture explicitly selects RenderTargetVulkanImpl, so the actual Canvas target's texture-backed operations are not dispatched."
citations = [
  "source:renderer/src/vulkan/render_context_vulkan_impl.cpp:250-326",
  "source:renderer/src/ore/vulkan/ore_context_vulkan.cpp:1604-1619",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_render_context_vulkan_impl_cpp__impl.rs:537-580",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_context_vulkan_cpp__impl.rs:1347-1367",
]

[[findings]]
id = "SR-C080-02"
severity = "P2"
summary = "Draw-pipeline shader lookup and failure ordering changed. Source computes pipeline state and subpass, looks up the vertex shader, and returns immediately on a missing vertex module before touching the fragment cache; synthesized pipeline failure also returns before either lookup. Target eagerly obtains both shaders in the manager before entering the constructor and then performs a combined null check, changing fragment-cache side effects and first-failure ordering."
citations = [
  "source:renderer/src/vulkan/draw_pipeline_vulkan.cpp:183-225",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_pipeline_manager_vulkan_cpp__impl.rs:465-495",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_draw_pipeline_vulkan_cpp__impl.rs:183-219",
]

[[findings]]
id = "SR-C080-03"
severity = "P2"
summary = "The graphics-pipeline depth/stencil descriptor is present in modes where source deliberately supplies null. Source sets pDepthStencilState only for MSAA; target attaches depthStencilState unconditionally for every interlock mode."
citations = [
  "source:renderer/src/vulkan/draw_pipeline_vulkan.cpp:460-478",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_draw_pipeline_vulkan_cpp__impl.rs:432-449",
]

[[findings]]
id = "SR-C080-04"
severity = "P2"
summary = "Apple sparse-format configuration is not preserved. Source excludes A1B5G5R5, A8, and the ARM/NV sparse formats on Apple because the selected MoltenVK headers do not define them; target includes all corresponding raw numeric formats unconditionally."
citations = [
  "source:renderer/src/vulkan/render_pass_vulkan.cpp:115-139",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_render_pass_vulkan_cpp__impl.rs:128-153",
]

[[findings]]
id = "SR-C080-05"
severity = "P2"
summary = "Direct TextureApi::upload is converted from a functional upload operation into an unconditional error for otherwise valid input. Source virtual upload validates, stages, and queues the upload directly. Target's authored upload entry passes owner=None, and the implementation rejects that before the remaining validation or queueing; only the target-added uploadWithOwner path can proceed."
citations = [
  "source:renderer/src/ore/vulkan/ore_texture_vulkan.cpp:56-65",
  "source:renderer/src/ore/vulkan/ore_texture_vulkan.cpp:187-245",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_texture_vulkan_hpp__decl.rs:102-110",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_texture_vulkan_cpp__impl.rs:57-83",
]

[[findings]]
id = "SR-C080-06"
severity = "P2"
summary = "RenderPassVulkan::setPipeline reverses compatibility validation and concrete-backend validation. Source first runs checkPipelineCompat and returns on incompatibility, only then casting to PipelineVulkan; target requires a successful PipelineVulkan downcast before performing the compatibility check, so an incompatible non-Vulkan pipeline panics before the source error-and-return path."
citations = [
  "source:renderer/src/ore/vulkan/ore_render_pass_vulkan.cpp:29-38",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_render_pass_vulkan_cpp__impl.rs:21-32",
]

[[findings]]
id = "SR-C080-07"
severity = "P2"
summary = "makePipeline can return before source's missing-fragment validation and diagnostic. Source runs binding-map and validateColorRequiresFragment validation before shader-stage extraction, populating outError or lastError. Target's vertexModule.or(fragmentModule)? and concrete downcast occur first; when both modules are absent, it returns None without the source error."
citations = [
  "source:renderer/src/ore/vulkan/ore_pipeline_vulkan.cpp:272-296",
  "source:renderer/src/ore/vulkan/ore_pipeline_vulkan.cpp:329-340",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_pipeline_vulkan_cpp__impl.rs:191-239",
]

[[findings]]
id = "SR-C080-08"
severity = "P2"
summary = "Descriptor-pool reset failure handling changed from ignored-result continuation to fatal abort. Source invokes ResetDescriptorPool without checking its result and returns; target wraps the reset in vk_check, aborting on an error."
citations = [
  "source:renderer/src/vulkan/render_context_vulkan_impl.cpp:1901-1904",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_render_context_vulkan_impl_cpp__impl.rs:2156-2162",
]

[[findings]]
id = "SR-C080-09"
severity = "P3"
summary = "Unsupported sparse-format fallback changed in non-asserting builds. Source debug-asserts and then returns its reserved sentinel, while target always panics."
