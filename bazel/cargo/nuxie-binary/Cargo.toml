# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "nuxie-binary"
version = "0.1.0"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
path = "lib.rs"

[features]
"default" = ["test-support"]
"inspect" = ["dep:serde_json"]
"test-support" = []

[dependencies]
"anyhow" = { "version" = "1" }
"nuxie-script-signature" = { "path" = "../nuxie-script-signature" }
"nuxie-schema" = { "path" = "../nuxie-schema" }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1", "optional" = true }

[dev-dependencies]
"serde_json" = { "version" = "1" }
"sha2" = { "version" = "0.10" }
