[[owner]]
id = "renderer.buffer_ring_reuse"
issue = "UNIV-2087"
status = "ported"
# The concrete context owns seven independent Metal rings. Pure coordination
# tests hold three submitted reservations, prove a fourth blocks, and exercise
# completion and abandonment wakeups. Production headless and drawable frames
# transfer the pre-submit lease only after successful encoding, wait for Metal,
# and complete it exactly once. This promotion does not claim a public async
# frame API or multiple in-flight resource-texture generations.
rule = "Uniform, storage, and vertex rings rotate only after the corresponding GPU frame is safe; CPU writes never race an in-flight frame."
citations = ["cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:193-212", "cpp:renderer/include/rive/renderer/metal/render_context_metal_impl.h:277-280", "cpp:renderer/src/metal/render_context_metal_impl.mm:1255-1276"]
required_tests = ["physical ring rollover 1,2,0", "three outstanding reservations block the fourth", "completion unblocks reuse", "abandonment does not permanently lock a ring", "live Metal frame preserves pixel output"]
evidence_paths = [
  "crates/nuxie-renderer/src/native_metal/buffer_ring_coordinator.rs",
  "crates/nuxie-renderer/src/native_metal/context.rs",
