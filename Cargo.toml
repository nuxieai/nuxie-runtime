[workspace]
members = [
    "crates/nuxie-audio",
    "crates/nuxie-binary",
    "crates/nuxie-graph",
    "crates/nuxie-image-codec",
    "crates/nuxie-ore-metal",
    "crates/nuxie-render-api",
    "crates/nuxie-render-stream",
    "crates/nuxie-renderer",
    "crates/nuxie-renderer-ffi",
    "crates/nuxie",
    "crates/nuxie-project-data",
    "crates/nux-apple-product-extension",
    "crates/nux-capi",
    "crates/nuxie-runtime",
    "crates/nuxie-schema",
    "crates/nuxie-scripting",
    "tools/golden-compare",
    "tools/luaur-rt-test-harness",
    "tools/perf-compare",
    "tools/pixel-compare",
    "tools/renderer-fuzz-replay",
    "tools/renderer-replay",
    "tools/browser-renderer-smoke",
    "tools/webgl2-renderer-replay",
    "tools/nuxie-codegen",
    "tools/rust-golden-runner",
    "tools/silver-corpus",
    "tools/size-report-roots",
    "tools/apple-msl-catalog",
    "tools/apple-msl-capture",
    "tools/apple-msl-no-wgsl-probe",
]
exclude = [
    "vendor/luaur-ast-0.1.8",
    "vendor/luaur-bytecode-0.1.8",
    "vendor/luaur-common-0.1.8",
    "vendor/luaur-compiler-0.1.8",
    "vendor/luaur-rt-0.1.8",
    "vendor/luaur-vm-0.1.8",
    "vendor/jpeg-decoder-0.3.2-rive-v9f",
    "vendor/symphonia-bundle-flac-0.5.5",
    "vendor/symphonia-bundle-mp3-0.5.5",
    "vendor/symphonia-format-riff-0.5.5",
    "vendor/symphonia-utils-xiph-0.5.5",
    "vendor/wgpu-30.0.0",
    "vendor/wgpu-core-30.0.0",
    "vendor/wgpu-core-deps-apple-30.0.0",
    "vendor/wgpu-core-deps-emscripten-30.0.0",
    "vendor/wgpu-core-deps-wasm-30.0.0",
    "vendor/wgpu-core-deps-windows-linux-android-30.0.0",
    "vendor/wgpu-hal-30.0.0",
    "vendor/vk-mem-0.5.0",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/nuxieai/nuxie-runtime"

[patch.crates-io]
# In-house luaur fork (docs/luau-fork.md): every luaur crate in the dependency
# graph resolves to the vendored fork baseline (crates.io 0.1.8 packages,
# upstream commit f0eac7f7, Luau 0.724-era). luaur-common and luaur-vm carry
# the pre-existing Apple Mach-clock patch; luaur-rt carries Rive's async
# coroutine host-data inheritance and state-independent userdata field
# dispatchers. Modified packages enumerate their deltas in NUXIE_PATCH.md;
# the others remain byte-identical to crates.io.
luaur-ast = { path = "vendor/luaur-ast-0.1.8" }
luaur-bytecode = { path = "vendor/luaur-bytecode-0.1.8" }
luaur-common = { path = "vendor/luaur-common-0.1.8" }
luaur-compiler = { path = "vendor/luaur-compiler-0.1.8" }
luaur-rt = { path = "vendor/luaur-rt-0.1.8" }
luaur-vm = { path = "vendor/luaur-vm-0.1.8" }

# Browser WebGL2 source-parity fork: jpeg-decoder 0.3.2 with the pinned IJG
# libjpeg v9f component-scaling and integer-IDCT behavior.
jpeg-decoder = { path = "vendor/jpeg-decoder-0.3.2-rive-v9f" }

# Metadata-free audio fork (docs/symphonia-fork.md): the Apple runtime decodes
# audio samples but never exposes container tags or artwork. These component
# patches keep the exact Symphonia decoders while allowing that unused metadata
# path (and encoding_rs's charset tables) to be disabled.
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac-0.5.5" }
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3-0.5.5" }
symphonia-format-riff = { path = "vendor/symphonia-format-riff-0.5.5" }
symphonia-utils-xiph = { path = "vendor/symphonia-utils-xiph-0.5.5" }

# Vulkan campaign fork: vk-mem 0.5.0 with Rive's exact pinned VMA 3.3.0
# header, Vulkan SDK 1.4.321 headers, and authored dynamic-function predicate.
vk-mem = { path = "vendor/vk-mem-0.5.0" }

# Panic-freedom lint discipline for the runtime crates.
# Opted into per-crate via `lints.workspace = true` by the SDK runtime crates
# only (nuxie-audio, nuxie-runtime, nuxie-binary, nuxie-graph, nuxie-ore-metal,
# nuxie-schema, nuxie, nux-capi) --
# NOT the tools/ crates and NOT nuxie-scripting (active external work area).
# These are `[lints.clippy]` entries, so they fire only under `cargo clippy`
# (no cargo build/check noise). All three sit at WARN because the pre-existing
# site counts are far above one lane's fix budget (hundreds of indexing and
# arithmetic sites, ~170 unwraps; see `make lint-gate`); `make lint-gate`
# DENIES them per-crate wherever a crate is already clean (nuxie, nuxie-schema
# today) and reports the counts for the rest so the ratchet direction is
# visible. Escalate a lint to "deny" here once its last runtime-crate sites
# are cleared.
[workspace.lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# luaur implements Luau's protected-error/longjmp boundary with
# `panic_any`/`catch_unwind`. An aborting profile turns ordinary script errors
# (including errors caught by authored `pcall`) into process termination.
panic = "unwind"

# Dedicated size-optimized profile for the SDK cdylib. Does NOT affect the
# `release` profile the perf gate depends on. Build with `--profile
# release-size` (see `make size-report` / docs/SIZE.md). Levers here are the
# cheap size wins: size-first codegen (opt-level
# "z"), aggressive symbol stripping, and fat LTO carried over from release.
# Override opt-level ad hoc with CARGO_PROFILE_RELEASE_SIZE_OPT_LEVEL=s|3.
[profile.release-size]
inherits = "release"
opt-level = "z"
strip = "symbols"

# Customer Apple binaries must contain panics at the C boundary instead of
# aborting the host process. Keep the release optimizer/LTO settings while
# overriding the workspace release profile's panic strategy.
[profile.release-apple]
inherits = "release"
panic = "unwind"
strip = "debuginfo"
