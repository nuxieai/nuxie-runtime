[[findings]]
id = "SR-C093-01"
severity = "P1"
summary = "The source's generated shader headers provide mutually consistent exported short macro names and minified payload guards. The target emits those short keys but concatenates retained raw .minified.* payloads whose stage and feature guards remain unminified. Requested atlas, stage, clipping, advanced-blend, feather, and draw-mode branches therefore do not activate, causing affected shader compilation or behavior to fail."
citations = [
  "source:renderer/src/gl/render_context_gl_impl.cpp:22-37",
  "source:renderer/src/gl/render_context_gl_impl.cpp:471-567",
  "source:renderer/src/gl/render_context_gl_impl.cpp:1673-1797",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:80-153",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:1714-1782",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:2011-2207",
]

[[findings]]
id = "SR-C093-02"
severity = "P1"
summary = "The target's embedded resolve_atlas, blit_texture_as_draw, stencil_draw, and draw_msaa_object.frag literals use a stale internal minifier-symbol namespace inconsistent with the frozen generated headers and surrounding current chunks. Cross-chunk identifiers are undefined or rebound; notably, these literals use B3 as a declaration prefix while the current common payload defines B3 as pi. Atlas, blit, stencil, and MSAA shaders can consequently fail independently of SR-C093-01."
citations = [
  "source:renderer/src/gl/render_context_gl_impl.cpp:34-40",
  "source:renderer/src/gl/render_context_gl_impl.cpp:574-608",
  "source:renderer/src/gl/render_context_gl_impl.cpp:1849-1876",
  "source:renderer/src/gl/render_context_gl_impl.cpp:3214-3231",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:156-277",
