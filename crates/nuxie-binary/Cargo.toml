[package]
name = "nuxie-binary"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Synthetic record builders and shared bytes for tests/tools. This feature is
# deliberately absent from the runtime's default shipping API.
test-support = []

[dependencies]
anyhow = "1"
nuxie-schema = { path = "../nuxie-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[[test]]
name = "fixture_records"
required-features = ["test-support"]

# Opt into the workspace panic-freedom clippy lints (root Cargo.toml).
[lints]
workspace = true
