[[findings]]
id = "SR-C080-11"
severity = "P3"
summary = "makeImageTexture conflates a non-null zero-length data value with source's null-pointer/no-upload case. Source branches only when imageData is null; a non-null pointer takes the upload path. Target accepts a slice and returns without upload whenever image_data.is_empty(), collapsing the two source-visible states."
