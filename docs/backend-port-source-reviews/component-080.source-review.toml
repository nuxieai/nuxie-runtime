[[findings]]
id = "SR-C080-17"
severity = "P3"
summary = "Texture-upload size overflow arithmetic changed. Source performs unchecked unsigned 64-bit multiplication and then compares the wrapped result with UINT32_MAX; target uses checked_mul, maps overflow to u64::MAX, and reliably returns SizeOverflow. Inputs whose source multiplication wraps to a small value therefore follow different behavior."
citations = [
  "source:renderer/src/ore/vulkan/ore_texture_vulkan.cpp:167-185",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_texture_vulkan_cpp__impl.rs:192-210",
]

