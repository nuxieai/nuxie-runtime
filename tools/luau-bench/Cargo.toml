[package]
name = "luau-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs the upstream Luau bench suite in-process and checks results against a committed baseline."

[dependencies]
serde_json = "1"
# The `nuxie` VM: compile with the vendored compiler, run on nuxie-luau-vm.
luaur-ast = "=0.1.8"
luaur-bytecode = "=0.1.8"
luaur-common = "=0.1.8"
luaur-compiler = "=0.1.8"
nuxie-luau-vm = { path = "../../crates/nuxie-luau-vm" }
