[package]
name = "nuxie-product"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["js-host-seed"]
js-host-seed = ["nuxie/js-host-seed"]
renderer = ["nuxie/renderer"]
scripting = ["nuxie/scripting", "dep:nuxie-product-scripting"]
threading = ["nuxie/threading"]

[dependencies]
anyhow = "1"
nuxie = { path = "../nuxie", default-features = false }
nuxie-project-data = { path = "../nuxie-project-data" }
nuxie-product-scripting = { git = "https://github.com/nuxieai/nuxie-product", rev = "73b70caa0ee9fed060326a79d61e5698222593f1", optional = true }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
luaur-common = "=0.1.8"
luaur-compiler = "=0.1.8"
nuxie = { path = "../nuxie", default-features = false, features = ["test-support"] }
nuxie-binary = { path = "../nuxie-binary", features = ["test-support"] }
nuxie-render-stream = { path = "../nuxie-render-stream" }
nuxie-runtime = { path = "../nuxie-runtime", default-features = false }
nuxie-schema = { path = "../nuxie-schema" }
serde_json = "1"
sha2 = "0.10"
silver-corpus = { path = "../../tools/silver-corpus" }
