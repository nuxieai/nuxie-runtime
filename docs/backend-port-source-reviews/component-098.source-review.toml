[[findings]]
id = "SR-C098-02"
severity = "P2"
summary = "Core and Wagyu initializer macros are retained only as source-span metadata, without typed or executable initializers carrying their source defaults. This loses behavior such as WGPU_EXTENT_3D_INIT setting height/depth to 1 and WGPU_WAGYU_TEXTURE_DESCRIPTOR_INIT setting the chained sType and useSurfaceCache = true."
