[[findings]]
id = "SR-C094-01"
severity = "P3"
summary = "BuildLoadActionsEXT dereferences clearColor4f only for LoadAction::clear, permitting a null output pointer for non-clear actions. The target unconditionally requires &mut [f32; 4], narrowing that source-visible contract."
