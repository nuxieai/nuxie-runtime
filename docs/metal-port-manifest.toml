# These globs are intentionally exhaustive for the upstream native Metal
# platform implementation, the backend-neutral ORE interface consumed by
# Metal, the ORE Metal adapter, and the checked-in Metal shader sources.
source_globs = [
  "renderer/include/rive/renderer/metal/*",
  "renderer/src/metal/*",
  "renderer/include/rive/renderer/ore/ore_*.hpp",
  "renderer/src/ore/metal/*",
  "renderer/src/shaders/metal/*",
]
source_excludes = [
  "renderer/include/rive/renderer/ore/ore_context_d3d11.hpp",
  "renderer/include/rive/renderer/ore/ore_context_d3d12.hpp",
  "renderer/include/rive/renderer/ore/ore_context_gl.hpp",
  "renderer/include/rive/renderer/ore/ore_context_vulkan.hpp",
  "renderer/include/rive/renderer/ore/ore_context_wgpu.hpp",
]

