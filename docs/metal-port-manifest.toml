# Rust adaptation for the context/render-pass closure: raw context/pass
# back-pointers become ContextMetal -> Arc<ContextState> -> Weak active token,
# while each pass holds Weak<ContextState>; no retain cycle or dangling active
# pointer is representable. Checked backend downcasts fail closed where C++
# asserts. The declared deferred-bind-group vector is intentionally omitted
# because the pinned tree has no writer. Host canvas/Rive wrappers converge on
# one retained native-texture seam because their C++ host types live outside
# this isolated crate. Pinned Metal quirks remain observable: beginFrame ignores
# FrameDescriptor and preserves lastError, waitForGPU only sees the current
# recording buffer, invalid bind entries are skipped, and native pipeline
# errors route only to outError when supplied. Live context/render-pass tests
# cover factory publication, frame completion after context drop, exact
# compatibility/error order, stale-pass auto-finish, dynamic bindings, and all
# draw commands.
[[source]]
