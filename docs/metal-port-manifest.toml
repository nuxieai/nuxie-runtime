# Rust adaptation for the bind-group file closure: `BindGroup` holds each
# accepted layout/buffer/view/sampler logical resource exactly once. Metal
# buffer records replace the source raw `BufferMetal*` with a stable index into
# that owned buffer vector and resolve the live orphanable MTLBuffer only when
# the render-pass unit encodes it. Texture and sampler records retain the
# native handles copied by the C++ adapter. Constructors remain crate-private;
# `ContextMetal` owns descriptor validation, source-compatible skipped-entry
# selection, and last-error-wins publication. The pinned tree contains no
# writer for its declared deferred-bind-group vector, so Rust omits the dead
# raw context back-pointer instead of inventing a Lua-GC route. The owner,
# ordering,
# late-backing, native-retain, and wrong-resource tests are in the two Rust
# modules below.
