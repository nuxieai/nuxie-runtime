[package]
name = "nuxie-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Mirrors WITH_RIVE_EDITOR for incomplete authored paint objects.
editor = []
testing = [] # Upstream TESTING observations; test harnesses only.
# Mirrors upstream --no_ffp_contract for the strict unit/Silver lane.
# Shipping consumers, including default-features=false hosts, keep the
# production contraction boundaries unless this feature is explicitly selected.
strict-fp = ["nuxie-scripting/strict-fp"]
tools = []
threading = []
# WITH_RIVE_SCRIPTNET: compiled capability only; providers remain host opt-in.
scriptnet = ["dep:objc2", "dep:objc2-foundation", "dep:block2", "dep:dispatch2", "dep:web-time"]
# Mirrors upstream WITH_RIVE_TEST_SIGNATURE, independently of WITH_RIVE_TOOLS.
# Accepts the public sample signing key; never enable in a shipping build.
test-script-signature = []
# The pinned C++ browser build seeds nondeterministic randomness from
# performance.now() through a JS host. Host-free wasm embedders (the cold
# publisher) must stay import-free, so the JS seed is a default-on feature.
# Also supplies the monotonic browser clock for watermark playback. Import-free
# hosts install watermark::set_watermark_clock before instancing watermarked files.
js-host-seed = ["dep:js-sys", "dep:wasm-bindgen"]
default = ["js-host-seed"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytemuck = { version = "1.24", features = ["derive"] }
harfrust = "0.12"
nuxie-script-signature = { path = "../nuxie-script-signature" }
nuxie-audio = { path = "../nuxie-audio" }
nuxie-binary = { path = "../nuxie-binary" }
nuxie-image-codec = { path = "../nuxie-image-codec" }
nuxie-render-api = { path = "../nuxie-render-api" }
nuxie-schema = { path = "../nuxie-schema" }
skrifa = "0.45.1"
taffy = "=0.12.1"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-bidi = "0.3.18"
unicode-script = "0.5.8"
i_overlay = { version = "=8.1.1", default-features = false }

[dev-dependencies]
nuxie-scripting = { path = "../nuxie-scripting" }
nuxie-binary = { path = "../nuxie-binary", features = ["test-support"] }
nuxie-sriv = { path = "../nuxie-sriv" }
png = "0.18"
sha2 = "0.10"

[[test]]
name = "upstream_painted_bounds"
required-features = ["testing"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Performance"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
block2 = { version = "0.6.2", optional = true }
dispatch2 = { version = "0.3.1", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "NSURLSession", "NSURLRequest", "NSURLResponse", "NSURL",
    "NSURLAuthenticationChallenge", "NSURLProtectionSpace", "NSURLCredential",
    "NSHTTPCookieStorage", "NSURLCredentialStorage", "NSURLCache", "NSOperation",
    "NSData", "NSDate", "NSString", "NSError", "NSDictionary", "NSEnumerator",
    "NSObjCRuntime", "NSObject", "NSURLError", "NSRange", "block2", "std",
] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = { version = "1.1.0", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# Opt into the workspace panic-freedom clippy lints (root Cargo.toml).
[lints]
workspace = true
