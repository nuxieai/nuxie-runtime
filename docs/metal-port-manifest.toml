# The Rust leaf preserves verbatim capacities and the 1,2,0 physical-buffer
# rotation. A separate coordinator models upstream's blocking flush lock and
# transfers release responsibility from an abandon-safe pre-submit lease to an
# exact-once completion owner. Unlike upstream's nested ring, the standalone
# Rust ring explicitly retains the same device already owned by its containing
# context so its constructor borrow is independently safe. The current public
# frame remains synchronous; this row does not claim a public asynchronous
# submission API.
