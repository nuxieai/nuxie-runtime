[package]
name = "nuxie-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
inspect = ["dep:serde_json"]

[dependencies]
anyhow = "1"
nuxie-binary = { path = "../nuxie-binary" }
nuxie-schema = { path = "../nuxie-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "graph-inspect"
path = "src/bin/graph-inspect.rs"
required-features = ["inspect"]

# Opt into the workspace panic-freedom clippy lints (root Cargo.toml).
[lints]
workspace = true
