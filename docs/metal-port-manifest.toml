# Rust makes the upstream nil-library/assert failure observable as a typed,
# fail-closed result while preserving the submitted source. The focused
# `reports_backend_plan_and_synthesized_failures_without_stopping_worker` and
# `failure_source_listing_matches_upstream_line_numbers` tests cover it.
# The injected callback is an observability seam; `new_metal` still retains the
# device and executes `newLibraryWithSource`. The focused
# `live_metal_compiles_the_materialized_image_mesh_source` test covers it.
# Promotion requires that device-backed test to execute and pass; a no-device
# skip alone is insufficient. It executed on the macOS Metal host for this wave.
