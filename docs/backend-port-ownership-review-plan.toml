make_check_recipe = "PYTHONDONTWRITEBYTECODE=1 python3 \"$(BACKEND_PORT_OWNERSHIP_REVIEW_TOOL)\" --repo-root \"$(CURDIR)\" --upstream-root \"$(RIVE_RUNTIME_DIR)\" --manifest \"$(BACKEND_PORT_CAMPAIGN)\""
