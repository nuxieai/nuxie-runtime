# Secondary cross-backend oracle policy for the native Metal tracer slice.
#
# Keep this separate from tracer-corpus.toml so WGPU's backend-specific edge
# rasterization tolerance can never weaken the pinned C++ Metal parity gate.

[[entry]]
id = "native-metal-first-light-rectangle"
kind = "gm-stream"
stream = "fixtures/renderer/streams/first-light-rectangle.rive-stream"
reference = "fixtures/renderer/reference/metal/first-light-rectangle.png"
mode = "clockwise-atomic"
backend = "metal"
status = "exact"
max_channel_delta = 0
max_different_pixels = 0

[[entry]]
id = "native-metal-first-light-gradient-cubic"
kind = "gm-stream"
stream = "fixtures/renderer/streams/first-light-gradient-cubic.rive-stream"
reference = "fixtures/renderer/reference/metal/first-light-gradient-cubic.png"
mode = "clockwise-atomic"
backend = "metal"
status = "exact"
max_channel_delta = 35
max_different_pixels = 0

[[entry]]
id = "native-metal-first-light-atlas-feather-stroke"
kind = "gm-stream"
stream = "fixtures/renderer/streams/first-light-atlas-feather-stroke.rive-stream"
reference = "fixtures/renderer/reference/metal/first-light-atlas-feather-stroke-clockwise-atomic.png"
mode = "clockwise-atomic"
backend = "metal"
status = "exact"
max_channel_delta = 2
