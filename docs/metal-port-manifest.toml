# Rust adaptation for the bind-group-layout pair: the pinned Metal context
# writes `m_context` but no pinned reader consumes it, so the Rust leaf omits
# that raw pointer and relies on `ResourceHandle`'s manager for deferred
# release. `bind_group_layout_context_payload_copies_entries_and_has_metal_identity`
# proves the copied payload and checked Metal backend identity;
# `pre_first_frame_release_waits_even_when_frame_zero_is_caught_up` proves the
# shared manager retains a zero-reference payload until its safe frame.
# `ContextMetal` now owns group-range validation and context error publication.
[[source]]
