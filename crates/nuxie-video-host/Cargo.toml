[package]
name = "nuxie-video-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nuxie-runtime = { path = "../nuxie-runtime" }
nuxie-render-api = { path = "../nuxie-render-api" }

[build-dependencies]
cc = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Performance", "Window", "Document", "Element", "HtmlVideoElement", "HtmlMediaElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "MediaError", "Blob", "BlobPropertyBag", "Url"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
nuxie-binary = { path = "../nuxie-binary", features = ["test-support"] }
nuxie-schema = { path = "../nuxie-schema" }
