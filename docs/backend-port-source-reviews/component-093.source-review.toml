  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:2174-2193",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:2957-2976",
]

[[findings]]
id = "SR-C093-03"
severity = "P2"
summary = "makeShaderModule validates and parses binding-map and GL-fixup sidecars before target shader creation and compilation. The source creates, compiles, and checks the shader first, applying the binding map only after successful compilation. Malformed sidecars therefore change error precedence and suppress source-visible GL creation/compile side effects."
citations = [
  "source:renderer/src/ore/gl/ore_context_gl.cpp:558-617",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_ore_gl_ore_context_gl_cpp__impl.rs:618-727",
]

[[findings]]
id = "SR-C093-04"
severity = "P2"
summary = "The source beginRenderPass finishes a previously registered pass and returns the newly constructed pass without registering it. The target additionally publishes every new pass through setActiveRenderPass. This changes the immediate activeRenderPass result and causes later context operations to implicitly finish passes that source callers did not explicitly register."
citations = [
  "source:renderer/src/ore/gl/ore_context_gl.cpp:943-950",
  "source:renderer/src/ore/gl/ore_context_gl.cpp:1116-1144",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_ore_gl_ore_context_gl_cpp__impl.rs:1344-1350",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_ore_gl_ore_context_gl_cpp__impl.rs:1609-1628",
]

[[findings]]
id = "SR-C093-05"
severity = "P3"
summary = "Several source-valid omission forms are absent. Source callers may omit outError from makePipeline and beginRenderPass, omit the two optional bindMSAAFramebuffer outputs, and omit authored trailing defaults from six RenderPassGL commands. Target signatures require every Option and scalar argument and provide no corresponding convenience forms."
citations = [
  "source:renderer/include/rive/renderer/ore/ore_context_gl.hpp:30-40",
