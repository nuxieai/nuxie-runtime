[package]
name = "nuxie-renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["rust-wgpu"]
rust-wgpu = ["dep:naga", "dep:wgpu"]
apple-msl-capture = ["rust-wgpu"]
apple-msl-replay = ["rust-wgpu", "dep:wgpu-hal", "wgpu-hal/apple-msl-replay"]
# Compiles the explicit, dormant trusted authored-MSL factory profile. The
# shipping `apple-runtime` feature does not enable this cutover gate.
apple-authored-msl = ["rust-wgpu", "dep:wgpu-hal"]
# Builds the dormant native Metal adapter while the Apple product continues to
# select the established wgpu renderer by default.
native-metal-experimental = []
with-rive-tools = ["nuxie-ore-metal?/with-rive-tools"]
track-rive-shader-id = ["nuxie-ore-metal?/track-rive-shader-id"]
# Wires the pinned RIVE_CANVAS ORE constructor to the exact native renderer
# device and queue. This stays opt-in until the native renderer cutover.
native-ore-metal-experimental = ["native-metal-experimental", "dep:nuxie-ore-metal"]
# Exact mechanical predicates for the pinned renderer's optional source paths.
rive-generate-feather-lut = []
rive-ktx2 = []
rive-decoders = []
# Exact `ORE_BACKEND_GL && RIVE_CANVAS` predicate for the GL-only canvas
# import helper. It is intentionally independent of the Metal canvas feature.
ore-gl = []
perf-diagnostics = ["rust-wgpu"]
perf-counters = ["rust-wgpu"]
# Exposes a deliberately narrow, doc-hidden seam into production-compiled
# algorithms for Criterion. It is opt-in, but must be maintained with those
# internals; this avoids test-only instrumentation and copied private modules.
upstream-microbenchmarks = ["rust-wgpu", "dep:libc"]

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
futures-channel = "0.3"
libc = { version = "0.2", optional = true }
nuxie-image-codec = { path = "../nuxie-image-codec" }
nuxie-render-api = { path = "../nuxie-render-api" }
naga = { version = "30.0.0", features = ["wgsl-in"], optional = true }
regex = "1"
smallvec = "1.15.2"
sha2 = "0.10"
# Keep the parity-critical core/HAL patches transitive for git and path
# consumers. The vendored top-level package wires both patched crates by path.
wgpu = { version = "=30.0.0", path = "../../vendor/wgpu-30.0.0", optional = true }

[build-dependencies]
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos", target_os = "visionos"))'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["block2", "MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLSampler", "MTLTexture", "MTLTypes"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }
nuxie-ore-metal = { path = "../nuxie-ore-metal", optional = true }
wgpu-hal = { version = "=30.0.0", path = "../../vendor/wgpu-hal-30.0.0", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos", target_os = "visionos"))'.dev-dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes", "objc2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
naga = { version = "30.0.0", features = ["wgsl-in"] }
nuxie-binary = { path = "../nuxie-binary" }
nuxie-graph = { path = "../nuxie-graph" }
nuxie-render-stream = { path = "../nuxie-render-stream" }
nuxie-runtime = { path = "../nuxie-runtime" }
png = "0.18"
wgpu = { version = "=30.0.0", path = "../../vendor/wgpu-30.0.0" }

[[example]]
name = "native_metal_tracer_root"
required-features = ["native-metal-experimental"]

[[bench]]
name = "upstream_microbenchmarks"
harness = false
required-features = ["upstream-microbenchmarks"]
