[package]
name = "apple-msl-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
naga = { version = "30.0.0", features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu-hal = { version = "=30.0.0", path = "../../vendor/wgpu-hal-30.0.0", features = ["metal"] }
wgpu-types = { version = "=30.0.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
