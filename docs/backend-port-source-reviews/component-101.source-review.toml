[[findings]]
id = "SR-C101-06"
severity = "P3"
summary = "Several source-call affordances are absent: authored default arguments for mapped-range and encoder operations, the single-Future Instance::WaitAny overload, and TextureComponentSwizzle equality/inequality. Target methods require every raw argument, expose only general WaitAny, and alias the swizzle aggregate without those operators."
