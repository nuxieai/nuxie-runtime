findings = [{ id = "OR-C071-01", severity = "P2", summary = "VulkanContext collapses 64 separately published instance and device dispatch fields into aggregate ash loaders plus four optional PFNs, hiding source fields whose identity and construction order are part of the frozen layout authority.", review_domains = ["field-and-layout", "unsafe-ffi-and-abi"], citations = ["source:renderer/include/rive/renderer/vulkan/vulkan_context.hpp:64-140", "source:renderer/src/vulkan/vulkan_context.cpp:46-55", "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_include_rive_renderer_vulkan_vulkan_context_hpp__decl.rs:46-90", "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_vulkan_context_cpp__impl.rs:37-55"], authority_keys = ["component:component-071"] }, { id = "OR-C071-02", severity = "P1", summary = "Safe Buffer construction transmutes BufferCreateInfo with a caller-bounded lifetime to static and resizeImmediately later reuses it through VMA, so safe callers can drop p_next or queue-family backing before safe reuse.", review_domains = ["provenance-and-aliasing", "unsafe-ffi-and-abi"], citations = ["source:renderer/include/rive/renderer/vulkan/vkutil.hpp:151-183", "source:renderer/src/vulkan/vkutil.cpp:56-80", "source:renderer/src/vulkan/vkutil.cpp:98-112", "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_vulkan_vkutil_cpp__impl.rs:57-96"], authority_keys = ["component:component-071"] }, { id = "OR-C071-03", severity = "P1", summary = "The source selects externally synchronized VMA for a single-threaded owner, but the target preserves that flag while exposing the context through Arc and safe allocation APIs without an owner-thread or locking invariant.", review_domains = ["callbacks-and-threading", "synchronization-and-mapping", "unsafe-ffi-and-abi"], citations = ["source:renderer/src/vulkan/vulkan_context.cpp:12-32", "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_include_rive_renderer_vulkan_vul