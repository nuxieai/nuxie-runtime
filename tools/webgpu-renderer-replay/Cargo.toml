[package]
name = "webgpu-renderer-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nuxie-render-stream = { path = "../../crates/nuxie-render-stream" }
wasm-bindgen = "0.2"

[dependencies.nuxie-renderer]
path = "../../crates/nuxie-renderer"
default-features = false
features = ["renderer-webgpu", "rive-decoders"]
