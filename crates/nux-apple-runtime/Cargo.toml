[package]
name = "nux-apple-runtime"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
apple-product = [
    "dep:dispatch2",
    "nuxie/renderer",
    "nuxie/scripting",
    "nuxie-product/renderer",
    "nuxie-product/scripting",
    "dep:nuxie-apple-adapter",
]
migration-distribution = [
    "apple-product",
    "dep:nux-capi",
    "nux-capi/apple-metal",
    "nux-capi/scripting",
]

[dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"], optional = true }
nux-container = { path = "../nux-container" }
nux-capi = { path = "../nux-capi", default-features = false, optional = true }
nuxie = { path = "../nuxie", default-features = false }
nuxie-product = { path = "../nuxie-product", default-features = false }
nuxie-apple-adapter = { path = "../nuxie-apple-adapter", optional = true }
sha2 = "0.10"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
nuxie = { path = "../nuxie", default-features = false, features = ["scripting"] }
nuxie-product = { path = "../nuxie-product", default-features = false, features = ["scripting"] }
nuxie-schema = { path = "../nuxie-schema" }
png = "0.18"
serde_json = "1"

[[test]]
name = "experience_package_validator"
path = "tests/experience_package_validator.rs"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dev-dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice", "MTLDrawable", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }

[build-dependencies]
cbindgen = "=0.29.2"
sha2 = "0.10"

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
