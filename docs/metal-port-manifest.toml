# Rust adaptation for the file-local pipeline closure: `PipelineSnapshot`
# deep-copies strings, vertex layouts/attributes, and scalar state while
# retaining module/layout resource handles. Its fixed layout array is the sole
# owner for upstream's strong `m_layouts`; the shallow descriptor's layout
# pointers become views of that same array, avoiding an extra logical owner.
# The Metal leaf can retain an already-created render state and optional depth
# state; descriptor conversion, layout/module validation, native creation, and
# error publication now live in the compiled context/render-pass unit.
# `pipeline_snapshot_owns_nested_descriptor_values_and_handles` and
# `pipeline_retains_only_the_first_four_layouts_once` prove the deep snapshot
# and exact logical refcounts. The live Metal
# `native_states_publish_together_and_own_portable_dependencies` proves
# all-or-nothing publication, exact native-state identity while live, and
# portable-owner release. Metal may cache immutable state objects, so weak
# native deallocation is deliberately not used as an oracle. Field declaration
# order separately encodes C++'s depth-state, render-state, then portable-base
# destruction order.
[[source]]
