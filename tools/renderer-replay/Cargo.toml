[package]
name = "renderer-replay"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["rust-wgpu"]
rust-wgpu = ["dep:nuxie-renderer"]
native-metal = [
  "dep:nuxie-render-api",
  "dep:nuxie-renderer",
  "dep:objc2",
  "dep:objc2-core-foundation",
  "dep:objc2-metal",
  "dep:objc2-quartz-core",
  "nuxie-renderer/native-metal-experimental",
]
apple-msl-replay = ["rust-wgpu", "nuxie-renderer/apple-msl-replay"]
ffi = ["dep:nuxie-renderer-ffi"]
perf-dawn = ["ffi", "nuxie-renderer-ffi/dawn"]
perf-diagnostics = ["rust-wgpu", "nuxie-renderer/perf-diagnostics"]
perf-counters = [
  "perf-dawn",
  "rust-wgpu",
  "nuxie-renderer/perf-counters",
  "nuxie-renderer-ffi/perf-counters",
]

[dependencies]
nuxie-render-stream = { path = "../../crates/nuxie-render-stream" }
nuxie-render-api = { path = "../../crates/nuxie-render-api", optional = true }
nuxie-renderer = { path = "../../crates/nuxie-renderer", optional = true }
nuxie-renderer-ffi = { path = "../../crates/nuxie-renderer-ffi", features = ["native"], optional = true }
perf-compare = { path = "../perf-compare" }
pixel-compare = { path = "../pixel-compare" }
serde_json = "1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes", "objc2"], optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice", "MTLPixelFormat"], optional = true }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"], optional = true }

[[bin]]
name = "native-metal-product-root"
path = "src/bin/native-metal-product-root.rs"
required-features = ["native-metal"]

[[bin]]
name = "renderer-perf-rust-runner"
path = "src/bin/renderer-perf-rust-runner.rs"
required-features = ["ffi", "rust-wgpu"]

[[bin]]
name = "renderer-perf-cpp-runner"
path = "src/bin/renderer-perf-cpp-runner.rs"
required-features = ["perf-dawn", "rust-wgpu"]
