<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebGL2 source oracle</title>
  </head>
  <body data-status="loading">
    <canvas id="canvas" width="1" height="1"></canvas>
    <pre id="status">loading pinned WebGL2 source oracle</pre>
    <script>
      const status = document.querySelector("#status");
      const stdout = [];
      const stderr = [];
      let resolveRuntime;
      window.webgl2OracleReady = new Promise((resolve) => {
        resolveRuntime = resolve;
      });
      window.Module = {
        canvas: document.querySelector("#canvas"),
        noInitialRun: true,
        print: (line) => stdout.push(String(line)),
        printErr: (line) => stderr.push(String(line)),
        onRuntimeInitialized: () => {
          document.body.dataset.status = "ready";
          status.textContent = "ready: pinned C++ WebGL2 source oracle";
          resolveRuntime();
        },
      };

      window.runWebgl2Oracle = async ({ stream, mode, frame = 0 }) => {
        await window.webgl2OracleReady;
        stdout.length = 0;
        stderr.length = 0;
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const input = `/oracle-${suffix}.rive-stream`;
        const output = `/oracle-${suffix}.png`;
        Module.FS.writeFile(input, stream);
        try {
          const exitCode = Module.callMain([
            "--stream",
            input,
            "--output",
            output,
            "--backend",
            "ffi-webgl2",
            "--mode",
            mode,
            "--frame",
            String(frame),
          ]);
          const png = Module.FS.readFile(output);
          const digest = await crypto.subtle.digest("SHA-256", png);
          const sha256 = Array.from(new Uint8Array(digest), (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");
          let binary = "";
          for (let offset = 0; offset < png.length; offset += 32768) {
            binary += String.fromCharCode(...png.subarray(offset, offset + 32768));
          }
          const result = {
            exitCode,
            stdout: [...stdout],
            stderr: [...stderr],
            pngBase64: btoa(binary),
            pngBytes: png.length,
            sha256,
          };
          document.body.dataset.status = exitCode === 0 ? "passed" : "failed";
          status.textContent = JSON.stringify(
            { ...result, pngBase64: `${png.length} encoded bytes` },
            null,
            2,
          );
          return result;
        } finally {
          try {
            Module.FS.unlink(input);
          } catch (_) {}
          try {
            Module.FS.unlink(output);
          } catch (_) {}
        }
      };
    </script>
    <script src="/target/renderer-webgl2-live-reference-1.91/wasm32-unknown-emscripten/release/renderer-replay.js"></script>
  </body>
</html>
