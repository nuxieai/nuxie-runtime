[package]
name = "rust-golden-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The scripted runner, on the safe Luau VM (nuxie-scripting's default `luau`).
scripting = ["dep:nuxie-scripting"]
# The scripted runner on the vendored VM (docs/luau-safe-vm-plan.md, Phase 3
# opt-out): nuxie-scripting's `vendored-vm` setting.
scripting-vendored-vm = ["scripting", "nuxie-scripting/vendored-vm"]
coverage-trace = []

[dependencies]
anyhow = "1"
nuxie-binary = { path = "../../crates/nuxie-binary" }
nuxie-render-api = { path = "../../crates/nuxie-render-api" }
nuxie-runtime = { path = "../../crates/nuxie-runtime", features = ["tools"] }
nuxie-schema = { path = "../../crates/nuxie-schema" }
nuxie-scripting = { path = "../../crates/nuxie-scripting", optional = true }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# proc_pid_rusage retired-instruction counts (RIVE_GOLDEN_INSTRUCTIONS).
libc = "0.2"

[dev-dependencies]
nuxie-binary = { path = "../../crates/nuxie-binary", features = ["test-support"] }
