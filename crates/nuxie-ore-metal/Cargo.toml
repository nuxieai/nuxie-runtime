[package]
name = "nuxie-ore-metal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
tools = []

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
