# checked-in files and the evidence is green. It changes to verified only after
# checked-in `parity_evidence` records the issue-level parity gates. A
# time-boxed side-by-side review is optional and is not manifest promotion
# evidence.

[[source]]
upstream = "renderer/include/rive/renderer/metal/render_context_metal_impl.h"
lane = "renderer-platform"
issue = "UNIV-2086"
status = "in-progress"
# Adaptation: the upstream context permits a nil queue until the product sets
# it. The explicitly selected Rust factory creates its retained queue during
# context construction, then `begin_frame` fails closed if that queue cannot
# return the one concrete command buffer owned by the frame. Context policy
# tests cover missing acquisition and completion errors; the live tracer test
# covers successful completion and abandoned-frame reuse.
# Wave four additionally adapts the upstream product-supplied target-texture
# seam to a caller-acquired drawable: the native renderer validates its BGRA
# texture, borrows its presentation owner, commits rendering, then uses the
# next command buffer from the same queue for presentation, matching
# `renderer/path_fiddle/fiddle_context_metal.mm:65-84,100-120,186-191`. The
# live layer test covers the real drawable path; product selection remains
# deferred to UNIV-2092.
rust_modules = [
  "crates/nuxie-renderer/src/apple_surface.rs",
  "crates/nuxie-renderer/src/native_metal/buffer.rs",
  "crates/nuxie-renderer/src/native_metal/context.rs",
  "crates/nuxie-renderer/src/native_metal/draw_shader.rs",
  "crates/nuxie-renderer/src/native_metal/image_texture.rs",
  "crates/nuxie-renderer/src/native_metal/mod.rs",
  "crates/nuxie-renderer/src/native_metal/render_target.rs",
  "crates/nuxie-renderer/src/native_metal/samplers.rs",
  "crates/nuxie-renderer/src/native_metal/drawable.rs",
]
evidence = [
