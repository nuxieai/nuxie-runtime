[[findings]]
id = "SR-SUP-01"
severity = "P1"
summary = "The shared RenderContext and Factory canvas contract is wired as Metal/Vulkan-only even though the shared OreContext identity enum has WGPU and GL variants. Under native WebGPU or WebGL2, RenderContext has no ORE slot or canvas/ORE methods, Factory::ore returns null, and the helper contract omits native WebGPU entirely, so the exact WGPU and GL implementations cannot expose their authored canvas/ORE surface through the generic factory."
citations = [
  "support:crates/nuxie-renderer/src/mechanical_port/source/include/rive/factory_hpp.rs:109-135",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_hpp.rs:2183-2188",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_hpp.rs:2408-2445",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_helper_impl_hpp.rs:342-356",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_helper_impl_hpp.rs:436-450",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/src/render_context_cpp.rs:4480-4497",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/src/render_context_cpp.rs:7491-7501",
  "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/src/render_context_cpp.rs:7577-7583",
]

[[findings]]
id = "SR-SUP-02"
severity = "P1"
summary = "The WebGPU C++ support generator cannot materialize the complete facade it claims to generate. It reduces all 288 parsed C++ method definitions to owner/name metadata, while executable object methods are synthesized only from the 199 raw C entry points; StringView is only a raw alias, and raw free functions are emitted only as name metadata. Because the generator writes the integrated webgpu_cpp facade module as its sole output, source-required signature and method-body behavior cannot reach that facade. Observable losses include typed callback setup and overloads, StringView construction/conversion, output initialization before raw calls, namespace facade functions, and authored overload/default-argument affordances."
citations = [
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:2-9",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:203-216",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:241-247",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:299-360",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:386-404",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:466-478",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:501-520",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:581-581",
  "support:crates/nuxie-renderer/src/mechanical_port.rs:186-189",
]

[[findings]]
id = "SR-SUP-03"
severity = "P2"
summary = "The backend-neutral RenderPass::populateAttachmentMetadata implementation hard-downcasts every color and depth attachment to TextureViewMetal. Vulkan, WGPU, and GL TextureView objects are skipped, leaving shared color/depth formats and sample count at defaults unless each backend bypasses the authored shared operation and injects metadata through a separate side channel."
citations = [
  "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_context_hpp.rs:44-45",
  "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_context_hpp.rs:460-498",
  "support:crates/nuxie-ore-metal/src/lib.rs:313-325",
]

[[findings]]
id = "SR-SUP-04"
severity = "P2"
summary = "The WebGPU C++ support generator derives structure Default implementations exclusively from C-header initializer macros and aliases ordinary C++ facade aggregates to raw C structs; it never parses or emits C++ member initializers. The generated facade therefore cannot preserve C++-authored aggregate defaults, including BindGroupLayoutEntry's inactive BindingNotUsed values and e2D view-dimension defaults."
citations = [
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:85-123",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:164-182",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:386-396",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:431-478",
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:581-581",
]

[[findings]]
id = "SR-SUP-05"
severity = "P2"
summary = "The advertised linked-only vk-mem feature leaves pVulkanFunctions null while native VMA is always built with static loading disabled and dynamic loading enabled. Allocator initialization therefore reaches the dynamic importer with a zeroed table, causing debug builds to fail its missing-proc-address assertion and non-asserting builds to call a null vkGetInstanceProcAddr."
citations = [
  "support:vendor/vk-mem-0.5.0/Cargo.toml:60-64",
  "support:vendor/vk-mem-0.5.0/build.rs:17-26",
  "support:vendor/vk-mem-0.5.0/src/lib.rs:69-103",
  "support:vendor/vk-mem-0.5.0/src/lib.rs:160-166",
  "support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:13087-13102",
  "support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:13189-13204",
  "support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:13312-13330",
]

[[findings]]
id = "SR-SUP-06"
severity = "P2"
summary = "vk-mem get_physical_device_properties passes a struct address as a pointer-to-pointer output, so VMA overwrites the struct prefix with an internal pointer and the wrapper returns corrupted properties instead of dereferencing the returned pointer."
citations = [
  "support:vendor/vk-mem-0.5.0/src/ffi.rs:552-557",
  "support:vendor/vk-mem-0.5.0/src/lib.rs:172-181",
  "support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:15257-15263",
]

