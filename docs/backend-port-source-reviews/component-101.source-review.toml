summary = "StringView is collapsed to a raw WGPUStringView alias with only Default. The source constructors from string views, C strings, explicit data/length, WGPUStringView, nullptr, and nullopt, together with IsUndefined and the WGPU_STRLEN-aware conversion branches, have no executable target counterpart."
