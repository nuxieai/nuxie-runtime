severity = "P2"
summary = "The delegated executable translation's HLSL-register recognition consumes the first character after t, s, u, or b without verifying that it is numeric. Ordinary identifiers such as uv are consequently treated as reserved and left unrenamed, whereas the source requires every suffix character to be a digit."
