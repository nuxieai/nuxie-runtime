rule = "The compiler retains metal_features and platform beside shared.pending_jobs, shared.finished_jobs, shared.should_quit, both condition variables, the one-shot compiler callback, and at most one lazily started worker handle; pending work is FIFO, completion publication is LIFO, and drop signals quit and joins before releasing the native callback and its retained device."
citations = ["cpp:renderer/src/metal/background_shader_compiler.h:17-61", "cpp:renderer/src/metal/background_shader_compiler.mm:28-93", "cpp:renderer/src/metal/background_shader_compiler.mm:277-344"]
