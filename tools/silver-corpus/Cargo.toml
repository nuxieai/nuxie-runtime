[package]
name = "silver-corpus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
nuxie-render-api = { path = "../../crates/nuxie-render-api" }
nuxie-runtime = { path = "../../crates/nuxie-runtime", features = ["tools"] }
nuxie-scripting = { path = "../../crates/nuxie-scripting", features = ["upstream-test-seams"] }
nuxie-sriv = { path = "../../crates/nuxie-sriv" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
luaur-rt = "=0.1.8"
luaur-vm = "=0.1.8"
luaur-common = "=0.1.8"
luaur-compiler = "=0.1.8"
