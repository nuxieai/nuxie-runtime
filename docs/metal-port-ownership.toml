# upload/uniform rings now preserve upstream's verbatim capacities and 1,2,0
# rotation behind a blocking abandon/completion coordinator. The third slice
# adds the eighth triangle ring, the retained R16Float feather atlas, exact
# fill/stroke mask pipelines, and a live atlas blit. The same-flush checkpoint
# adds joint packing, flush-wide tessellation relocation, pinned mask-batch
# ordering/coalescing, and lazy specialized AtlasBlit + dither realization.
