# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "taffy"
version = "0.15.0"
edition = "2021"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
path = "lib.rs"
name = "taffy"

[features]
"alloc" = []
"block_layout" = []
"calc" = []
"content_size" = []
"debug" = ["std"]
"__bazel_dependency_default" = ["std", "taffy_tree", "flexbox", "flexbox_balance", "grid", "block_layout", "float_layout", "calc", "content_size", "detailed_layout_info"]
"detailed_layout_info" = []
"flexbox" = []
"flexbox_balance" = ["flexbox"]
"float_layout" = []
"grid" = ["dep:smallvec"]
"parse" = ["dep:cssparser"]
"parse_faster" = ["parse", "cssparser/fast_match_byte"]
"profile" = ["std"]
"serde" = ["dep:serde", "serde/alloc"]
"std" = ["serde?/std", "slotmap?/std"]
"strict_provenance" = []
"taffy_tree" = ["dep:slotmap"]
"default" = []

[dependencies]
"cssparser" = { "version" = "0.37.0", "optional" = true, "default-features" = false }
"document-features" = { "version" = "0.2.7", "optional" = true }
"serde" = { "version" = "1.0", "features" = ["serde_derive"], "optional" = true, "default-features" = false }
"slotmap" = { "version" = "1.0.6", "optional" = true, "default-features" = false }
"smallvec" = { "version" = "1.13", "optional" = true, "default-features" = false }
