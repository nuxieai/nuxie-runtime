[package]
name = "nuxie"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["js-host-seed"]
js-host-seed = ["nuxie-runtime/js-host-seed", "nuxie-scripting?/js-host-seed"]
renderer-metal = ["dep:nuxie-renderer", "nuxie-renderer/renderer-metal"]
renderer-vulkan = ["dep:nuxie-renderer", "nuxie-renderer/renderer-vulkan"]
renderer-webgpu = ["dep:nuxie-renderer", "nuxie-renderer/renderer-webgpu"]
renderer-webgl2 = ["dep:nuxie-renderer", "nuxie-renderer/renderer-webgl2"]
ore-metal-authored-msl = [
    "scripting",
    "nuxie-scripting/apple-authored-msl",
    "dep:nuxie-ore-metal",
    "dep:objc2",
    "dep:objc2-metal",
]
threading = ["nuxie-runtime/threading"]
test-support = []
scripting = [
    "dep:nuxie-scripting",
    "nuxie-scripting?/luau",
]

[dependencies]
anyhow = "1"
nuxie-binary = { path = "../nuxie-binary" }
nuxie-graph = { path = "../nuxie-graph" }
nuxie-render-api = { path = "../nuxie-render-api" }
nuxie-renderer = { path = "../nuxie-renderer", optional = true, default-features = false }
nuxie-runtime = { path = "../nuxie-runtime", default-features = false }
nuxie-schema = { path = "../nuxie-schema" }
nuxie-scripting = { path = "../nuxie-scripting", optional = true, default-features = false }
sha2 = "0.10"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
nuxie-ore-metal = { path = "../nuxie-ore-metal", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["MTLAllocation", "MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }

[dev-dependencies]
luaur-common = "=0.1.8"
luaur-compiler = "=0.1.8"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Self dev-dependency: integration tests build the library without cfg(test),
# so the test-support feature must be enabled for the test-only import surface
# (e.g. `File::import_with_unsigned_scripts`) to remain visible to them.
nuxie = { path = ".", default-features = false, features = ["test-support"] }
nuxie-binary = { path = "../nuxie-binary", features = ["test-support"] }
nuxie-render-stream = { path = "../nuxie-render-stream" }
nuxie-schema = { path = "../nuxie-schema" }
serde_json = "1"
silver-corpus = { path = "../../tools/silver-corpus" }

# This crate is fully CLEAN on the workspace panic-freedom clippy lints (see
# [workspace.lints.clippy] in the root Cargo.toml), so it pins them at DENY
# here (a crate lints table cannot combine `workspace = true` with overrides).
# `make lint-gate` / CI enforce this on the library target.
[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
