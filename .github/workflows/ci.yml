name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      backend_port_browser_closeout:
        description: Run only the full Windows/Linux exact browser-port matrix
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Hosted macOS capacity is far below the demand of every push and PR sync
# queueing ~6 macOS jobs each. GitHub silently cancels any job still queued
# after 24 hours (conclusion flips to `cancelled` with no log), which is how
# the trusted golden-compare gate stopped reporting on main -- the 9684cdf7
# divergence landed unseen exactly this way. Collapse superseded runs instead
# of queueing them: on branches and PRs a newer sync cancels the in-flight
# run; on main an in-flight run always finishes (its per-commit gate evidence
# is load-bearing) and a newer push only replaces the one *pending* run,
# which then reports an explicit `cancelled` rather than expiring silently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Current sync-pin runtime/golden/perf candidate. The renderer-golden job
  # overrides this with the historical renderer-port oracle revision that
  # produced its checked-in reference artifacts.
  RIVE_RUNTIME_REF: 4ac7b32798da0482e441ef09304dc3b480ed3ee5
  # Read-only inventory reference for port-manifest completeness. MUST equal
  # `upstream_ref` in port-manifest.toml -- the check compares them and fails
  # on any mismatch. Advance both together: b647c854 moved the manifest to
  # 4ac7b327 and left this at the old b73bc675 seed, which failed the job.
  PORT_MANIFEST_RIVE_RUNTIME_REF: 4ac7b32798da0482e441ef09304dc3b480ed3ee5
  RIVE_RUNTIME_DIR: ${{ github.workspace }}/rive-runtime
  RIVE_PREMAKE_TAG: v5.0.0-beta7
  DEPOT_TOOLS_REF: 1709e20d5ca2afe97bfa726168719c3b77eb9883

jobs:
  # On pull requests this workflow definition is part of the proposed change,
  # so every local reusable-workflow job stays on an ephemeral GitHub-hosted
  # runner (and the nuxie-macos runner group would refuse the non-main ref
  # anyway). Pushes to main and dispatches on main run the reusable workflow
  # at refs/heads/main, which the nuxie-macos runner group admits, so they
  # use the self-hosted pool and stay out of the saturated hosted macOS
  # queue.
  trusted-macos-ci:
    name: Trusted macOS
    if: ${{ inputs.backend_port_browser_closeout != true }}
    uses: ./.github/workflows/_trusted-macos.yml
    with:
      force_hosted: ${{ github.ref != 'refs/heads/main' }}

  port-manifest:
    name: Upstream C++ port manifest
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Checkout reference rive-runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.PORT_MANIFEST_RIVE_RUNTIME_REF }}
          path: rive-runtime

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Each -gate target runs the tool's unit tests AND the check it performs,
      # reporting both verdicts. They used to be one target where the tests
      # were a prerequisite, so a red suite meant the check never ran and any
      # real drift underneath stayed hidden.
      - name: Verify upstream C++ port manifest
        run: make port-manifest-gate

      # if: always() so a port-manifest failure above cannot hide an
      # attribution failure here -- they are independent verdicts.
      - name: Verify Rust attribution coverage
        if: ${{ !cancelled() }}
        run: make rust-attribution-gate

      # File-level correspondence cannot detect a new inline setter, callback,
      # lifecycle hook, or handwritten item inside an already-known source.
      - name: Verify runtime behavior member and item inventory
        if: ${{ !cancelled() }}
        run: make runtime-behavior-inventory

      # The boundary test and live workspace check are independent verdicts. This
      # runs on Ubuntu because it parses every declared dependency table,
      # including Apple target and optional feature tables, without compiling.
      - name: Verify pure-runtime dependency boundary
        if: ${{ !cancelled() }}
        run: make pure-runtime-boundary-gate

      # Pins the exact 20-name registry and verifies every checked-in input is
      # the deterministic conversion of the pinned upstream source bytes.
      - name: Verify upstream microbenchmark mirror
        if: ${{ !cancelled() }}
        run: make microbench-gate

  runtime-differential-tooling:
    name: Runtime differential tooling
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify report and stale-runner guards
        run: make runtime-differential-report-test rust-runner-provenance-test

  # Pure-Python ledger checks over checked-in correspondence manifests. These
  # rotted while nothing ran them (see docs/README.md migration cleanup); this
  # job is what keeps them green. Each -gate target runs the tool's unit tests
  # AND its check as independent verdicts.
  port-ledgers:
    name: Runtime port ledger gates
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4
        with:
          # The test-correspondence status ratchet walks the manifest's full
          # git history; a shallow clone fails it closed.
          fetch-depth: 0

      - name: Checkout reference rive-runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_RUNTIME_REF }}
          path: rive-runtime
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runtime drawing port gate
        run: make runtime-drawing-port-gate

      # if: !cancelled() so a drawing-ledger failure cannot hide frame-loop
      # drift -- they are independent verdicts over separate ledgers.
      - name: Runtime frame loop port gate
        if: ${{ !cancelled() }}
        run: make runtime-frame-loop-port-gate

      - name: Freshness-aware parity evidence gate
        if: ${{ !cancelled() }}
        run: make parity-evidence-freshness

      - name: Proof-aware parity scorecard gate
        if: ${{ !cancelled() }}
        run: make parity-scorecard

      - name: Clustered runtime drift queue gate
        if: ${{ !cancelled() }}
        run: make runtime-drift-queue

      - name: Upload parity evidence freshness report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-evidence-freshness-${{ github.run_attempt }}
          path: target/parity-evidence-freshness/*
          if-no-files-found: warn
          retention-days: 30

  # The reusable trusted workflow owns the oracle floor (golden compare,
  # scripted golden, workspace tests, C ABI smoke) and records its own
  # scorecard evidence, so this job no longer re-runs that floor on a second
  # hosted runner. During the exact-renderer cutover it carries only the
  # Apple-target compile gates; legacy renderer size/probe CI is tracked in
  # teambasis/universe#126.
  parity-runtime-evidence:
    name: Apple exact-renderer compile
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: macos-14
    # macOS timeouts on this and the jobs below are hang guards only, set at
    # 2-3x the observed worst-case duration. A wedged job that holds one of
    # the few hosted macOS slots for the 6-hour default pushes the shared
    # queue toward GitHub's silent 24-hour expiry cancellation.
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4
        with:
          path: rive-rust

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component llvm-tools --no-self-update

      # The apple-tier check builds test targets that include_bytes! the
      # pinned assets.
      - name: Fetch pinned test assets
        working-directory: ${{ github.workspace }}/rive-rust
        run: make fixtures

      - name: Compile Apple-only feature-gated code
        working-directory: ${{ github.workspace }}/rive-rust
        run: make feature-compile-gate-apple crate-seams-apple-check

  browser-renderer:
    name: Browser exact-renderer compile
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Install Rust stable with wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable wasm32-unknown-unknown

      - name: Install pinned ripgrep
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version

      - name: Fetch pinned test assets
        run: make fixtures

      - name: Compile the browser adapter seam
        run: make crate-seams-browser-check


      - name: Compile exact WebGPU source root
        run: cargo check --locked -p nuxie-renderer --no-default-features --features renderer-webgpu

      - name: Compile exact WebGL2 browser artifact
        run: cargo check --locked -p webgl2-renderer-replay --target wasm32-unknown-unknown

  # Manual closeout lane for the exact browser ports. The Wasm source and
  # candidate products are built once from their frozen source/toolchain pins,
  # then the identical bytes are replayed on every OS/browser worker. This is
  # deliberately dispatch-only: each row renders the full 1,469-case corpus.
  backend-port-browser-artifacts:
    name: Exact browser-port artifacts
    if: ${{ inputs.backend_port_browser_closeout == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout nuxie-runtime
        uses: actions/checkout@v4

      - name: Checkout pinned Rive source oracle
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_RUNTIME_REF }}
          path: rive-runtime

      - name: Install exact Rust and Node toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes uuid-dev
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          rustup toolchain install 1.94.1 --profile minimal --no-self-update
          rustup target add --toolchain 1.91.1 wasm32-unknown-emscripten
          rustup target add --toolchain 1.94.1 wasm32-unknown-emscripten wasm32-unknown-unknown
          rustup run 1.94.1 cargo fetch --locked

      # Rive's pinned premake graph generates and optimizes SPIR-V while
      # building the source oracle. Build the exact revisions declared by our
      # frozen shader toolchain instead of accepting moving apt packages.
      - name: Install pinned Rive shader tools
        run: |
          archive="${RUNNER_TEMP}/glslang-16.2.0.tar.gz"
          source_dir="${RUNNER_TEMP}/glslang-16.2.0"
          build_dir="${RUNNER_TEMP}/glslang-build"
          bin_dir="${RUNNER_TEMP}/rive-shader-tools-bin"
          curl -fsSL https://github.com/KhronosGroup/glslang/archive/refs/tags/16.2.0.tar.gz -o "$archive"
          printf '%s  %s\n' 01985335785c97906a91afe3cb5ee015997696181ec6c125bab5555602ba08e2 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "${RUNNER_TEMP}"
          cmake -S "$source_dir" -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXTERNAL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_OPT=OFF
          cmake --build "$build_dir" --target glslang-standalone --parallel 4
          install -Dm755 "$build_dir/StandAlone/glslang" "$bin_dir/glslangValidator"
          "$bin_dir/glslangValidator" --version | grep -Fx 'Glslang Version: 11:16.2.0'

          headers_archive="${RUNNER_TEMP}/spirv-headers-1.4.341.0.tar.gz"
          tools_archive="${RUNNER_TEMP}/spirv-tools-1.4.341.0.tar.gz"
          headers_dir="${RUNNER_TEMP}/SPIRV-Headers-vulkan-sdk-1.4.341.0"
          tools_dir="${RUNNER_TEMP}/SPIRV-Tools-vulkan-sdk-1.4.341.0"
          tools_build_dir="${RUNNER_TEMP}/spirv-tools-build"
          curl -fsSL https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.341.0.tar.gz -o "$headers_archive"
          curl -fsSL https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/vulkan-sdk-1.4.341.0.tar.gz -o "$tools_archive"
          printf '%s  %s\n' cab0a654c4917e16367483296b44cdb1d614e3120c721beafcd37e3a8580486c "$headers_archive" | sha256sum --check
          printf '%s  %s\n' 15bfb678138cdf9cd1480dfb952547bbb66b763a735b6d5582578572f5c2e6f9 "$tools_archive" | sha256sum --check
          tar -xzf "$headers_archive" -C "${RUNNER_TEMP}"
          tar -xzf "$tools_archive" -C "${RUNNER_TEMP}"
          cmake -S "$tools_dir" -B "$tools_build_dir" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPIRV-Headers_SOURCE_DIR="$headers_dir" \
            -DSPIRV_SKIP_TESTS=ON
          # The archive has no Git metadata. Reuse the pinned tag commit time
          # so SPIRV-Tools' own reproducible-build path emits frozen identity.
          export SOURCE_DATE_EPOCH=1769111119
          cmake --build "$tools_build_dir" --target spirv-opt --parallel 4
          install -Dm755 "$tools_build_dir/tools/spirv-opt" "$bin_dir/spirv-opt"
          "$bin_dir/spirv-opt" --version 2>&1 | grep -Fx 'SPIRV-Tools v2026.1 unknown hash, 2026-01-22T19:45:19+00:00'
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Build frozen WebGPU source and candidate products
        run: |
          CARGO="$(rustup which --toolchain 1.94.1 cargo)"
          RUSTC="$(rustup which --toolchain 1.94.1 rustc)"
          export CARGO RUSTC
          tools/webgpu-renderer-emscripten/build.sh
          unset RUSTC
          tools/backend-port/build-webgpu-source-oracle.sh

      - name: Build frozen WebGL2 source and candidate products
        run: |
          tools/backend-port/build-webgl2-source-oracle.sh
          CARGO="$(rustup which --toolchain 1.94.1 cargo)"
          RUSTC="$(rustup which --toolchain 1.94.1 rustc)"
          export CARGO RUSTC
          tools/webgl2-renderer-replay/build.sh

      - name: Reject browser artifact byte drift
        run: |
          echo 'bc672c453937e29f717d40b864ab40e23a37b05a8abbbe7aa152db2a24830849  target/renderer-webgpu-live-reference/wasm32-unknown-emscripten/release/renderer-replay.js' | sha256sum --check
          echo '08b95e1c271d109648c138e5647600a0a3db5f81197dce443cae9d39dc9c127b  target/renderer-webgpu-live-reference/wasm32-unknown-emscripten/release/renderer_replay.wasm' | sha256sum --check
          echo 'eac250f648fee47320e3b0e18da3b25b3140d3e5fb097c19863eaf6cce5a0da4  tools/webgpu-renderer-emscripten/pkg/renderer-replay.js' | sha256sum --check
          echo '8475ba3ec4f257c0e9c4f9dde6c303a5f9262a29d87f894b22082c11d4fcd122  tools/webgpu-renderer-emscripten/pkg/renderer_replay.wasm' | sha256sum --check
          echo '38658b8abff6fc1c1a600292a8ea27b21ddfe4c70dbd83bd50f112edd74e724e  target/renderer-webgl2-live-reference-1.91/wasm32-unknown-emscripten/release/renderer-replay.js' | sha256sum --check
          echo 'fbd8598fbedf9bd009b73299ce10be0100236ab8a2837116abf8f4fe800c61c5  target/renderer-webgl2-live-reference-1.91/wasm32-unknown-emscripten/release/renderer_replay.wasm' | sha256sum --check
          echo 'b98aa322214396d4ef843e9ad51f66af59e957410a8271207470e4f0c1870ca7  tools/webgl2-renderer-replay/pkg/webgl2_renderer_replay.js' | sha256sum --check
          echo '011ee8972c1b5e2b50707b54ab200d8a2871fb7f8316f7fb50fc4b9f8c76eb89  tools/webgl2-renderer-replay/pkg/webgl2_renderer_replay_bg.wasm' | sha256sum --check

      - name: Upload identical browser products
        uses: actions/upload-artifact@v4
        with:
          name: exact-browser-port-products-${{ github.run_attempt }}
          path: |
            target/renderer-webgpu-live-reference/wasm32-unknown-emscripten/release/renderer-replay.js
            target/renderer-webgpu-live-reference/wasm32-unknown-emscripten/release/renderer_replay.wasm
            tools/webgpu-renderer-emscripten/pkg/renderer-replay.js
            tools/webgpu-renderer-emscripten/pkg/renderer_replay.wasm
            target/renderer-webgl2-live-reference-1.91/wasm32-unknown-emscripten/release/renderer-replay.js
            target/renderer-webgl2-live-reference-1.91/wasm32-unknown-emscripten/release/renderer_replay.wasm
            tools/webgl2-renderer-replay/pkg/webgl2_renderer_replay.js
            tools/webgl2-renderer-replay/pkg/webgl2_renderer_replay_bg.wasm
          if-no-files-found: error
          retention-days: 7

  backend-port-browser-platform:
    name: Exact ${{ matrix.backend }} / ${{ matrix.browser }} / ${{ matrix.os }}
    if: ${{ inputs.backend_port_browser_closeout == true }}
    needs: backend-port-browser-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        backend: [webgpu, webgl2]
        browser: [chromium, firefox]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout nuxie-runtime
        uses: actions/checkout@v4

      - name: Download byte-frozen browser products
        uses: actions/download-artifact@v4
        with:
          name: exact-browser-port-products-${{ github.run_attempt }}
          path: .

      - name: Install harness toolchains
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Rust corpus runner
        run: |
          rustup toolchain install 1.94.1 --profile minimal --no-self-update
          rustup run 1.94.1 cargo fetch --locked
          rustup run 1.94.1 cargo build --locked -p pixel-compare --bin corpus-r

      - name: Install pinned real browsers
        run: |
          npm ci --ignore-scripts --prefix tools/backend-port/browser-platform
          if [[ '${{ runner.os }}' == Linux ]]; then
            npm exec --prefix tools/backend-port/browser-platform playwright -- install --with-deps '${{ matrix.browser }}'
          else
            npm exec --prefix tools/backend-port/browser-platform playwright -- install '${{ matrix.browser }}'
          fi

      - name: Run full same-browser source parity
        env:
          BROWSER_PLATFORM_CHROMIUM_CHANNEL: bundled
          BROWSER_PLATFORM_REPLAY_TIMEOUT_SECONDS: '300'
          RUSTUP_TOOLCHAIN: '1.94.1'
        run: |
          if [[ '${{ runner.os }}' == Linux && '${{ matrix.backend }}' == webgpu && '${{ matrix.browser }}' == firefox ]]; then
            xvfb-run -a node tools/backend-port/run-browser-platform-parity.cjs '${{ matrix.backend }}' '${{ matrix.browser }}'
          else
            node tools/backend-port/run-browser-platform-parity.cjs '${{ matrix.backend }}' '${{ matrix.browser }}'
          fi

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-browser-platform-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.browser }}-${{ github.run_attempt }}
          path: target/backend-port/platform
          if-no-files-found: warn
          retention-days: 30

  renderer-golden:
    name: Renderer pixel golden (deferred)
    # The former WGPU-era renderer job is deliberately dormant while the exact
    # renderer CI contract is redesigned in teambasis/universe#126.
    if: ${{ false }}
    runs-on: macos-14
    # Worst observed pass is ~90 minutes with warm Dawn caches; a cold Dawn
    # bootstrap builds from depot_tools and needs the extra headroom.
    timeout-minutes: 300
    env:
      RUSTUP_TOOLCHAIN: stable
      # Do not relabel the checked-in renderer-port Dawn references. Advancing this
      # oracle requires a separate deterministic regeneration and review.
      RIVE_RUNTIME_REF: 7c778d13c5d903b3b74eec1dd6bb68a811dea5f2
      # Shader provenance advanced independently during a later sync cycle.
      # Keep it separate from the historical pixel oracle above.
      RIVE_SHADER_RUNTIME_REF: 4ac7b32798da0482e441ef09304dc3b480ed3ee5
      # Same-adapter replay follows the current product runtime. It has a
      # separate build and cache from the immutable renderer-port pixel oracle.
      RIVE_SAME_RUNNER_RUNTIME_REF: 4ac7b32798da0482e441ef09304dc3b480ed3ee5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Checkout reference rive-runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_RUNTIME_REF }}
          path: rive-runtime

      - name: Checkout renderer shader source runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_SHADER_RUNTIME_REF }}
          path: rive-runtime-shaders

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned renderer shader tools
        run: |
          tap=openai/rive-shader-tools
          brew tap-new --no-git "$tap"
          tap_dir="$(brew --repository "$tap")"
          curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/aad3312cb71e895b3c62db86c8f08a897a876323/Formula/s/spirv-headers.rb -o "$tap_dir/Formula/spirv-headers.rb"
          curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/aad3312cb71e895b3c62db86c8f08a897a876323/Formula/s/spirv-tools.rb -o "$tap_dir/Formula/spirv-tools.rb"
          curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/d716f586c4f58e3cc5cfc999a4e79e9a2a234b6b/Formula/g/glslang.rb -o "$tap_dir/Formula/glslang.rb"
          for formula in glslang spirv-tools spirv-headers; do
            brew uninstall --ignore-dependencies "$formula" || true
          done
          # These formulae are pinned by source revision but live under a
          # temporary tap. Reusing homebrew/core bottles can retain the core
          # rack metadata and fail before installation on newer Homebrew.
          brew install --build-from-source "$tap/spirv-headers"
          brew install --build-from-source "$tap/spirv-tools"
          brew install --build-from-source "$tap/glslang"
          cargo install naga-cli --version 30.0.0 --locked

      # Upstream does not track `renderer/dependencies/`; premake fetches it
      # during the renderer build, which this shader-only checkout never runs.
      # The WGSL minifier (renderer/src/shaders/minify.py) imports ply, so
      # materialize exactly the revision renderer/premake5_pls_renderer.lua
      # pins -- `dependency.github('dabeaz/ply', '3.11')` -- where
      # tools/generate-renderer-shaders.sh points PYTHONPATH. The digest below
      # is over the package sources and matches the premake-fetched tree.
      - name: Vendor pinned PLY for the WGSL minifier
        run: |
          ply_dir=rive-runtime-shaders/renderer/dependencies/dabeaz_ply_3.11
          expected=c8fe4f16bcbc43ee015f3377044418054917f281a42c2cd23f950d4606965bfe
          curl -fsSL https://github.com/dabeaz/ply/archive/refs/tags/3.11.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}"
          mkdir -p "$(dirname "$ply_dir")"
          mv "${RUNNER_TEMP}/ply-3.11" "$ply_dir"
          actual="$(cd "$ply_dir" && find ply -type f -name '*.py' -print0 \
            | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "pinned PLY digest mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Verify renderer shader provenance
        env:
          RIVE_RUNTIME_DIR: ${{ github.workspace }}/rive-runtime-shaders
        run: make renderer-shaders-check

      - name: Build reference runtime and renderer for dual fuzz replay
        working-directory: ${{ env.RIVE_RUNTIME_DIR }}
        run: |
          RIVE_PREMAKE_ARGS="--file=premake5_v2.lua --with_rive_text --with_rive_layout" build/build_rive.sh debug
          cd renderer
          PATH="${RIVE_RUNTIME_DIR}/build:${PATH}" build_rive.sh debug -- rive_pls_renderer rive_decoders libpng zlib libjpeg libwebp rive_harfbuzz rive_sheenbidi rive_yoga
          echo "${RIVE_RUNTIME_DIR}/build/dependencies/premake-core/bin/${RIVE_PREMAKE_TAG}_release" >> "${GITHUB_PATH}"

      - name: Compute exact C++ Dawn reference cache key
        id: dawn-reference-key
        run: |
          key="$(tools/renderer-dawn-reference-cache-key.sh)"
          echo "key=${key}" >> "${GITHUB_OUTPUT}"

      - name: Restore static C++ Dawn reference replay
        id: dawn-reference-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target/renderer-dawn-reference/renderer-replay
          key: ${{ steps.dawn-reference-key.outputs.key }}

      - name: Bootstrap pinned Dawn and build static C++ reference replay
        if: steps.dawn-reference-cache.outputs.cache-hit != 'true'
        env:
          DEPOT_TOOLS_UPDATE: 0
          RENDERER_JOBS: 4
        run: |
          depot_tools_dir="${RUNNER_TEMP}/depot_tools"
          if [[ ! -d "${depot_tools_dir}/.git" ]]; then
            git clone --no-checkout https://chromium.googlesource.com/chromium/tools/depot_tools.git "${depot_tools_dir}"
          fi
          git -C "${depot_tools_dir}" checkout --detach "${DEPOT_TOOLS_REF}"
          export PATH="${depot_tools_dir}:${PATH}"
          # Initialize the pinned checkout's CIPD-managed Python and helper
          # tools without allowing depot_tools to update its source revision.
          "${depot_tools_dir}/ensure_bootstrap"
          test -s "${depot_tools_dir}/python3_bin_reldir.txt"
          "${depot_tools_dir}/python-bin/python3" --version
          make renderer-dawn-reference-bootstrap
          make renderer-dawn-reference-replay

      - name: Verify static C++ Dawn reference replay
        run: |
          make renderer-dawn-reference-check
          file target/renderer-dawn-reference/renderer-replay
          shasum -a 256 target/renderer-dawn-reference/renderer-replay

      - name: Compute current-runtime C++ Dawn live reference cache key
        id: dawn-live-reference-key
        env:
          RIVE_RUNTIME_DIR: ${{ github.workspace }}/rive-runtime-shaders
        run: |
          key="$(tools/renderer-dawn-live-reference-cache-key.sh)"
          echo "key=${key}" >> "${GITHUB_OUTPUT}"

      - name: Restore current-runtime C++ Dawn live reference replay
        id: dawn-live-reference-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target/renderer-dawn-live-reference/renderer-replay
          key: ${{ steps.dawn-live-reference-key.outputs.key }}

      - name: Bootstrap current-runtime Dawn live reference replay
        if: steps.dawn-live-reference-cache.outputs.cache-hit != 'true'
        env:
          DEPOT_TOOLS_UPDATE: 0
          RENDERER_JOBS: 4
          RIVE_RUNTIME_DIR: ${{ github.workspace }}/rive-runtime-shaders
        run: |
          depot_tools_dir="${RUNNER_TEMP}/depot_tools"
          if [[ ! -d "${depot_tools_dir}/.git" ]]; then
            git clone --no-checkout https://chromium.googlesource.com/chromium/tools/depot_tools.git "${depot_tools_dir}"
          fi
          git -C "${depot_tools_dir}" checkout --detach "${DEPOT_TOOLS_REF}"
          export PATH="${depot_tools_dir}:${PATH}"
          # Initialize the pinned checkout's CIPD-managed Python and helper
          # tools without allowing depot_tools to update its source revision.
          "${depot_tools_dir}/ensure_bootstrap"
          test -s "${depot_tools_dir}/python3_bin_reldir.txt"
          "${depot_tools_dir}/python-bin/python3" --version
          make renderer-dawn-live-reference-bootstrap
          make renderer-dawn-live-reference-replay

      - name: Verify current-runtime C++ Dawn live reference replay
        run: |
          make renderer-dawn-live-reference-check
          file target/renderer-dawn-live-reference/renderer-replay
          shasum -a 256 target/renderer-dawn-live-reference/renderer-replay

      - name: Verify same-runner renderer pixels (non-scorecard)
        env:
          # Serialize the C++ Dawn oracle to avoid concurrent GPU replays
          # wedging Metal. This remains a required CI check, but it is not the
          # checked-in-reference renderer floor consumed by the scorecard.
          RENDERER_SAME_RUNNER_JOBS: 1
          RENDERER_REPLAY_TIMEOUT_SECONDS: 60
        run: make renderer-golden-same-runner

      - name: Upload same-runner corpus failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-same-runner-corpus-${{ github.run_attempt }}
          path: target/renderer-same-runner-corpus
          if-no-files-found: ignore
          retention-days: 7

  # Blocking per-file hot-loop ratchet. The gate prints every advance+draw
  # ratio, fails on any checked-in ceiling, and publishes its raw JSON.
  perf-gate:
    name: Hot-loop performance gate
    # Push-only: release runner builds plus the timing corpus are too slow for
    # PR latency, and PR-runner load makes ratios noisy anyway.
    if: ${{ inputs.backend_port_browser_closeout != true && github.event_name != 'pull_request' }}
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4
        with:
          path: rive-rust

      - name: Checkout reference rive-runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_RUNTIME_REF }}
          path: rive-runtime

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build reference Rive runtime (release)
        working-directory: ${{ env.RIVE_RUNTIME_DIR }}
        run: |
          RIVE_PREMAKE_ARGS="--file=premake5_v2.lua --with_rive_text --with_rive_layout" build/build_rive.sh release
          echo "${RIVE_RUNTIME_DIR}/build/dependencies/premake-core/bin/${RIVE_PREMAKE_TAG}_release" >> "${GITHUB_PATH}"

      - name: Run blocking per-file performance ratchet
        working-directory: ${{ github.workspace }}/rive-rust
        run: |
          make perf-gate PERF_JSON_META="--meta build_profile=release --meta git_sha=${GITHUB_SHA} --meta timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload perf gate JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-json
          path: rive-rust/target/perf-gate.json
          if-no-files-found: ignore

  parity-scorecard:
    name: Five-tier parity scorecard
    # Push-only alongside the heavy evidence jobs it aggregates; on PRs the
    # golden/renderer/perf evidence deliberately does not exist.
    # Legacy renderer/size evidence producers were retired with Rust-WGPU.
    # Re-enable the aggregate only after teambasis/universe#126 defines the
    # exact-renderer evidence set.
    if: ${{ false }}
    needs:
      # trusted-macos-ci uploads the oracle floor and C ABI evidence.
      - trusted-macos-ci
      - parity-runtime-evidence
      - browser-renderer
      - renderer-golden
      - perf-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download required floor evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: parity-scorecard-evidence-*-${{ github.run_attempt }}
          path: target/parity-scorecard/evidence
          merge-multiple: true

      - name: Download blocking perf-gate evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: perf-gate-json
          path: target

      - name: Publish and check parity scorecard
        run: |
          mkdir -p target/parity-scorecard/evidence
          set +e
          python3 tools/parity-scorecard/parity_scorecard.py check \
            --repo-root "${GITHUB_WORKSPACE}" \
            --evidence-dir target/parity-scorecard/evidence \
            --json target/parity-scorecard/scorecard.json \
            > target/parity-scorecard/scorecard.md
          scorecard_status=$?
          set -e
          cat target/parity-scorecard/scorecard.md
          cat target/parity-scorecard/scorecard.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${scorecard_status}"

      - name: Upload parity scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-scorecard-${{ github.run_attempt }}
          path: |
            target/parity-scorecard/scorecard.json
            target/parity-scorecard/scorecard.md
          if-no-files-found: warn
          retention-days: 30

  # Negative-input fuzz smoke gate. This is additive and self-contained: it
  # fetches its pinned upstream seed corpus before running and needs no built
  # C++ reference runtime. cargo-fuzz requires the nightly
  # toolchain (libFuzzer + `-Z sanitizer`), selected per job through
  # `RUSTUP_TOOLCHAIN`. The time budget is deliberately short -- this proves
  # the harness builds and runs, it is not a fuzzing campaign. If the nightly
  # install ever becomes disproportionate, drop the `make fuzz-smoke` step to
  # `make fuzz-build` for a build-only gate.
  fuzz-smoke:
    name: Fuzz smoke gate
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Install Rust nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          cargo install cargo-fuzz --locked

      - name: Fetch pinned test assets
        run: make fixtures

      - name: Build and smoke-run fuzz targets
        run: make fuzz-smoke FUZZ_CARGO=cargo FUZZ_SMOKE_SECONDS=20

      - name: Upload fuzz crash/timeout reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts-${{ github.run_attempt }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  # Panic-freedom clippy gate for the SDK runtime crates.
  # Self-contained: library targets only, no reference runtime needed.
  # Denies clippy::unwrap_used / indexing_slicing / arithmetic_side_effects on
  # the crates that are already clean and reports own-src warning counts for
  # the rest; see the lint-gate target in the Makefile.
  lint-gate:
    name: Clippy lint gate
    if: ${{ inputs.backend_port_browser_closeout != true }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      # The feature compile gate type-checks a few test targets, which
      # include_bytes! the pinned assets.
      - name: Fetch pinned test assets
        run: make fixtures

      - name: Run the clippy lint gate
        run: make lint-gate

      # Cheap compile coverage for first-party Cargo features that no other CI
      # job builds; without it a #[cfg(feature = ...)] module can rot with no
      # gate ever noticing. if: always() so a clippy failure above cannot hide
      # a compile failure here. See feature-compile-gate in the Makefile.
      - name: Compile feature-gated code with no other CI path
        if: ${{ !cancelled() }}
        run: make feature-compile-gate-portable
