version = 1
title = "Runtime frame-loop mechanism and gap inventory"
upstream_ref = "d788e8ec6e8b598526607d6a1e8818e8b637b60c"

# User-approved deliberate divergences are recorded here and cited by their
# parity-gap-register D-row. There are none for the frame-loop port.
decision = []

[[gap]]
id = "FL-G01"
status = "open"
mechanism = "KeyFrame seconds are represented separately from the authored keyframe values in the current retained-seconds experiment; the complete KeyFrame owner translation must decide the exact Rust owner."
citations = [
  "cpp:src/animation/keyframe.cpp:10",
  "rust:crates/nuxie-runtime/src/animation.rs:1055",
]
closure = "FL-B either lands the complete C++ KeyFrame owner with retained seconds or removes the experiment."

[[gap]]
id = "FL-G02"
status = "closed"
mechanism = "Component identity, retained relations, dirt, and dependency order now live on one occurrence-local object arena. Authored, PathComposer, and TextVariationHelper nodes share one typed-handle schedule; Artboard Components dirt is the root Component's sole dirt mask. Construction owner resolution, dependency builds, and dependency sorts match C++ exactly. Remaining component_add_dirt call-count differences are owned by the still-pending FL-C ListenerAlignTarget and FL-E Text-to-layout callback translations, not by the Component lifecycle."
citations = [
  "cpp:src/component.cpp:13-54",
  "cpp:src/dependency_sorter.cpp:6-48",
  "rust:crates/nuxie-runtime/src/objects.rs:232-275",
  "rust:crates/nuxie-runtime/src/artboard.rs:6784-6830",
  "rust:crates/nuxie-runtime/src/artboard.rs:7651-7815",
]
closure = "Closed by FL-A: one retained owner graph, one root/component dirt owner, exact dependency construction/sort counts, direct-handle traversal, clone-local relation rebuild, and zero internal owner rediscovery."

[[gap]]
id = "FL-G03"
status = "open"
counters = [
  "component_add_dirt",
  "state_machine_transition_search",
  "component_dirt_consumptions",
]
mechanism = "State-machine definition and instance collections must be checked for per-frame clone and name/id search work against C++ retained vectors and pointers. The remaining canonical dirt-consumption delta is isolated to align_target: pinned C++ dispatches ListenerAlignTarget and dirties the retained target Node, while Rust has no corresponding RuntimeScheduledListenerAction variant/import branch."
citations = [
  "cpp:src/animation/state_machine_instance.cpp:2583",
  "cpp:src/animation/listener_align_target.cpp:9",
  "rust:crates/nuxie-runtime/src/state_machine/instance.rs:53",
  "rust:crates/nuxie-runtime/src/state_machine.rs:2036",
]
closure = "FL-C ports the complete pinned listener-action owner family, including ListenerAlignTarget's retained target resolution and transform/world-transform dirt writes, reaches parity for component dirt additions, transition searches, and component dirt consumptions, and deletes any displaced lookup path."

[[gap]]
id = "FL-G04"
status = "open"
counter = "databind_artboard_batch"
mechanism = "DataBind target/source queues and ViewModel relay state are Rust adaptations whose batch identity and dirt consumption need member-level correspondence."
citations = [
  "cpp:src/artboard.cpp:1153",
  "rust:crates/nuxie-runtime/src/artboard_data_bind.rs:1329",
]
closure = "FL-D retains one container enrollment per authored DataBind occurrence over the complete dirt mask across clone/collapse; subordinate converter DataBinds execute only through an active outer owner; every compatibility/path source route, including list targets, dirties and enqueues that exact authored occurrence. Prove one insertion-ordered queue entry and one consume path per occurrence. FL-A closes only Component -> collapsable registration/notification and initial synchronization; it does not claim complete DataBind collapse execution parity."

[[gap]]
id = "FL-G05"
status = "open"
mechanism = "Artboard update and geometry state still expose Rust epoch/key mechanisms; each must be classified as owner-local adaptation or deleted if it compensates for missing C++ dirt ownership."
citations = [
  "cpp:src/artboard.cpp:1161",
  "rust:crates/nuxie-runtime/src/artboard.rs:4359",
]
closure = "FL-A/FL-D classifies every epoch and leaves no unowned per-frame invalidation mechanism."

[[gap]]
