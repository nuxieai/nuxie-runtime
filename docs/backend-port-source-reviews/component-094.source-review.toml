[[findings]]
id = "SR-C094-02"
severity = "P1"
summary = "The target emits minified action defines QE, SE, ZD, AE, and QF, but its retained payload tests the unminified identifiers CLEAR_COLOR, LOAD_COLOR, STORE_COLOR, CLEAR_COVERAGE, and CLEAR_CLIP. The requested clear/load/store branches therefore never activate."
