[package]
name = "nux-apple-product-extension"
version = "0.9.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
apple-runtime = [
    "nux-capi/apple-authored-msl",
    "nux-capi/apple-metal",
    "nux-capi/scripting",
]

[dependencies]
nux-capi = { path = "../nux-capi", default-features = false }
nuxie-project-data-scripting = { path = "../nuxie-project-data-scripting" }

[dev-dependencies]
nuxie-project-data = { path = "../nuxie-project-data" }
nuxie-runtime = { path = "../nuxie-runtime", default-features = false }
nuxie-schema = { path = "../nuxie-schema" }

[lints]
workspace = true
