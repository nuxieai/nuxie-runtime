[[findings]]
id = "SR-OVL-03-01"
overlay_id = "generated-authority"
severity = "P1"
summary = "The generated GLSL authority is connected to WebGL2 and Wagyu at the wrong transformation stage. The build owner explicitly distinguishes pre-export .minified.* bytes from the export-substituted .hpp runtime payload and can extract the latter as .runtime files, but that materialization is behind the native-Metal build gate. Both translated renderers instead include the frozen pre-export files while emitting post-export short macro names. Consequently stage, feature, and load/store branches such as VERTEX/DB, FRAGMENT/GB, and CLEAR_COLOR/QE do not activate across either renderer even though every retained file is byte-exact."
citations = [
  "support:crates/nuxie-renderer/build.rs:21-31",
  "support:crates/nuxie-renderer/build.rs:120-123",
  "support:crates/nuxie-renderer/build.rs:338-369",
  "source:renderer/src/gl/render_context_gl_impl.cpp:22-40",
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:249-264",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:80-153",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:146-210",
  "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_load_store_actions_ext_cpp__impl.rs:14-20",
