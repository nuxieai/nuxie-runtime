name: HTML to Rive compiler

on:
  pull_request:
    paths:
      - 'tools/html-to-riv/**'
      - 'crates/nuxie-schema/**'
      - 'crates/nuxie-runtime/**'
      - 'crates/nuxie-render-api/**'
      - 'crates/nuxie-render-stream/**'
      - 'vendor/icu_casemap-2.3.0-nuxie-offsets/**'
      - 'vendor/taffy-0.12.1-rive-yoga-order/**'
      - 'crates/nuxie-renderer/**'
      - 'tools/renderer-replay/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/html-to-riv.yml'
  push:
    branches: [main]
    paths:
      - 'tools/html-to-riv/**'
      - 'crates/nuxie-schema/**'
      - 'crates/nuxie-runtime/**'
      - 'crates/nuxie-render-api/**'
      - 'crates/nuxie-render-stream/**'
      - 'vendor/icu_casemap-2.3.0-nuxie-offsets/**'
      - 'vendor/taffy-0.12.1-rive-yoga-order/**'
      - 'crates/nuxie-renderer/**'
      - 'tools/renderer-replay/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/html-to-riv.yml'
  workflow_dispatch:
    inputs:
      native_pixels:
        description: Run the real Metal versus Chromium pixel gate
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: html-to-riv-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo check -p nuxie-html-to-riv --locked --lib --target wasm32-unknown-unknown
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tools/html-to-riv
      - run: bash tools/html-to-riv/validation/run.sh geometry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-to-riv-geometry
          path: tools/html-to-riv/test-results
          retention-days: 7

  native-pixels:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.native_pixels }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The qualified text profile uses native glyphs; vector comparisons remain
      # a separate diagnostic lane with documented residual differences.
      - run: bash tools/html-to-riv/validation/run.sh native-glyphs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-to-riv-native-pixels
          path: tools/html-to-riv/test-results
          retention-days: 14
