# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "nuxie-codegen"
version = "0.1.0"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
path = "lib.rs"

[dependencies]
"anyhow" = { "version" = "1" }
"nuxie-binary" = { "path" = "../nuxie-binary", "features" = ["test-support"] }
"nuxie-schema" = { "path" = "../nuxie-schema" }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1" }
