# Standalone cargo-fuzz crate. It carries its own `[workspace]` table so it is
# detached from the root workspace: the root's stable toolchain never tries to
# build it (cargo-fuzz requires nightly), and `cargo test --workspace` ignores
# it. Path dependencies still point at the in-repo crates.
[package]
name = "nuxie-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nuxie-binary = { path = "../crates/nuxie-binary" }
nuxie-render-api = { path = "../crates/nuxie-render-api" }
nuxie-runtime = { path = "../crates/nuxie-runtime" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "fuzz_import"
path = "fuzz_targets/fuzz_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_runtime"
path = "fuzz_targets/fuzz_runtime.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pointer"
path = "fuzz_targets/fuzz_pointer.rs"
test = false
doc = false
bench = false

# Keep some debug info in the fuzz binaries so crash backtraces are readable.
[profile.release]
debug = 1

[workspace]

# This fuzz package is intentionally detached from the root workspace, so it
# must select the same source-parity forks explicitly. Workspace patches do not
# propagate through path dependencies.
[patch.crates-io]
jpeg-decoder = { path = "../vendor/jpeg-decoder-0.3.2-rive-v9f" }
taffy = { path = "../vendor/taffy-0.12.1-rive-yoga-order" }
skrifa = { path = "../vendor/skrifa-0.45.1-rive-harfbuzz" }
symphonia-bundle-flac = { path = "../vendor/symphonia-bundle-flac-0.5.5" }
symphonia-bundle-mp3 = { path = "../vendor/symphonia-bundle-mp3-0.5.5" }
symphonia-format-riff = { path = "../vendor/symphonia-format-riff-0.5.5" }
symphonia-utils-xiph = { path = "../vendor/symphonia-utils-xiph-0.5.5" }
