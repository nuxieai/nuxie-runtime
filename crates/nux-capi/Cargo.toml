[package]
name = "nux-capi"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
scripting = ["nuxie/scripting"]
apple-metal = ["nuxie/renderer", "dep:dispatch2", "dep:nuxie-image-codec", "dep:nuxie-renderer"]

[dependencies]
nuxie = { path = "../nuxie", default-features = false }
nuxie-image-codec = { path = "../nuxie-image-codec", optional = true }

[dev-dependencies]
luaur-common = "=0.1.8"
luaur-compiler = "=0.1.8"
nuxie = { path = "../nuxie", default-features = false, features = ["test-support"] }
nuxie-schema = { path = "../nuxie-schema" }
serde_json = "1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"], optional = true }
nuxie-renderer = { path = "../nuxie-renderer", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dev-dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLTexture"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }

[build-dependencies]
cbindgen = "=0.29.2"

# Opt into the workspace panic-freedom clippy lints (root Cargo.toml).
[lints]
workspace = true
