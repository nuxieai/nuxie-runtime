[package]
name = "nuxie-scripting"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scripting spike for the Rive Rust runtime: pure-Rust Luau VM (luaur) foundation."
build = "build.rs"

[features]
# `luau` pulls in the pure-Rust Luau VM (luaur-rt). Default-on so
# `cargo test --workspace` and the editor ProductHost exercise the same VM.
# Build with `--no-default-features` for the envelope-parsing target/runtime
# subset. Host build dependencies may still precompile embedded Luau helpers.
default = ["luau", "compiler", "async", "js-host-seed"]
# Explicit upstream --no_ffp_contract mode for shared native Color arithmetic.
strict-fp = ["nuxie-runtime/strict-fp"]
async = ["luau", "luaur-rt/async"]
scriptnet = ["luau", "nuxie-runtime/scriptnet"]
# Source compilation for tests and tooling. Under `luau` it is luaur-rt's
# `Lua::load`; under `nuxie-vm` the adapter compiles with the vendored
# compiler (a compiler, not a VM) and loads the bytecode.
compiler = ["luau-host", "luaur-rt?/compiler"]
js-host-seed = ["nuxie-runtime/js-host-seed"]
apple-authored-msl = ["luau", "dep:sha2"]
android-authored-wgsl = ["luau", "dep:sha2"]
# Cross-crate access to otherwise private observables needed by literal ports
# of upstream unit tests. Shipping runtime consumers do not enable this.
upstream-test-seams = ["luau-host"]
tools = ["nuxie-runtime/tools"]
# Link the browser AudioWorklet host's `nuxie_audio` imports into wasm32
# builds. Without it, wasm32 audio requests fail and the module imports
# nothing, so server-side wasm stays self-contained.
browser-audio-host = []
# The scripting host with the vendored VM (`luaur-rt`): the default, and
# what every other crate's feature graph selects.
luau = ["luau-host", "dep:luaur-rt"]
# The scripting host with the safe VM (`crates/nuxie-luau-vm`) behind the
# `crate::luau` adapter (docs/luau-safe-vm-plan.md, Phase 2 lane 7). Build
# it with `--no-default-features --features nuxie-vm,compiler,js-host-seed`
# to leave luaur-rt out; if both `luau` and `nuxie-vm` are on, `nuxie-vm`
# is the VM the crate runs, the audio processor engine's included
# (`vm/luau_audio_processor_engine/safe.rs`; the default keeps the raw
# vendored VM, `raw.rs`).
nuxie-vm = [
    "luau-host",
    "dep:nuxie-luau-vm",
    "dep:luaur-ast",
    "dep:luaur-bytecode",
    "dep:luaur-compiler",
]
# What both VM settings share; code gates on this. It selects no VM.
luau-host = [
    "dep:luaur-common",
    "dep:luaur-vm",
    "dep:nuxie-image-codec",
    "dep:nuxie-render-api",
    "dep:nuxie-ore-metal",
]

[dependencies]
serde_json = "1"
nuxie-ore-metal = { path = "../nuxie-ore-metal", default-features = false, optional = true }
nuxie-render-api = { path = "../nuxie-render-api", optional = true }
nuxie-runtime = { path = "../nuxie-runtime", default-features = false }
# Pinned exactly: luaur-rt 0.1.8 (pure-Rust Luau translation, validated
# against upstream Luau commit 8f33df9 per the luaur README).
luaur-common = { version = "=0.1.8", optional = true }
luaur-rt = { version = "=0.1.8", optional = true, default-features = false }
# The raw C-style VM API (luau_load for precompiled bytecode). Same pinned
# version as luaur-rt's own dependency so cargo unifies to one copy.
luaur-vm = { version = "=0.1.8", optional = true }
nuxie-luau-vm = { path = "../nuxie-luau-vm", optional = true }
# The source compiler behind `compiler` under `nuxie-vm` (tests and tooling).
luaur-ast = { version = "=0.1.8", optional = true }
luaur-bytecode = { version = "=0.1.8", optional = true }
luaur-compiler = { version = "=0.1.8", optional = true }
nuxie-image-codec = { path = "../nuxie-image-codec", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
nuxie-ore-metal = { path = "../nuxie-ore-metal", default-features = false }
nuxie-renderer = { path = "../nuxie-renderer", default-features = false }
# Read-only use of the corpus reader to pull ScriptAsset payloads out of
# real .riv files in tests. dev-dependency only: nuxie-binary never becomes
# part of nuxie-scripting's public dependency surface.
nuxie-binary = { path = "../nuxie-binary", features = ["test-support"] }
nuxie-schema = { path = "../nuxie-schema" }
nuxie-sriv = { path = "../nuxie-sriv" }
libhydrogen = "=0.4.6"
luaur-compiler = "=0.1.8"
image-webp = "0.2.4"
sha2 = "0.10"
runtime-test-support = { path = "../../tools/runtime-test-support" }

[build-dependencies]
luaur-common = "=0.1.8"
luaur-compiler = "=0.1.8"

# The abort-profile probe on the safe VM; run it with and without
# -Cpanic=abort (see the example's header).
[[example]]
name = "safe_vm_abort_probe"
required-features = ["nuxie-vm", "compiler"]
