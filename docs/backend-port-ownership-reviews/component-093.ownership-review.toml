findings = [{ id = "OR-C093-01", severity = "P2", summary = "The source protects the interdependent RenderContextGLImpl, RenderTargetGL, and RenderPassGL owner graphs behind private fields and controlled friend/member operations. The target exposes their GL-object, retained-resource, execution-stamp, and ManuallyDrop owners as independently writable pub(crate) fields. Safe crate code can therefore replace one owner without dropping the prior value or swap a GL name away from its matching state/generation, leaking the old owner and defeating the otherwise exact teardown graph; current constructors and mutations are only an unenforced convention.", review_domains = ["ownership-transfers", "provenance-and-aliasing", "teardown-and-destruction-order"], citations = ["source:renderer/include/rive/renderer/gl/render_context_gl_impl.hpp:255-580", "source:renderer/include/rive/renderer/gl/render_target_gl.hpp:84-210", "source:renderer/src/ore/gl/ore_render_pass_gl.hpp:65-84", "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_include_rive_renderer_gl_render_context_gl_impl_hpp__decl.rs:288-489", "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_include_rive_renderer_gl_render_target_gl_hpp__decl.rs:59-147", "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_ore_gl_ore_render_pass_gl_hpp__decl.rs:40-80", "target:crates/nuxie-renderer/src/mechanical_port/webgl2/renderer_src_gl_render_context_gl_impl_cpp__impl.rs:4506-4582"], authority_keys = ["component:component-093", "field-raw:campaign=webgl2\u001fconfiguration=webgl2-emscripten\u001fdeclaration_line=349\u001fdeclared_type=std::unique_ptr<PixelLocalStorageImpl>\u001ffield_name=m_plsImpl\u001ffield_order=2\u001fownership_review=retained-owner-review-required\u001fownership_unit=webgl2:renderer:render_context_gl_impl\u001fqualified_type=rive::gpu::RenderContextGLImpl\u001fsource_path=renderer/include/rive/renderer/gl/render_context_gl_impl.hpp", "field-raw:campaign=webgl2\u001f