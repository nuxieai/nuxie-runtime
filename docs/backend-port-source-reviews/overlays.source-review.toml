]

[[findings]]
id = "SR-OVL-08-01"
overlay_id = "backend-identity-and-browser-bridges"
severity = "P1"
summary = "wgpuSupportedInstanceFeaturesFreeMembers is the sole declaration-only core WebGPU host symbol. It exists in the frozen C header and translated extern surface but is absent from the complete 199-entry LibraryWebGPU stub set wired by webgpu-port. A browser caller of this declared free-members API therefore has no corresponding host import slot in the authored JS library. This is a source-level host-reachability defect and does not assert a product backend-selection or later no-fallback fact."
citations = [
  "source:renderer/src/webgpu/wagyu-port/include/webgpu/webgpu.h:2780-2787",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_wagyu_port_include_webgpu_webgpu_h__decl.rs:1982-1989",
  "source:renderer/src/webgpu/wagyu-port/src/library_webgpu_stubs.js:5-207",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_wagyu_port_src_library_webgpu_stubs_js__compat_build_input.rs:1-218",
