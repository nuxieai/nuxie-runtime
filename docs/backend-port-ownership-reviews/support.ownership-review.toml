findings = [{ id = "OR-SUP-01", severity = "P1", summary = "The shared TrivialArrayAllocator exposes safe allocation and safe mutable-slice recovery for every Rust T, but it creates storage with zeroed bytes and never establishes valid T values before from_raw_parts_mut creates references. Types with invalid zero bit patterns therefore make safe alloc/as_mut_slice use undefined behavior. The adjacent safe TrivialBlockAllocator::make is likewise unconstrained yet deallocates its Box storage without running T's destructor, losing nontrivial ownership that the source's trivial/POD contract excludes.", review_domains = ["ownership-transfers", "provenance-and-aliasing", "teardown-and-destruction-order", "unsafe-ffi-and-abi"], citations = ["support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_hpp.rs:1661-1770"], authority_keys = ["support-binding:artifact_role=shared-renderer-contract-adaptation\u001fbyte_count=104964\u001fcitation=support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_hpp.rs:1-2781\u001fdisposition=review-full-source-semantics\u001flogical_lines=2781\u001fpath=crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_hpp.rs\u001freview_overlay=shared-renderer-contracts\u001fsha256=02e3a5690f72d87fa75b19635ab020c15b0b8b9b60f5fe5949bc9cf42656245f\u001fsource_authority=shared-generic-renderer-authority"] }, { id = "OR-SUP-02", severity = "P1", summary = "The vendored vk-mem Allocator is unconditionally Send and Sync even when its safe unsafe-constructor input selects EXTERNALLY_SYNCHRONIZED, a mode that explicitly removes VMA's internal locks. Safe &self methods such as calculate_statistics, get_heap_budgets, get_allocation_info, pool creation, and pool queries can then execute concurrently through Arc<Allocator>, entering unsynchronized native allocator state and causing data races or native memory corruption.", review_domains = ["callbacks-and-threading", "synchronization-and-mapping", "unsafe-ffi-and-abi", "configuration-owner-graphs"], citations = ["support:vendor/vk-mem-0.5.0/src/definitions.rs:110-120", "support:vendor/vk-mem-0.5.0/src/lib.rs:17-25", "support:vendor/vk-mem-0.5.0/src/lib.rs:203-225", "support:vendor/vk-mem-0.5.0/src/lib.rs:252-284", "support:vendor/vk-mem-0.5.0/src/pool.rs:14-24", "support:vendor/vk-mem-0.5.0/src/pool.rs:87-119"], authority_keys = ["support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=47587\u001fcitation=support:vendor/vk-mem-0.5.0/src/definitions.rs:1-843\u001fdisposition=review-full-source-semantics\u001flogical_lines=843\u001fpath=vendor/vk-mem-0.5.0/src/definitions.rs\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=acda79fcff3fd5f4c7be63332fb5f532e102428ed4975a3bc50e59b5d440e9d0\u001fsource_authority=pinned-vma-and-vulkan-headers", "support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=27537\u001fcitation=support:vendor/vk-mem-0.5.0/src/lib.rs:1-589\u001fdisposition=review-full-source-semantics\u001flogical_lines=589\u001fpath=vendor/vk-mem-0.5.0/src/lib.rs\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=cbcf33ccf39466aa07c9d03ef51a4149249d34894e36260f48c3ce9dfc602379\u001fsource_authority=pinned-vma-and-vulkan-headers", "support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=17516\u001fcitation=support:vendor/vk-mem-0.5.0/src/pool.rs:1-444\u001fdisposition=review-full-source-semantics\u001flogical_lines=444\u001fpath=vendor/vk-mem-0.5.0/src/pool.rs\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=36d82c2e6a401a1c93410c4cfa8c863949e16bab18f85db602a2a12b8588ea0e\u001fsource_authority=pinned-vma-and-vulkan-headers"] }, { id = "OR-SUP-03", severity = "P1", summary = "AllocatorPool::name safely returns an &CStr borrowed from VMA's internally owned pool-name buffer, while set_name also takes only &self and may replace and free that buffer. Safe code can retain the returned reference, call set_name through the same shared pool, and then read freed storage; unconditional Sync also allows the invalidation concurrently. VMA's pinned contract explicitly says the pointer becomes invalid when the name changes.", review_domains = ["ownership-transfers", "provenance-and-aliasing", "callbacks-and-threading"], citations = ["support:vendor/vk-mem-0.5.0/src/pool.rs:61-103", "support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:1942-1961", "support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:15703-15729"], authority_keys = ["support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=17516\u001fcitation=support:vendor/vk-mem-0.5.0/src/pool.rs:1-444\u001fdisposition=review-full-source-semantics\u001flogical_lines=444\u001fpath=vendor/vk-mem-0.5.0/src/pool.rs\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=36d82c2e6a401a1c93410c4cfa8c863949e16bab18f85db602a2a12b8588ea0e\u001fsource_authority=pinned-vma-and-vulkan-headers", "support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=752307\u001fcitation=support:vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h:1-19530\u001fdisposition=review-full-source-semantics\u001flogical_lines=19530\u001fpath=vendor/vk-mem-0.5.0/vendor/VulkanMemoryAllocator/include/vk_mem_alloc.h\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=90ce12fc4a2466235a09ae02905dd0c13aee80c1bbf11b331ab61230c2ceb112\u001fsource_authority=pinned-vma-and-vulkan-headers"] }, { id = "OR-SUP-04", severity = "P1", summary = "PoolCreateInfo publicly exposes its lifetime-sensitive memory_allocate_next pointer, but Allocator::create_pool is safe and passes that pointer into VMA for retention over the complete pool lifetime. The PhantomData and safe push_next helper do not prevent safe callers from directly installing a dangling, malformed, or short-lived pNext chain, after which later safe pool allocations let native code dereference invalid storage without an unsafe caller contract.", review_domains = ["ownership-transfers", "provenance-and-aliasing", "unsafe-ffi-and-abi"], citations = ["support:vendor/vk-mem-0.5.0/src/definitions.rs:477-537", "support:vendor/vk-mem-0.5.0/src/pool.rs:22-43"], authority_keys = ["support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=47587\u001fcitation=support:vendor/vk-mem-0.5.0/src/definitions.rs:1-843\u001fdisposition=review-full-source-semantics\u001flogical_lines=843\u001fpath=vendor/vk-mem-0.5.0/src/definitions.rs\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=acda79fcff3fd5f4c7be63332fb5f532e102428ed4975a3bc50e59b5d440e9d0\u001fsource_authority=pinned-vma-and-vulkan-headers", "support-binding:artifact_role=vulkan-memory-adaptation\u001fbyte_count=17516\u001fcitation=support:vendor/vk-mem-0.5.0/src/pool.rs:1-444\u001fdisposition=review-full-source-semantics\u001flogical_lines=444\u001fpath=vendor/vk-mem-0.5.0/src/pool.rs\u001freview_overlay=vulkan-vma-adaptation\u001fsha256=36d82c2e6a401a1c93410c4cfa8c863949e16bab18f85db602a2a12b8588ea0e\u001fsource_authority=pinned-vma-and-vulkan-headers"] }, { id = "OR-SUP-05", severity = "P2", summary = "The pinned shared C++ ORE and renderer authorities keep their intrusive bases, manager/context links, retained resource arrays, allocators, and implementation owner graph behind controlled class operations. The Rust support layer exposes those interdependent values as independently writable pub(crate) ManuallyDrop fields and raw owner records. Safe sibling code can replace a ManuallyDrop value without releasing its prior owner, split an intrusive base from its members, or rewrite one half of a context/resource tuple, leaking resources and defeating the exact derived-to-base teardown convention.", review_domains = ["field-and-layout", "ownership-transfers", "provenance-and-aliasing", "teardown-and-destruction-order", "configuration-owner-graphs"], citations = ["support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/gpu_resource_hpp.rs:748-845", "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/gpu_resource_hpp.rs:1180-1344", "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_bind_group_hpp.rs:83-131", "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_bind_group_layout_hpp.rs:56-94", "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_texture_hpp.rs:95-121", "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_texture_hpp.rs:274-304", "support:crates/nuxie-renderer/src/mechanical_port/source/renderer/include/rive/renderer/render_context_hpp.rs:2150-2204"], authority_keys = ["support-binding:artifact_role=shared-ore-contract-adaptation\u001fbyte_count=93788\u001fcitation=support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/gpu_resource_hpp.rs:1-2680\u001fdisposition=review-full-source-semantics\u001flogical_lines=2680\u001fpath=crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/gpu_resource_hpp.rs\u001freview_overlay=shared-ore-contracts\u001fsha256=5a3932b903bb3a7b3dec48cce16175f80d7489f0f67ad4917340560257882c80\u001fsource_authority=shared-generic-metal-authority", "support-binding:artifact_role=shared-ore-contract-adaptation\u001fbyte_count=9111\u001fcitation=support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_bind_group_hpp.rs:1-261\u001fdisposition=review-full-source-semantics\u001flogical_lines=261\u001fpath=crates/nuxie-ore-metal/src/mechanical_port/source/renderer/include/rive/renderer/ore/ore_bind_group_hpp.rs\u001freview_overlay=shared-ore-contracts\u001fsha256=2cdd2b2713078a50c027c0f71f16b97b242c8156b079bfddcc4f4f12dd13e4fa\u001fsource_authority=shared-generic-metal-authority", "support-binding:ar