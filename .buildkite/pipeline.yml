env:
  CI: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RIVE_RUNTIME_REF: "4ac7b32798da0482e441ef09304dc3b480ed3ee5"
  PORT_MANIFEST_RIVE_RUNTIME_REF: "4ac7b32798da0482e441ef09304dc3b480ed3ee5"
  RIVE_PREMAKE_TAG: "v5.0.0-beta7"

steps:
  # Every pull request gets a fast, portable compile and lint signal. Keep this
  # independent of the pinned C++ runtime, fixtures, and Apple host so the
  # common path does not wait behind expensive confidence work.
  - label: ":linux: Runtime fast checks"
    if: "build.pull_request.id != null"
    command: |
      set -euo pipefail
      rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
      make fmt-check check lint-gate feature-compile-gate-portable
    agents:
      queue: nuxie-pr
      nuxie-platform: linux
    timeout_in_minutes: 45
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  # These gates compare the Rust port to the pinned upstream runtime. They are
  # valuable before merge when runtime/port inputs change, but irrelevant to a
  # documentation-only pull request.
  - label: ":linux: Runtime port contracts"
    if: "build.pull_request.id != null"
    if_changed:
      - Cargo.{toml,lock}
      - Makefile
      - crates/**
      - tools/{port-manifest,rust-attribution,pure-runtime-boundary,runtime-drawing-port,runtime-frame-loop-port,test-correspondence,layout-style-handler}/**
      - fixtures/**
    command: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo apt-get install --no-install-recommends -y zlib1g-dev
      export RIVE_RUNTIME_DIR="$(pwd)/rive-runtime"
      git clone --filter=blob:none https://github.com/rive-app/rive-runtime.git rive-runtime
      git -C rive-runtime checkout "$RIVE_RUNTIME_REF"
      make fixtures
      make port-manifest-gate rust-attribution-gate pure-runtime-boundary-gate
      make runtime-drawing-port-gate runtime-frame-loop-port-gate
    agents:
      queue: nuxie-pr
      nuxie-platform: linux
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  # The C ABI is portable. Compile and execute its C consumer on Linux instead
  # of making every ABI change wait for the scarce Apple host.
  - label: ":linux: C ABI smoke"
    if: "build.pull_request.id != null"
    if_changed:
      - Cargo.{toml,lock}
      - Makefile
      - crates/nux-capi/**
      - crates/nuxie/**
      - crates/{nuxie-runtime,nuxie-schema,nuxie-binary,nuxie-image-codec,nuxie-render-api,nuxie-renderer}/**
      - fixtures/**
    command: |
      set -euo pipefail
      make fixtures capi-smoke
    agents:
      queue: nuxie-pr
      nuxie-platform: linux
    timeout_in_minutes: 45
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  # This is the only PR lane that needs macOS: it type-checks the opaque Metal
  # measurement roots and the host audio feature against the Apple SDK.
  - label: ":mac: Darwin renderer compile"
    if: "build.pull_request.id != null"
    if_changed:
      - Cargo.{toml,lock}
      - Makefile
      - crates/{nuxie-audio,nuxie-image-codec,nuxie-render-api,nuxie-renderer}/**
      - tools/size-report-roots/**
    command: |
      set -euo pipefail
      rustup toolchain install stable --profile minimal --no-self-update
      make feature-compile-gate-apple
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 45
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  # The following jobs are intentionally scheduled confidence. They retain the
  # exhaustive upstream, renderer, browser/WASM, and full-workspace evidence
  # without turning every runtime pull request into a multi-hour queue item.
  - label: ":linux: Nightly full runtime confidence"
    if: 'build.source == "schedule"'
    command: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo apt-get install --no-install-recommends -y zlib1g-dev
      export RIVE_RUNTIME_DIR="$(pwd)/rive-runtime"
      git clone --filter=blob:none https://github.com/rive-app/rive-runtime.git rive-runtime
      git -C rive-runtime checkout "$RIVE_RUNTIME_REF"
      rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
      make fixtures
      make fmt-check check
      make port-manifest-gate rust-attribution-gate pure-runtime-boundary-gate
      make runtime-drawing-port-gate runtime-frame-loop-port-gate
      make lint-gate feature-compile-gate-portable
      (
        cd "$RIVE_RUNTIME_DIR"
        RIVE_PREMAKE_ARGS="--file=premake5_v2.lua --with_rive_text --with_rive_layout" \
          build/build_rive.sh nobuild
      )
      export PATH="$RIVE_RUNTIME_DIR/build/dependencies/premake-core/bin/${RIVE_PREMAKE_TAG}_release:$PATH"
      make cpp-probe cpp-probe-scripted
      cargo test --workspace --exclude nuxie-renderer
    agents:
      queue: nuxie-pr
      nuxie-platform: linux
    timeout_in_minutes: 180
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":mac: Nightly renderer and Apple confidence"
    if: 'build.source == "schedule"'
    command: |
      set -euo pipefail
      export RIVE_RUNTIME_DIR="$(pwd)/rive-runtime"
      git clone --filter=blob:none https://github.com/rive-app/rive-runtime.git rive-runtime
      git -C rive-runtime checkout "$RIVE_RUNTIME_REF"
      rustup toolchain install stable --profile minimal --component llvm-tools --no-self-update
      rustup target add --toolchain stable wasm32-unknown-unknown
      make fixtures
      make microbench-gate
      make capi-smoke
      make feature-compile-gate-apple
      cargo test -p nuxie-renderer
      make wasm-perf-test crate-seams-browser-check
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 120
    retry:
      automatic:
        - exit_status: -1
