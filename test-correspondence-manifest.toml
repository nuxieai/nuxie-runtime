# Upstream C++ unit-test correspondence ledger. A differential disposition
# requires complete behavior execution through both the pinned C++ runtime and
# Rust. Direct-only coverage is never promoted from nearby or foundational tests.
# Phase execution and the exact definition of a port live in
# docs/runtime-exact-parity-plan.md.
schema = "nuxie-test-correspondence/v1"
schema_version = 1
upstream_repository = "rive-app/rive-runtime"
upstream_ref = "4ac7b32798da0482e441ef09304dc3b480ed3ee5"
source_globs = ["tests/unit_tests/runtime/*.cpp", "tests/unit_tests/runtime/scripting/*.cpp"]
row_count = 157
test_case_count = 1404
status_values = ["ported-differential", "ported-direct", "partial", "pending", "n-a"]

# Status counts are recensused from the [[file]] rows on every check; only the
# monotonic guards below are pinned. Concurrent lanes moving rows never edit
# this block -- lower max_pending occasionally to lock in progress.
[ratchet]
max_pending = 0

