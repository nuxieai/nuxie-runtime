[[findings]]
id = "SR-C109-02"
severity = "P1"
summary = "Source explicitly excludes clockwiseAtomic from using_pls and therefore does not attach Wagyu input-attachment or EXT-PLS state for that mode. Target routes clockwiseAtomic through PLSDrawRenderPass, enables capability-selected PLS state without the source guard, and always chains the Wagyu descriptor."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:290-303",
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:3633-3722",
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:4028-4043",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:2229-2325",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:2674-2690",
]

[[findings]]
id = "SR-C109-03"
severity = "P1"
summary = "Source creates and indexes the four input-attachment states only when usingPLSInputAttachments is true. Target unconditionally constructs four states from colorAttachments[0..3]; ordinary atomic, MSAA, and non-input-attachment PLS pipelines have a one-element list and panic at index 1 before the later guard."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:3448-3464",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:1517-1575",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:1605-1624",
]

[[findings]]
id = "SR-C109-04"
severity = "P1"
summary = "Source computes storage-texture copy row pitch using frozen STORAGE_TEXTURE_WIDTH, whose imported value is 128. Target hardcodes 2048, producing a 16x row pitch while copying the same extent and therefore reading incorrect rows or out-of-range bytes for multirow uploads."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:16-16",
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:2815-2839",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:711-732",
]

[[findings]]
id = "SR-C109-05"
severity = "P2"
summary = "Source creates specialized framebuffer pipelines in BGRA-then-RGBA order; target reverses this to RGBA-then-BGRA. This changes first failure reporting and partial pipeline population when creation fails."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:1708-1723",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:2097-2118",
]

[[findings]]
id = "SR-C109-06"
severity = "P2"
summary = "Source forces draw-pipeline-layout creation and validation before acquiring the encoder or recording storage copies and passes. Target performs copies and offscreen commands first and resolves the layout only later, changing failure order and allowing partial command recording before the corresponding layout failure."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:4073-4091",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:4017-4076",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:4147-4151",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_webgpu_render_context_webgpu_impl_cpp__impl.rs:4255-4262",
]

[[findings]]
id = "SR-C109-07"
severity = "P2"
summary = "For offscreen passes, source begins the render pass and binds its pipeline and buffers before creating the bind group. Target creates the bind group first. Bind-group failure therefore occurs at a different point and after different partial command state."
