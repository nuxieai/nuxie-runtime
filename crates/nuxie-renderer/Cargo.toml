[package]
name = "nuxie-renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
decode-oracle = []
perf-diagnostics = []
perf-counters = []
# Exposes a deliberately narrow, doc-hidden seam into production-compiled
# algorithms for Criterion. It is opt-in, but must be maintained with those
# internals; this avoids test-only instrumentation and copied private modules.
upstream-microbenchmarks = ["dep:libc"]

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
futures-channel = "0.3"
image-webp = "0.2.4"
jpeg-decoder = { version = "0.3", default-features = false }
libc = { version = "0.2", optional = true }
moxcms = "0.8.1"
nuxie-image-codec = { path = "../nuxie-image-codec" }
nuxie-render-api = { path = "../nuxie-render-api" }
naga = { version = "30.0.0", features = ["wgsl-in"] }
png = "0.18"
smallvec = "1.15.2"
# Keep the parity-critical core/HAL patches transitive for git and path
# consumers. The vendored top-level package wires both patched crates by path.
wgpu = { version = "=30.0.0", path = "../../vendor/wgpu-30.0.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
nuxie-binary = { path = "../nuxie-binary" }
nuxie-graph = { path = "../nuxie-graph" }
nuxie-render-stream = { path = "../nuxie-render-stream" }
nuxie-runtime = { path = "../nuxie-runtime" }
sha2 = "0.10"

[[bench]]
name = "upstream_microbenchmarks"
harness = false
required-features = ["upstream-microbenchmarks"]
