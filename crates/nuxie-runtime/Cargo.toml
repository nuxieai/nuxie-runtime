[package]
name = "nuxie-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
tools = []
threading = []
# The pinned C++ browser build seeds nondeterministic randomness from
# performance.now() through a JS host. Host-free wasm embedders (the cold
# publisher) must stay import-free, so the JS seed is a default-on feature.
js-host-seed = ["dep:js-sys", "dep:wasm-bindgen"]
default = ["js-host-seed"]

[dependencies]
anyhow = "1"
harfrust = "0.12"
nuxie-binary = { path = "../nuxie-binary" }
nuxie-graph = { path = "../nuxie-graph" }
nuxie-image-codec = { path = "../nuxie-image-codec" }
nuxie-render-api = { path = "../nuxie-render-api" }
nuxie-schema = { path = "../nuxie-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.45.1"
taffy = "0.12.1"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-bidi = "0.3.18"
unicode-script = "0.5.8"

[build-dependencies]
nuxie-schema = { path = "../nuxie-schema" }

[dev-dependencies]
png = "0.18"

[[test]]
name = "cpp_probe"
path = "tests/cpp_probe.rs"
required-features = ["tools"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Performance"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# Opt into the workspace panic-freedom clippy lints (root Cargo.toml).
[lints]
workspace = true
