[[findings]]
id = "SR-C109-08"
severity = "P3"
summary = "Source does not mark ETC2 compressed for its debug-only automatic-mipmap assertion, while target does. An ETC2 request with generateRemainingMips proceeds in source debug builds but debug-panics in the target."
