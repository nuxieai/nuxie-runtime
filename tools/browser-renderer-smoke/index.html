<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Nuxie WebGPU browser renderer smoke</title>
  </head>
  <body>
    <pre id="status">running</pre>
    <script type="module">
      import init, {
        assert_direct_presentation,
        assert_direct_gpu_canvas_image,
        assert_exclusive_canvas_lease,
        assert_explicit_readback,
        assert_imported_gpu_canvas,
        assert_persistent_surface_acquisition_failure,
        assert_retained_frame_removal,
        assert_resize,
        assert_surface_acquisition_retry,
        assert_webgpu_gpu_canvas_rejects_invalid_interface,
        assert_webgpu_uniform_limit_rejection,
        run_backend,
        run_stream_case,
      } from "./pkg/browser_renderer_smoke.js";

      const status = document.querySelector("#status");
      const search = new URLSearchParams(location.search);
      const forceCompatibility = search.has("force-webgpu-compatibility");
      const forceNoSsbo = search.has("force-no-ssbo");
      const forceUnavailable = search.has("force-webgpu-unavailable");
      const forceNoAdapter = search.has("force-webgpu-no-adapter");
      const forceDeviceFailure = search.has("force-webgpu-device-failure");
      let compatibilityProbe = null;

      function installCanvasLeaseCallCounters(canvas) {
        const context = canvas.getContext("webgpu");
        if (!context) {
          throw new Error(
            "browser lacks WebGPU canvas context required by canvas lease proof",
          );
        }
        const counters = {
          configure: 0,
          unconfigure: 0,
          getCurrentTexture: 0,
        };
        const events = [];
        let configuredGeneration = null;
        let generationIndex = 0;
        const restore = [];
        const wrap = (name) => {
          const prototype = globalThis.GPUCanvasContext?.prototype;
          if (!prototype) {
            throw new Error(`browser lacks ${name} prototype required by canvas lease proof`);
          }
          const descriptor = Object.getOwnPropertyDescriptor(prototype, name);
          if (!descriptor || typeof descriptor.value !== "function") {
            throw new Error(`browser lacks callable ${name} required by canvas lease proof`);
          }
          Object.defineProperty(prototype, name, {
            ...descriptor,
            value(...args) {
              const result = descriptor.value.apply(this, args);
              if (this !== context) return result;
              counters[name] += 1;
              if (name === "configure") {
                configuredGeneration =
                  generationIndex < 26
                    ? String.fromCharCode("A".charCodeAt(0) + generationIndex)
                    : `generation-${generationIndex + 1}`;
                generationIndex += 1;
                events.push(`${configuredGeneration}:configure`);
              } else {
                events.push(
                  `${configuredGeneration ?? "unowned"}:${
                    name === "getCurrentTexture" ? "present" : "unconfigure"
                  }`,
                );
                if (name === "unconfigure") configuredGeneration = null;
              }
              return result;
            },
          });
          restore.push(() => Object.defineProperty(prototype, name, descriptor));
        };
        wrap("configure");
        wrap("unconfigure");
        wrap("getCurrentTexture");
        return {
          counters,
          events,
          restore() {
            for (const restoreMethod of restore.reverse()) restoreMethod();
          },
        };
      }

      function installPresentationCallCounters() {
        const counters = {
          getCurrentTexture: 0,
          mapAsync: 0,
          mapRead: 0,
          putImageData: 0,
        };
        const restore = [];
        const wrap = (prototype, name, counter) => {
          if (!prototype) {
            throw new Error(`browser lacks ${name} prototype required by presentation proof`);
          }
          const descriptor = Object.getOwnPropertyDescriptor(prototype, name);
          if (!descriptor || typeof descriptor.value !== "function") {
            throw new Error(`browser lacks callable ${name} required by presentation proof`);
          }
          Object.defineProperty(prototype, name, {
            ...descriptor,
            value(...args) {
              counters[counter] += 1;
              if (
                counter === "mapAsync" &&
                (args[0] & globalThis.GPUMapMode.READ) !== 0
              ) {
                counters.mapRead += 1;
              }
              return descriptor.value.apply(this, args);
            },
          });
          restore.push(() => Object.defineProperty(prototype, name, descriptor));
        };
        wrap(
          globalThis.GPUCanvasContext?.prototype,
          "getCurrentTexture",
          "getCurrentTexture",
        );
        wrap(globalThis.GPUBuffer?.prototype, "mapAsync", "mapAsync");
        wrap(
          globalThis.CanvasRenderingContext2D?.prototype,
          "putImageData",
          "putImageData",
        );
        return {
          counters,
          restore() {
            for (const restoreMethod of restore.reverse()) restoreMethod();
          },
        };
      }

      function readBitmapPixels(bitmap, width, height, background = null) {
        const readbackCanvas = document.createElement("canvas");
        readbackCanvas.width = width;
        readbackCanvas.height = height;
        const context = readbackCanvas.getContext("2d", {
          willReadFrequently: true,
        });
        if (!context) {
          throw new Error("browser lacks Canvas2D for presentation pixel oracle");
        }
        if (background) {
          context.fillStyle = background;
          context.fillRect(0, 0, width, height);
        }
        context.drawImage(bitmap, 0, 0);
        return context.getImageData(0, 0, width, height).data;
      }

      function assertExactPixels(pixels, expected, label, tolerance = 0) {
        for (let offset = 0; offset < pixels.length; offset += 4) {
          const actual = Array.from(pixels.slice(offset, offset + 4));
          if (
            actual.some(
              (channel, index) =>
                Math.abs(channel - expected[index]) > tolerance,
            )
          ) {
            throw new Error(
              `${label} pixel ${offset / 4} was [${actual.join(",")}]`,
            );
          }
        }
      }

      async function assertPremultipliedPresentationPixels(canvas) {
        const bitmap = await createImageBitmap(canvas);
        try {
          assertExactPixels(
            readBitmapPixels(bitmap, canvas.width, canvas.height),
            [0xff, 0x00, 0x00, 0x80],
            "transparent direct WebGPU presentation",
          );
          assertExactPixels(
            readBitmapPixels(
              bitmap,
              canvas.width,
              canvas.height,
              "rgb(0 0 255)",
            ),
            [0x80, 0x00, 0x7f, 0xff],
            "premultiplied WebGPU presentation over blue",
            1,
          );
        } finally {
          bitmap.close();
        }
      }

      async function assertOpaquePresentationPixels(canvas, expected, label) {
        const bitmap = await createImageBitmap(canvas);
        try {
          assertExactPixels(
            readBitmapPixels(bitmap, canvas.width, canvas.height),
            expected,
            label,
          );
        } finally {
          bitmap.close();
        }
      }

      function assertPixelRegion(pixels, width, bounds, expected, label) {
        const [left, top, right, bottom] = bounds;
        for (let y = top; y < bottom; y += 1) {
          for (let x = left; x < right; x += 1) {
            const offset = (y * width + x) * 4;
            const actual = Array.from(pixels.slice(offset, offset + 4));
            if (actual.some((channel, index) => channel !== expected[index])) {
              throw new Error(
                `${label} pixel (${x},${y}) was [${actual.join(",")}], expected [${expected.join(",")}]`,
              );
            }
          }
        }
      }

      function assertRetainedPresentationPixels(pixels, width, includeChild, label) {
        assertPixelRegion(
          pixels,
          width,
          [2, 2, 6, 10],
          [0x20, 0xa0, 0x60, 0xff],
          `${label} parent`,
        );
        assertPixelRegion(
          pixels,
          width,
          includeChild ? [10, 3, 14, 9] : [9, 2, 15, 10],
          includeChild
            ? [0xff, 0x00, 0x00, 0xff]
            : [0x10, 0x20, 0x30, 0xff],
          `${label} former child`,
        );
        if (!includeChild) {
          for (let offset = 0; offset < pixels.length; offset += 4) {
            if (
              pixels[offset] > Math.min(0xff, pixels[offset + 1] + 32) &&
              pixels[offset] > Math.min(0xff, pixels[offset + 2] + 32)
            ) {
              throw new Error(
                `${label} retained a red child pixel at ${offset / 4}`,
              );
            }
          }
        }
      }

      function installRetainedFrameObserver(counters) {
        const name = "observeRetainedRendererFrame";
        const previous = Object.getOwnPropertyDescriptor(globalThis, name);
        Object.defineProperty(globalThis, name, {
          configurable: true,
          value: async (canvas, phase) => {
            const expected = {
              "explicit-b": [0, 2, 0],
              "presentation-a": [1, 2, 0],
              "presentation-b": [2, 2, 0],
            }[phase];
            if (!expected) {
              throw new Error(`unknown retained-frame observation phase ${phase}`);
            }
            const actual = [
              counters.getCurrentTexture,
              counters.mapRead,
              counters.putImageData,
            ];
            if (actual.some((count, index) => count !== expected[index])) {
              throw new Error(
                `retained ${phase} called getCurrentTexture=${actual[0]} mapRead=${actual[1]} mapAsync=${counters.mapAsync} putImageData=${actual[2]}; expected ${expected.join(",")}`,
              );
            }
            if (phase === "explicit-b") return;

            const bitmap = await createImageBitmap(canvas);
            try {
              assertRetainedPresentationPixels(
                readBitmapPixels(bitmap, canvas.width, canvas.height),
                canvas.width,
                phase === "presentation-a",
                `retained ${phase}`,
              );
            } finally {
              bitmap.close();
            }
          },
        });
        return {
          restore() {
            if (previous) {
              Object.defineProperty(globalThis, name, previous);
            } else {
              delete globalThis[name];
            }
          },
        };
      }

      function installSurfaceAcquisitionLoss(canvas, persistent = false) {
        const prototype = globalThis.GPUCanvasContext?.prototype;
        if (!prototype) {
          throw new Error("browser lacks GPUCanvasContext required by loss proof");
        }
        const context = canvas.getContext("webgpu");
        if (!context) {
          throw new Error(
            "browser lacks WebGPU canvas context required by loss proof",
          );
        }
        const descriptor = Object.getOwnPropertyDescriptor(
          prototype,
          "getCurrentTexture",
        );
        const unconfigureDescriptor = Object.getOwnPropertyDescriptor(
          prototype,
          "unconfigure",
        );
        if (!descriptor || typeof descriptor.value !== "function") {
          throw new Error(
            "browser lacks callable getCurrentTexture required by loss proof",
          );
        }
        if (
          !unconfigureDescriptor ||
          typeof unconfigureDescriptor.value !== "function"
        ) {
          throw new Error(
            "browser lacks callable unconfigure required by loss proof",
          );
        }
        const getContext = canvas.getContext;
        let acquisitions = 0;
        let surfaces = 0;
        let contextLookups = 0;
        const events = [];
        const contextLookupEvents = [
          "surface:create:getContext",
          "surface:recreate:getContext",
          "release:getContext",
        ];
        Object.defineProperty(canvas, "getContext", {
          configurable: true,
          value(type, ...args) {
            const result = getContext.call(this, type, ...args);
            if (type === "webgpu" && result === context) {
              const event =
                contextLookupEvents[contextLookups] ??
                `unexpected:getContext:${contextLookups + 1}`;
              events.push(event);
              if (contextLookups < 2) {
                surfaces += 1;
              }
              contextLookups += 1;
            }
            return result;
          },
        });
        Object.defineProperty(prototype, "getCurrentTexture", {
          ...descriptor,
          value(...args) {
            if (this !== context) {
              return descriptor.value.apply(this, args);
            }
            acquisitions += 1;
            if (persistent || acquisitions === 1) {
              events.push(`acquire:${acquisitions}:injected-loss`);
              throw new Error(
                persistent
                  ? "injected persistent surface acquisition loss"
                  : "injected one-shot surface acquisition loss",
              );
            }
            try {
              const result = descriptor.value.apply(this, args);
              events.push(`acquire:${acquisitions}:success`);
              return result;
            } catch (error) {
              events.push(`acquire:${acquisitions}:error`);
              throw error;
            }
          },
        });
        Object.defineProperty(prototype, "unconfigure", {
          ...unconfigureDescriptor,
          value(...args) {
            if (this !== context) {
              return unconfigureDescriptor.value.apply(this, args);
            }
            try {
              const result = unconfigureDescriptor.value.apply(this, args);
              events.push("release:unconfigure");
              return result;
            } catch (error) {
              events.push("release:unconfigure:error");
              throw error;
            }
          },
        });
        return {
          get acquisitions() {
            return acquisitions;
          },
          get surfaces() {
            return surfaces;
          },
          events,
          restore() {
            Object.defineProperty(prototype, "getCurrentTexture", descriptor);
            Object.defineProperty(
              prototype,
              "unconfigure",
              unconfigureDescriptor,
            );
            delete canvas.getContext;
          },
        };
      }

      try {
        if (forceNoSsbo && !forceCompatibility) {
          throw new Error("force-no-ssbo requires force-webgpu-compatibility");
        }
        if (
            Number(forceCompatibility) +
            Number(forceUnavailable) +
            Number(forceNoAdapter) +
            Number(forceDeviceFailure) >
          1
        ) {
          throw new Error("forced WebGPU admission cases are mutually exclusive");
        }
        await init();
        if (forceUnavailable) {
          Object.defineProperty(navigator, "gpu", {
            configurable: true,
            value: undefined,
          });
          try {
            await run_backend(document.createElement("canvas"));
            throw new Error("WebGPU-unavailable browser unexpectedly initialized");
          } catch (error) {
            const message = String(error);
            if (message.includes("unexpectedly initialized")) throw error;
            if (!message.includes("WebGPU API is unavailable")) {
              throw new Error(`WebGPU-unavailable error lacked actionable context: ${message}`);
            }
          }
          const results = ["webgpu-unavailable=adapter-error"];
          window.__rendererSmoke = { status: "passed", results };
          status.textContent = `passed\n${results.join("\n")}`;
          document.body.dataset.status = "passed";
        } else if (forceNoAdapter) {
          const gpu = navigator.gpu;
          if (!gpu) {
            throw new Error("forced no-adapter smoke requires navigator.gpu");
          }
          const featureLevelsRequested = [];
          const unavailableGpu = new Proxy(gpu, {
            get(target, property) {
              if (property === "requestAdapter") {
                return async (options = {}) => {
                  const featureLevel = options.featureLevel ?? "core";
                  featureLevelsRequested.push(featureLevel);
                  throw new Error(
                    `forced ${featureLevel} WebGPU adapter failure`,
                  );
                };
              }
              const value = Reflect.get(target, property, target);
              return typeof value === "function" ? value.bind(target) : value;
            },
          });
          Object.defineProperty(navigator, "gpu", {
            configurable: true,
            value: unavailableGpu,
          });
          try {
            await run_backend(document.createElement("canvas"));
            throw new Error("WebGPU no-adapter browser unexpectedly initialized");
          } catch (error) {
            const message = String(error);
            if (message.includes("unexpectedly initialized")) throw error;
            for (const expected of [
              "adapter error",
              "Core probe failed",
              "forced core WebGPU adapter failure",
              "Compatibility probe failed",
              "forced compatibility WebGPU adapter failure",
            ]) {
              if (!message.includes(expected)) {
                throw new Error(
                  `WebGPU no-adapter error omitted ${expected}: ${message}`,
                );
              }
            }
          }
          if (
            featureLevelsRequested.length !== 2 ||
            featureLevelsRequested[0] !== "core" ||
            featureLevelsRequested[1] !== "compatibility"
          ) {
            throw new Error(
              `WebGPU admission order was ${JSON.stringify(featureLevelsRequested)}; expected Core then Compatibility exactly once`,
            );
          }
          const results = [
            "webgpu-no-adapter=adapter-error order=core,compatibility",
          ];
          window.__rendererSmoke = { status: "passed", results };
          status.textContent = `passed\n${results.join("\n")}`;
          document.body.dataset.status = "passed";
        } else if (forceDeviceFailure) {
          const gpu = navigator.gpu;
          if (!gpu) {
            throw new Error("forced device-failure smoke requires navigator.gpu");
          }
          const requestAdapter = gpu.requestAdapter.bind(gpu);
          const deviceFeatureLevels = [];
          const failingGpu = new Proxy(gpu, {
            get(target, property) {
              if (property === "requestAdapter") {
                return async (options = {}) => {
                  const featureLevel = options.featureLevel ?? "core";
                  const adapter = await requestAdapter(options);
                  if (!adapter) {
                    return null;
                  }
                  return new Proxy(adapter, {
                    get(adapterTarget, adapterProperty) {
                      if (adapterProperty === "requestDevice") {
                        return async () => {
                          deviceFeatureLevels.push(featureLevel);
                          throw new Error(
                            `forced ${featureLevel} WebGPU device failure`,
                          );
                        };
                      }
                      const value = Reflect.get(
                        adapterTarget,
                        adapterProperty,
                        adapterTarget,
                      );
                      return typeof value === "function"
                        ? value.bind(adapterTarget)
                        : value;
                    },
                  });
                };
              }
              const value = Reflect.get(target, property, target);
              return typeof value === "function" ? value.bind(target) : value;
            },
          });
          Object.defineProperty(navigator, "gpu", {
            configurable: true,
            value: failingGpu,
          });
          try {
            await run_backend(document.createElement("canvas"));
            throw new Error("WebGPU device-failure browser unexpectedly initialized");
          } catch (error) {
            const message = String(error);
            if (message.includes("unexpectedly initialized")) throw error;
            for (const expected of [
              "wgpu device error",
              "Core WebGPU initialization failed",
              "forced core WebGPU device failure",
              "Compatibility device failed",
              "forced compatibility WebGPU device failure",
            ]) {
              if (!message.includes(expected)) {
                throw new Error(
                  `WebGPU device-failure error omitted ${expected}: ${message}`,
                );
              }
            }
          }
          if (
            deviceFeatureLevels.length !== 2 ||
            deviceFeatureLevels[0] !== "core" ||
            deviceFeatureLevels[1] !== "compatibility"
          ) {
            throw new Error(
              `WebGPU device fallback order was ${JSON.stringify(deviceFeatureLevels)}; expected Core then Compatibility`,
            );
          }
          const results = [
            "webgpu-device-failure=device-error order=core,compatibility",
          ];
          window.__rendererSmoke = { status: "passed", results };
          status.textContent = `passed\n${results.join("\n")}`;
          document.body.dataset.status = "passed";
        } else {
          if (forceCompatibility) {
            const gpu = navigator.gpu;
            if (!gpu) {
              throw new Error("forced Compatibility smoke requires WebGPU");
            }
            compatibilityProbe = {
              featureLevelsRequested: [],
              advertisedVertexStorageLimit: null,
              requestedVertexStorageLimit: null,
            };
            window.__compatibilityProbe = compatibilityProbe;
            const requestAdapter = gpu.requestAdapter.bind(gpu);
            const compatibilityGpu = new Proxy(gpu, {
              get(target, property) {
                if (property === "requestAdapter") {
                  return async (options = {}) => {
                    const featureLevel = options.featureLevel ?? "core";
                    compatibilityProbe.featureLevelsRequested.push(featureLevel);
                    if (featureLevel !== "compatibility") {
                      throw new Error("forced Core WebGPU admission failure");
                    }
                    const adapter = await requestAdapter(options);
                    if (!adapter) {
                      return null;
                    }
                    const nativeLimits = Reflect.get(adapter, "limits", adapter);
                    const nativeVertexStorageLimit = Reflect.get(
                      nativeLimits,
                      "maxStorageBuffersInVertexStage",
                      nativeLimits,
                    );
                    const advertisedVertexStorageLimit = forceNoSsbo
                      ? 0
                      : nativeVertexStorageLimit;
                    compatibilityProbe.advertisedVertexStorageLimit =
                      advertisedVertexStorageLimit;
                    const compatibilityLimits = new Proxy(nativeLimits, {
                      get(target, property) {
                        if (property === "maxStorageBuffersInVertexStage") {
                          return advertisedVertexStorageLimit;
                        }
                        return Reflect.get(target, property, target);
                      },
                    });
                    return new Proxy(adapter, {
                      get(target, property) {
                        if (property === "limits") {
                          return compatibilityLimits;
                        }
                        if (property === "requestDevice") {
                          return async (descriptor = {}) => {
                            const requiredLimits = descriptor.requiredLimits ?? {};
                            const requested = Object.prototype.hasOwnProperty.call(
                              requiredLimits,
                              "maxStorageBuffersInVertexStage",
                            )
                              ? requiredLimits.maxStorageBuffersInVertexStage
                              : undefined;
                            compatibilityProbe.requestedVertexStorageLimit = requested;
                            const expected = Number.isFinite(advertisedVertexStorageLimit)
                              ? Math.min(4, advertisedVertexStorageLimit)
                              : undefined;
                            if (requested !== expected) {
                              throw new Error(
                                `renderer requested Compatibility vertex-storage limit ${requested}; expected ${expected}`,
                              );
                            }
                            return target.requestDevice(descriptor);
                          };
                        }
                        const value = Reflect.get(target, property, target);
                        return typeof value === "function" ? value.bind(target) : value;
                      },
                    });
                  };
                }
                const value = Reflect.get(target, property, target);
                return typeof value === "function" ? value.bind(target) : value;
              },
            });
            Object.defineProperty(navigator, "gpu", {
              configurable: true,
              value: compatibilityGpu,
            });
          }

          const results = [await run_backend(document.createElement("canvas"))];
          const presentationCalls = installPresentationCallCounters();
          try {
            const directCanvas = document.createElement("canvas");
            const directPresentation = await assert_direct_presentation(
              directCanvas,
              () => assertPremultipliedPresentationPixels(directCanvas),
            );
            if (
              presentationCalls.counters.getCurrentTexture !== 1 ||
              presentationCalls.counters.mapAsync !== 0 ||
              presentationCalls.counters.putImageData !== 0
            ) {
              throw new Error(
                "ordinary direct presentation called " +
                  `getCurrentTexture=${presentationCalls.counters.getCurrentTexture} ` +
                  `mapAsync=${presentationCalls.counters.mapAsync} ` +
                  `putImageData=${presentationCalls.counters.putImageData}`,
              );
            }
            results.push(
              `${directPresentation} exact-rgba=true composite=over-blue surface=1 mapAsync=0 putImageData=0`,
            );
            const explicitReadback = await assert_explicit_readback(
              document.createElement("canvas"),
            );
            if (
              presentationCalls.counters.getCurrentTexture !== 1 ||
              presentationCalls.counters.mapAsync !== 1 ||
              presentationCalls.counters.putImageData !== 0
            ) {
              throw new Error(
                "explicit readback called " +
                  `getCurrentTexture=${presentationCalls.counters.getCurrentTexture} ` +
                  `mapAsync=${presentationCalls.counters.mapAsync} ` +
                  `putImageData=${presentationCalls.counters.putImageData}`,
              );
            }
            results.push(
              `${explicitReadback} surface=0 mapAsync=1 putImageData=0`,
            );
          } finally {
            presentationCalls.restore();
          }
          if (forceCompatibility) {
            const expectedVertexStorageLimit = Number.isFinite(
              compatibilityProbe.advertisedVertexStorageLimit,
            )
              ? Math.min(4, compatibilityProbe.advertisedVertexStorageLimit)
              : undefined;
            if (
              compatibilityProbe.featureLevelsRequested.length < 2 ||
              compatibilityProbe.featureLevelsRequested[0] !== "core" ||
              compatibilityProbe.featureLevelsRequested[1] !== "compatibility" ||
              compatibilityProbe.requestedVertexStorageLimit !==
                expectedVertexStorageLimit
            ) {
              throw new Error(
                `Compatibility admission was incomplete: ${JSON.stringify(compatibilityProbe)}`,
              );
            }
            results.push(
              forceNoSsbo
                ? "compatibility=selected order=core,compatibility vertex-storage-limit=0 polyfill=rendered"
                : `compatibility=selected order=core,compatibility requested-vertex-storage-limit=${compatibilityProbe.requestedVertexStorageLimit} rendered`,
            );
          } else {
            const canvasLeaseCanvas = document.createElement("canvas");
            const canvasLeaseCalls =
              installCanvasLeaseCallCounters(canvasLeaseCanvas);
            try {
              const expectedCanvasLeaseCheckpoints = [
                {
                  phase: "factory-a-dropped",
                  unconfigure: 0,
                  events: ["A:configure", "A:present"],
                },
                {
                  phase: "retained-frame-dropped",
                  unconfigure: 1,
                  events: ["A:configure", "A:present", "A:unconfigure"],
                },
              ];
              let canvasLeaseCheckpointIndex = 0;
              const canvasLeaseResult = await assert_exclusive_canvas_lease(
                canvasLeaseCanvas,
                (phase) => {
                  const expected =
                    expectedCanvasLeaseCheckpoints[
                      canvasLeaseCheckpointIndex
                    ];
                  if (!expected || phase !== expected.phase) {
                    throw new Error(
                      "exclusive canvas lease checkpoint " +
                        `${canvasLeaseCheckpointIndex + 1} was ${phase}`,
                    );
                  }
                  if (
                    canvasLeaseCalls.counters.unconfigure !==
                    expected.unconfigure
                  ) {
                    throw new Error(
                      `exclusive canvas lease checkpoint ${phase} observed ` +
                        `unconfigure=${canvasLeaseCalls.counters.unconfigure}; ` +
                        `expected ${expected.unconfigure}`,
                    );
                  }
                  if (
                    canvasLeaseCalls.events.length !== expected.events.length ||
                    canvasLeaseCalls.events.some(
                      (event, index) => event !== expected.events[index],
                    )
                  ) {
                    throw new Error(
                      `exclusive canvas lease checkpoint ${phase} events were ` +
                        JSON.stringify(canvasLeaseCalls.events) +
                        "; expected " +
                        JSON.stringify(expected.events),
                    );
                  }
                  canvasLeaseCheckpointIndex += 1;
                },
              );
              if (
                canvasLeaseCheckpointIndex !==
                expectedCanvasLeaseCheckpoints.length
              ) {
                throw new Error(
                  "exclusive canvas lease observed " +
                    `${canvasLeaseCheckpointIndex} checkpoints; expected ` +
                    expectedCanvasLeaseCheckpoints.length,
                );
              }
              if (
                canvasLeaseCalls.counters.configure !== 2 ||
                canvasLeaseCalls.counters.unconfigure !== 2 ||
                canvasLeaseCalls.counters.getCurrentTexture !== 2
              ) {
                throw new Error(
                  "exclusive canvas lease called " +
                    `configure=${canvasLeaseCalls.counters.configure} ` +
                    `unconfigure=${canvasLeaseCalls.counters.unconfigure} ` +
                    `getCurrentTexture=${canvasLeaseCalls.counters.getCurrentTexture}`,
                );
              }
              const expectedCanvasLeaseEvents = [
                "A:configure",
                "A:present",
                "A:unconfigure",
                "B:configure",
                "B:present",
                "B:unconfigure",
              ];
              if (
                canvasLeaseCalls.events.length !==
                  expectedCanvasLeaseEvents.length ||
                canvasLeaseCalls.events.some(
                  (event, index) => event !== expectedCanvasLeaseEvents[index],
                )
              ) {
                throw new Error(
                  "exclusive canvas lease events were " +
                    JSON.stringify(canvasLeaseCalls.events) +
                    "; expected " +
                    JSON.stringify(expectedCanvasLeaseEvents),
                );
              }
              results.push(
                `${canvasLeaseResult} configure=2 unconfigure=2 getCurrentTexture=2`,
              );
            } finally {
              canvasLeaseCalls.restore();
            }

            const retainedCalls = installPresentationCallCounters();
            const retainedObserver = installRetainedFrameObserver(
              retainedCalls.counters,
            );
            try {
              const retainedResult = await assert_retained_frame_removal(
                document.createElement("canvas"),
                document.createElement("canvas"),
              );
              if (
                retainedCalls.counters.getCurrentTexture !== 2 ||
                retainedCalls.counters.mapRead !== 2 ||
                retainedCalls.counters.putImageData !== 0
              ) {
                throw new Error(
                  "retained frame removal called " +
                    `getCurrentTexture=${retainedCalls.counters.getCurrentTexture} ` +
                    `mapRead=${retainedCalls.counters.mapRead} ` +
                    `mapAsync=${retainedCalls.counters.mapAsync} ` +
                    `putImageData=${retainedCalls.counters.putImageData}`,
                );
              }
              results.push(
                `${retainedResult} surface=2 mapRead=2 putImageData=0`,
              );
            } finally {
              retainedObserver.restore();
              retainedCalls.restore();
            }

            const resizeCanvas = document.createElement("canvas");
            const resizeResult = await assert_resize(
              resizeCanvas,
              () => assertOpaquePresentationPixels(
                resizeCanvas,
                [0x65, 0x43, 0x21, 0xff],
                "resized direct WebGPU presentation",
              ),
            );
            results.push(resizeResult);

            const retryCanvas = document.createElement("canvas");
            const acquisitionLoss =
              installSurfaceAcquisitionLoss(retryCanvas);
            try {
              const retryResult = await assert_surface_acquisition_retry(
                retryCanvas,
                () => assertPremultipliedPresentationPixels(retryCanvas),
              );
              if (
                acquisitionLoss.acquisitions !== 2 ||
                acquisitionLoss.surfaces !== 2
              ) {
                throw new Error(
                  `surface acquisition recovery observed ${acquisitionLoss.acquisitions} acquisitions and ${acquisitionLoss.surfaces} surfaces`,
                );
              }
              const expectedAcquisitionEvents = [
                "surface:create:getContext",
                "acquire:1:injected-loss",
                "surface:recreate:getContext",
                "acquire:2:success",
                "release:getContext",
                "release:unconfigure",
              ];
              if (
                acquisitionLoss.events.length !==
                  expectedAcquisitionEvents.length ||
                acquisitionLoss.events.some(
                  (event, index) =>
                    event !== expectedAcquisitionEvents[index],
                )
              ) {
                throw new Error(
                  "surface acquisition recovery events were " +
                    JSON.stringify(acquisitionLoss.events) +
                    "; expected " +
                    JSON.stringify(expectedAcquisitionEvents),
                );
              }
              results.push(`${retryResult} acquisitions=2 surfaces=2`);
            } finally {
              acquisitionLoss.restore();
            }

            const persistentLossCanvas = document.createElement("canvas");
            const persistentAcquisitionLoss = installSurfaceAcquisitionLoss(
              persistentLossCanvas,
              true,
            );
            try {
              const persistentResult =
                await assert_persistent_surface_acquisition_failure(
                  persistentLossCanvas,
                );
              if (
                persistentAcquisitionLoss.acquisitions !== 2 ||
                persistentAcquisitionLoss.surfaces !== 2
              ) {
                throw new Error(
                  `persistent surface acquisition failure observed ${persistentAcquisitionLoss.acquisitions} acquisitions and ${persistentAcquisitionLoss.surfaces} surfaces`,
                );
              }
              const expectedPersistentAcquisitionEvents = [
                "surface:create:getContext",
                "acquire:1:injected-loss",
                "surface:recreate:getContext",
                "acquire:2:injected-loss",
                "release:getContext",
                "release:unconfigure",
              ];
              if (
                persistentAcquisitionLoss.events.length !==
                  expectedPersistentAcquisitionEvents.length ||
                persistentAcquisitionLoss.events.some(
                  (event, index) =>
                    event !== expectedPersistentAcquisitionEvents[index],
                )
              ) {
                throw new Error(
                  "persistent surface acquisition failure events were " +
                    JSON.stringify(persistentAcquisitionLoss.events) +
                    "; expected " +
                    JSON.stringify(expectedPersistentAcquisitionEvents),
                );
              }
              results.push(
                `${persistentResult} acquisitions=2 surfaces=2`,
              );
            } finally {
              persistentAcquisitionLoss.restore();
            }
            results.push(await assert_direct_gpu_canvas_image(document.createElement("canvas")));
            results.push(await assert_imported_gpu_canvas(document.createElement("canvas")));
            results.push(await assert_webgpu_gpu_canvas_rejects_invalid_interface(document.createElement("canvas")));
            results.push(await assert_webgpu_uniform_limit_rejection(document.createElement("canvas")));

            const streamCases = [
              { suite: "gm", name: "rect", maxDifferent: 2048, maxOffEdge: 0 },
              { suite: "gm", name: "rect_grad", maxDifferent: 1536, maxOffEdge: 0 },
              { suite: "gm", name: "degengrad", maxDifferent: 20000, maxOffEdge: 4096 },
              { suite: "gm", name: "CubicStroke", maxDifferent: 2560, maxOffEdge: 0 },
              { suite: "gm", name: "cliprects", maxDifferent: 10240, maxOffEdge: 0 },
              { suite: "gm", name: "poly_clockwise", maxDifferent: 3584, maxOffEdge: 0 },
              { suite: "gm", name: "poly_evenOdd", maxDifferent: 5632, maxOffEdge: 0 },
              { suite: "gm", name: "image", maxDifferent: 2048, maxOffEdge: 512 },
              { suite: "gm", name: "image_filter_options", maxDifferent: 11264, maxOffEdge: 0 },
              { suite: "riv", name: "scripted_color", reference: "riv-scripted_color-frame-0", maxDifferent: 4096, maxOffEdge: 0 },
            ];
            for (const testCase of streamCases) {
              const { name, suite } = testCase;
              const label = testCase.reference ?? `${suite}-${name}`;
              const streamText = await fetch(
                `/fixtures/renderer/streams/${suite}/${name}.rive-stream`,
              ).then((response) => response.text());
              const streamReference = new Uint8Array(await fetch(
                `/fixtures/renderer/reference/dawn-webgpu-metal/${suite}/${label}-msaa.png`,
              ).then((response) => response.arrayBuffer()));
              results.push(await run_stream_case(
                document.createElement("canvas"),
                label,
                streamText,
                streamReference,
                1,
                0,
                0,
                0,
              ));
            }
          }
          window.__rendererSmoke = { status: "passed", results };
          status.textContent = `passed\n${results.join("\n")}`;
          document.body.dataset.status = "passed";
        }
      } catch (error) {
        const message = error?.stack || String(error);
        window.__rendererSmoke = { status: "failed", error: message };
        status.textContent = `failed\n${message}`;
        document.body.dataset.status = "failed";
      }
    </script>
  </body>
</html>
