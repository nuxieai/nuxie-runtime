[[findings]]
id = "SR-OVL-04-01"
overlay_id = "webgpu-abi"
severity = "P2"
summary = "The C++ aggregate-default loss reaches the active public ORE bind-group-layout path. That path default-constructs each BindGroupLayoutEntry, modifies only the selected resource arm, and submits the entries to CreateBindGroupLayout. Source defaults every inactive arm to BindingNotUsed and texture dimensions to e2D; the generated facade composes raw C defaults whose inactive arms are Undefined. ORE therefore submits undefined extra alternatives instead of the source's one-active-arm layout, allowing otherwise valid layout declarations to be rejected or misclassified during layout creation."
citations = [
  "support:tools/backend-port/generate_webgpu_cpp_binding.py:431-478",
  "source:renderer/src/webgpu/wagyu-port/include/webgpu/webgpu_cpp.h:2254-2265",
