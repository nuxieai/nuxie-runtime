[[findings]]
id = "SR-C101-03"
severity = "P2"
summary = "Six output-producing wrappers omit the source-mandated assignment to a fresh default output before entering the raw API: Adapter::{GetFeatures, GetInfo}, Device::{GetAdapterInfo, GetFeatures}, Instance::GetWGSLLanguageFeatures, and Surface::GetCapabilities. The target forwards the caller's existing output state directly, changing pre-call state and operation order."
