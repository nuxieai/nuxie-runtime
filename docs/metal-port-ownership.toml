# The third materializes one canonical-equivalent four-solid lightweight flush,
# preserves authored IDs and z/compositing, schedules exact disjoint draw groups, and applies the
# initial, group-transition, and pre-resolve barrier policy. A disjoint companion
# proves two paths in one group have no internal barrier. The fourth adds two
# nested clip updates, flush-wide clipped initialize/path/resolve keys,
