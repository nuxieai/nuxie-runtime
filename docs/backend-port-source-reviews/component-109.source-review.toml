[[findings]]
id = "SR-C109-11"
severity = "P3"
summary = "Source uses each selected generated WGSL shader's variant-specific embedded label. Target supplies generic handwritten labels that collapse storage/no-storage, clip/no-clip, and fixed-color variants, changing shader-module labels and associated diagnostics."
citations = [
  "source:renderer/src/webgpu/render_context_webgpu_impl.cpp:230-241",
