[[findings]]
id = "SR-C101-01"
severity = "P1"
summary = "The typed callback facade is not executable in the target. The source defines callback families and branchy setters/async overloads that build callback-info, select StringView versus const char* adaptation, populate mode/userdata, and enforce one-time DeviceDescriptor callback installation. The target aliases DeviceDescriptor to the raw C descriptor and reduces async methods to calls accepting prebuilt C callback-info; template methods are otherwise only name/count metadata."
