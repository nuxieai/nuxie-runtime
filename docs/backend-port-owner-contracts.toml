schema_version = 1
upstream_ref = "4ac7b32798da0482e441ef09304dc3b480ed3ee5"
review_basis = "complete pinned source owners, Clang field inventory, lifecycle evidence inventory, configuration inventory, and pinned build graph"
field_rule = "Preserve every configuration-admitted field's identity, declared semantics, construction order, and reverse destruction order; no aggregate owner may hide separately published source fields."
failure_rule = "Preserve source-order partial construction, publication, error propagation, retry state, callback completion, and cleanup; no success-returning no-op, fallback, or transactional behavior absent from source."

[[family]]
id = "shared-shader-and-build-authority"
campaign = "shader-build-authority"
unit_prefixes = ["build:", "dependency:", "shader:"]
review_status = "reviewed"
configuration_rule = "All pinned source variants, Make predicates, compile defines, optimizer flags, and generated artifacts remain exact; backend-specific consumers select declared outputs without rewriting shader semantics."
ownership_rule = "Build tools and shader inputs own generated bytes only through the frozen build graph; generated outputs are immutable translation inputs, not runtime lifetime owners."
synchronization_rule = "not-applicable-build-time-authority"
destruction_rule = "not-applicable-build-time-authority"

[[family]]
id = "vulkan-renderer-owners"
campaign = "vulkan"
unit_prefixes = ["vulkan:renderer:"]
review_status = "reviewed"
configuration_rule = "Admit the RIVE_VULKAN renderer build exactly, including pinned extension, feature, layout, shader-variant, VMA, and validation predicates."
ownership_rule = "VulkanContext and each renderer owner preserve source rcp relationships and raw Vk handle ownership. Every image, view, buffer, allocation, descriptor, pipeline, render pass, command object, fence, semaphore, and cache remains with its declaring owner; native children cannot outlive their device/context."
synchronization_rule = "Preserve source queue-family selection, command-pool/buffer state, pipeline barriers, stage/access masks, layouts, flush/invalidate operations, submit order, fence/semaphore waits, and mapped-memory visibility."
destruction_rule = "Run each explicit source destructor and field teardown in source reverse order; destroy resource handles before their allocator/device, and allocator/device before instance teardown."

[[family]]
id = "vulkan-ore-owners"
campaign = "vulkan"
unit_prefixes = ["vulkan:ore:"]
review_status = "reviewed"
configuration_rule = "Admit ORE_BACKEND_VK with RIVE_ORE exactly; GL coexistence branches are not implied."
ownership_rule = "ContextVulkan owns command, descriptor-pool-generation, pending-transition/upload, render-pass-cache, and empty-layout state. Each ORE resource retains the exact context/resource dependencies declared by source; descriptor allocations retain their pool generation."
synchronization_rule = "Preserve command recording transitions, pending upload/initial-transition order, per-frame fence reset/wait, descriptor pool rollover, and queue submission behavior."
destruction_rule = "Drain or release pending work and destroy cached render passes, descriptor pools, command resources, textures, buffers, and retained contexts in exact source order."

[[family]]
id = "webgpu-wagyu-dependency-authority"
campaign = "webgpu"
unit_prefixes = ["webgpu:wagyu:"]
review_status = "reviewed"
configuration_rule = "Treat Wagyu v1 C/C++ headers, chained structures, bitmasks, JavaScript stubs, and port generator as pinned ABI/build authority; do not translate them as renderer behavior."
ownership_rule = "Preserve ABI field layout and reference/release contracts when the exact WebGPU port crosses the Wagyu seam."
synchronization_rule = "Callbacks and async status values cross the ABI once with the source user-data lifetime."
destruction_rule = "Reference/release pairs and callback user-data cleanup follow the generated API contract."

[[family]]
id = "webgpu-renderer-owners"
campaign = "webgpu"
unit_prefixes = ["webgpu:renderer:"]
review_status = "reviewed"
configuration_rule = "Translate both RIVE_WEBGPU=1 Wagyu and RIVE_WEBGPU=2 Dawn branches, including compatibility aliases, Core/Compatibility features, limits, shader variants, and RIVE_DAWN behavior."
ownership_rule = "Preserve every WebGPU handle/reference, context option, pipeline/cache, texture/buffer, bind group/layout, async request, error scope, device-loss, and uncaptured-error owner. The legacy Rust-WGPU owner graph is not reused as authority."
synchronization_rule = "Preserve map/unmap callbacks, submitted-work completion, error-scope ordering, device polling, upload/copy alignment, command encoder/pass finalization, and device-loss publication."
destruction_rule = "Finish active passes/encoders once, release WebGPU references and callback state in source reverse order, and never report success after device/context loss."

[[family]]
id = "webgpu-ore-owners"
campaign = "webgpu"
unit_prefixes = ["webgpu:ore:"]
review_status = "reviewed"
configuration_rule = "Admit ORE_BACKEND_WGPU for both pinned WebGPU API versions and exact runtime shader-language selection."
ownership_rule = "ContextWGPU and ORE resources preserve bind-group/layout, buffer mapping, pipeline, pass, sampler, shader, texture/view, adapter, device, and queue reference ownership."
synchronization_rule = "Preserve async adapter/device, map, submitted-work, error, and loss callback lifetimes plus command/pass completion order."
destruction_rule = "Release retained WebGPU resources only after dependent commands/callbacks have transferred or completed their source ownership."

[[family]]
id = "webgl2-renderer-owners"
campaign = "webgl2"
unit_prefixes = ["webgl2:renderer:"]
review_status = "reviewed"
configuration_rule = "Admit the Emscripten RIVE_WEBGL build and pls_impl_webgl.cpp exactly. Record Android/native EXT PLS, RW-texture PLS, native loader implementation, and Objective-C branches as pinned-build exclusions rather than translating them."
ownership_rule = "GLState and declaring renderer owners retain every GLuint program, shader, buffer, texture, framebuffer, renderbuffer, VAO, query, and deferred-delete identity. Preserve cached GL state, pixel-store state, active units, capabilities, context identity, and WebGL PLS extension state."
synchronization_rule = "Preserve GL command order, flush/finish points, framebuffer/PLS begin-end and load-store actions, barriers, readback, and context-loss/restoration invalidation."
destruction_rule = "Delete GL names through the live source GLState/context in reverse owner order; after context loss, reject stale identities and never issue deletion against a replacement context."

[[family]]
id = "webgl2-ore-owners"
campaign = "webgl2"
unit_prefixes = ["webgl2:ore:"]
review_status = "reviewed"
configuration_rule = "Admit ORE_BACKEND_GL under Emscripten from .cpp sources; exclude macOS Objective-C .mm implementations."
ownership_rule = "ContextGL and ORE resources preserve GL object, bind-group, buffer, pipeline, pass, sampler, shader, texture, and render-target ownership through the shared live GLState."
synchronization_rule = "Preserve binding/state changes, pass boundaries, uploads, readbacks, and context-loss checks in authored order."
destruction_rule = "Release ORE GL names through their retained GLState before context loss or mark them stale; excluded Objective-C owners remain untranslated."
