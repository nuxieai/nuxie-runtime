# User-approved deliberate divergences are recorded here and cited by their
# parity-gap-register D-row.

[[decision]]
id = "D2"
source = "docs/parity-gap-register.md#d--deliberate-divergence-register-declare-dont-fix"
approved = "The project-wide saturating float-to-int policy was already binding; the user reaffirmed on 2026-07-25 that Rust should make the sensible safe choice where C++ relies on a condition Rust cannot represent safely."

[[gap]]
id = "FL-G01"
status = "open"
mechanism = "FL-B1/FL-B2/FL-B3/FL-B4 now mirror the C++ KeyFrame, LinearAnimation, AnimationReset, and blend definition/occurrence owners: each concrete frame occurrence retains attachment-time seconds inside one insertion-ordered KeyedProperty sequence, one type-safe target enum binds CoreRegistry's single property dispatch, the Artboard owns one immutable definition arena, every animation occurrence retains only a typed definition handle plus C++-shaped mutable state, and each reset occurrence leases one pooled first-seen object/property stream that is cleared and returned on final release. Each BlendState uniquely owns its ordered BlendAnimation definitions; every embedded blend occurrence retains a handle back to that exact definition, reads live source/value fields during advance, and retains unresolved animation IDs through the shared empty-animation owner. Rust-only StateMachineInstance snapshot clones share immutable definition/reset leases instead of cloning factory state. C++'s process-global empty animation is represented by one safe Artboard-shared definition because Rust's full definition type can contain non-Sync scripting handles; its generated defaults, occurrence sharing, and behavior remain exact. The former read-time fps calculation, six parallel frame vectors, property-family booleans, import-time source snapshots, per-occurrence descriptor clones, copied blend source/value payloads, positional from/to rediscovery, invalid-definition/empty-state elision, Option loop override, local zero guards, flat reset clones, global pair scans, and empty-reset elision are deleted. The gap remains open only until the complete FL-B owner family is independently verified."
