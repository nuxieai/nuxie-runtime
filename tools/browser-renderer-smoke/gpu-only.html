<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Nuxie WebGPU GPU-canvas smoke</title>
  </head>
  <body>
    <pre id="status">running</pre>
    <script type="module">
      import init, {
        assert_direct_gpu_canvas_image,
        assert_imported_gpu_canvas,
        assert_webgpu_gpu_canvas_rejects_invalid_interface,
        assert_webgpu_uniform_limit_rejection,
      } from "./pkg/browser_renderer_smoke.js";

      const status = document.querySelector("#status");
      try {
        await init();
        const results = [
          await assert_direct_gpu_canvas_image(document.createElement("canvas")),
          await assert_imported_gpu_canvas(document.createElement("canvas")),
          await assert_webgpu_gpu_canvas_rejects_invalid_interface(document.createElement("canvas")),
          await assert_webgpu_uniform_limit_rejection(document.createElement("canvas")),
        ];
        window.__rendererSmoke = { status: "passed", results };
        status.textContent = `passed\n${results.join("\n")}`;
        document.body.dataset.status = "passed";
      } catch (error) {
        const message = error?.stack || String(error);
        window.__rendererSmoke = { status: "failed", error: message };
        status.textContent = `failed\n${message}`;
        document.body.dataset.status = "failed";
      }
    </script>
  </body>
</html>
