[package]
name = "nuxie-renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
# Stable product roots for the three exact-source renderer ports. Their
# internal campaign feature names remain aliases for source-shaped cfg owners;
# none of these roots selects another renderer or an automatic fallback.
renderer-vulkan = ["native-vulkan-experimental", "rive-decoders"]
renderer-webgpu = ["native-webgpu-experimental", "rive-decoders"]
renderer-webgl2 = ["native-webgl2-experimental", "rive-decoders"]
renderer-metal = ["native-metal-experimental", "rive-decoders"]
# Exact native Metal renderer used by Apple product roots.
native-metal-experimental = []
# Builds the exact pinned Vulkan campaign without selecting it for shipping.
native-vulkan-experimental = ["dep:ash", "dep:nuxie-ore-metal", "dep:vk-mem"]
# Builds the exact pinned Dawn/Wagyu WebGPU campaign.
native-webgpu-experimental = ["dep:libc", "dep:nuxie-ore-metal", "dep:web-time"]
# Builds the exact pinned WebGL2 campaign for the browser.
native-webgl2-experimental = [
    "ore-gl",
    "dep:js-sys",
    "dep:nuxie-ore-metal",
    "dep:wasm-bindgen",
    "dep:web-time",
    "dep:web-sys",
]
# Retains the pinned vendor-Wagyu conditional branches independently from the
# native Dawn/WebGPU product selection.
native-wagyu-experimental = ["native-webgpu-experimental"]
with-rive-tools = ["nuxie-ore-metal?/with-rive-tools"]
track-rive-shader-id = ["nuxie-ore-metal?/track-rive-shader-id"]
# Wires the pinned RIVE_CANVAS ORE constructor to the exact native renderer
# device and queue. This stays opt-in until the native renderer cutover.
native-ore-metal-experimental = ["native-metal-experimental", "dep:nuxie-ore-metal"]
# Exact pinned `RIVE_CANVAS` branch for the Vulkan renderer, including the
# texture-backed RenderCanvas target and the Vulkan ORE context constructor.
native-ore-vulkan-experimental = ["native-vulkan-experimental"]
# Exact mechanical predicates for the pinned renderer's optional source paths.
rive-generate-feather-lut = []
rive-ktx2 = []
rive-decoders = []
# Exact `ORE_BACKEND_GL && RIVE_CANVAS` predicate for the GL-only canvas
# import helper. It is intentionally independent of the Metal canvas feature.
ore-gl = []

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
libc = { version = "0.2", optional = true }
nuxie-image-codec = { path = "../nuxie-image-codec" }
nuxie-render-api = { path = "../nuxie-render-api" }
png = "0.18"
regex = "1"
smallvec = "1.15.2"
sha2 = "0.10"

[build-dependencies]
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = { version = "=0.38.0", optional = true }
nuxie-ore-metal = { path = "../nuxie-ore-metal", optional = true }
vk-mem = { version = "=0.5.0", path = "../../vendor/vk-mem-0.5.0", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos", target_os = "visionos"))'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["block2", "MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLSampler", "MTLTexture", "MTLTypes"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }
nuxie-ore-metal = { path = "../nuxie-ore-metal", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos", target_os = "visionos"))'.dev-dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes", "objc2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
nuxie-ore-metal = { path = "../nuxie-ore-metal", optional = true }
raw-window-handle = "0.6"
wasm-bindgen = { version = "0.2", optional = true }
web-time = { version = "1.1.0", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Event", "EventTarget", "HtmlCanvasElement", "WebGl2RenderingContext"] }

[dev-dependencies]
nuxie-binary = { path = "../nuxie-binary" }
nuxie-graph = { path = "../nuxie-graph" }
nuxie-render-stream = { path = "../nuxie-render-stream" }
nuxie-runtime = { path = "../nuxie-runtime" }

[[example]]
name = "native_metal_tracer_root"
required-features = ["native-metal-experimental"]
