findings = [{ id = "OR-C109-01", severity = "P1", summary = "ContextWGPU's source beginFrame contract receives an untyped external command-buffer pointer and immediately casts and moves it, but the target preserves that operation behind the safe ContextApi::beginFrame and beginFrameOwned entry points. FrameDescriptor can therefore carry any non-null c_void pointer into safe Rust, where beginFrame casts it to CommandEncoder, creates a mutable reference, and moves from it; a wrong type, dangling pointer, or misaligned pointer makes safe code trigger undefined behavior. The target's typed beginFrameExternal alternative does not close this safe untyped dispatch path.", review_domains = ["provenance-and-aliasing", "failure-and-loss", "unsafe-ffi-and-abi"], citations = ["source:renderer/src/ore/wgpu/ore_context_wgpu.cpp:482-488", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_include_rive_renderer_ore_ore_context_wgpu_hpp__decl.rs:77-83", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_context_wgpu_cpp__impl.rs:1206-1217", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_context_wgpu_cpp__impl.rs:1277-1288"], authority_keys = ["component:component-109", "lifecycle-raw:campaign=webgpu\u001fevent_class=failure-or-loss\u001fline=484\u001fmatched_token=assert\u001fownership_unit=webgpu:ore:context\u001freview_status=review-required\u001fsource_evidence=assert(desc.externalCommandBuffer != nullptr);\u001fsource_path=renderer/src/ore/wgpu/ore_context_wgpu.cpp", "field-raw:campaign=webgpu\u001fconfiguration=webgpu-dawn-v2\u001fdeclaration_line=95\u001fdeclared_type=wgpu::CommandEncoder\u001ffield_name=m_wgpuCommandEncoder\u001ffield_order=4\u001fownership_review=value-lifetime-review-required\u001fownership_unit=webgpu:ore:context\u001fqualified_type=rive::ore::ContextWGPU\u001fsource_path=renderer/include/rive/renderer/ore/ore_context_wgpu.hpp", "field-raw:campaign=webgpu\u001fconfiguration=webgpu-wagyu-v1\u001fdeclaration_line=95\u001fdeclared_type=wgpu::CommandEncoder\u001ffield_name=m_wgpuCommandEncoder\u001ffield_order=4\u001fownership_review=value-lifetime-review-required\u001fownership_unit=webgpu:ore:context\u001fqualified_type=rive::ore::ContextWGPU\u001fsource_path=renderer/include/rive/renderer/ore/ore_context_wgpu.hpp"] }, { id = "OR-C109-02", severity = "P1", summary = "The source BufferWGPU and BindGroupWGPU objects are unsynchronized recording-thread owners with raw ContextWGPU and BufferWGPU pointers. The target marks BufferWGPUState, BufferWGPU, RecordingCell, and BindGroupWGPU Send while exposing safe methods that dereference those raw pointers and touch context/device state. Although AnyResourceHandle normally checks payload access against the recording thread, the unsafe Send contracts must remain sound for every safe crate-level construction and use of the concrete values; they currently permit a value to be moved or shared and then invoked on another thread, causing wrong-thread native access, data races, or a stale raw-pointer dereference.", review_domains = ["provenance-and-aliasing", "callbacks-and-threading", "synchronization-and-mapping"], citations = ["source:renderer/src/ore/wgpu/ore_bind_group_wgpu.hpp:12-69", "source:renderer/src/ore/wgpu/ore_buffer_wgpu.hpp:10-63", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_bind_group_wgpu_hpp__decl.rs:23-72", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_bind_group_wgpu_hpp__decl.rs:90-127", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_bind_group_wgpu_cpp__impl.rs:13-17", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_bind_group_wgpu_cpp__impl.rs:33-92", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_buffer_wgpu_hpp__decl.rs:21-110", "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_o