[package]
name = "nuxie-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cpal = { version = "0.16", optional = true }
symphonia-bundle-flac = { version = "=0.5.5", default-features = false }
symphonia-bundle-mp3 = { version = "=0.5.5", default-features = false, features = ["mp3"] }
symphonia-codec-pcm = "=0.5.5"
symphonia-core = "=0.5.5"
symphonia-format-riff = { version = "=0.5.5", default-features = false, features = ["wav"] }

[lints]
workspace = true

[features]
audio-device = ["dep:cpal"]
