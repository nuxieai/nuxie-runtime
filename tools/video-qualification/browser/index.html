<!doctype html><meta charset="utf-8"><title>Nuxie video proof</title>
<canvas id="canvas" width="64" height="32"></canvas><div id="captions" lang="en" role="status" aria-live="polite" aria-atomic="true"></div><pre id="result">loading</pre>
<script type="module">
import init,{BrowserVideoProof} from './video_qualification.js';
const result=document.querySelector('#result');
try {
  await init();
  const proof=new BrowserVideoProof(document.querySelector('#canvas'),(new URL(location.href).searchParams.has('embedded')?'embedded':new URL('./red-blue-audio.mp4',location.href).href));
  const start=performance.now();
  const tick=()=>{try {
    const ended=proof.tick();
    document.querySelector("#captions").textContent=proof.caption();
    if(ended){result.textContent=JSON.stringify({status:'passed',rangeLoops:2,frames:proof.frames(),backend:'webgl2'});proof.free();return;}
    if(performance.now()-start>15000)throw new Error('playback timed out');
    requestAnimationFrame(tick);
  }catch(error){result.textContent='FAILED: '+error;proof.free();}};
  requestAnimationFrame(tick);
}catch(error){result.textContent='FAILED: '+error;}
</script>
