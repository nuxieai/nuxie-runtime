# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "nuxie"
version = "0.1.0"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[lib]
path = "lib.rs"

[features]
"default" = ["android-authored-wgsl", "js-host-seed", "ore-metal-authored-msl", "renderer-metal", "renderer-vulkan", "scripting", "test-support"]
"js-host-seed" = ["nuxie-runtime/js-host-seed", "nuxie-scripting?/js-host-seed"]
"renderer-metal" = ["dep:nuxie-renderer", "nuxie-renderer/renderer-metal"]
"renderer-vulkan" = ["dep:nuxie-renderer", "nuxie-renderer/renderer-vulkan"]
"renderer-webgpu" = ["dep:nuxie-renderer", "nuxie-renderer/renderer-webgpu"]
"renderer-webgl2" = ["dep:nuxie-renderer", "nuxie-renderer/renderer-webgl2"]
"ore-metal-authored-msl" = ["scripting", "nuxie-scripting/apple-authored-msl", "dep:nuxie-ore-metal", "dep:objc2", "dep:objc2-metal"]
"android-authored-wgsl" = ["scripting", "nuxie-scripting/android-authored-wgsl"]
"threading" = ["nuxie-runtime/threading"]
"scriptnet" = ["scripting", "nuxie-scripting/scriptnet"]
"test-support" = ["nuxie-runtime/tools", "nuxie-scripting?/tools"]
"scripting" = ["dep:nuxie-scripting", "nuxie-scripting?/luau"]

[dependencies]
"anyhow" = { "version" = "1" }
"nuxie-binary" = { "path" = "../nuxie-binary" }
"nuxie-image-codec" = { "path" = "../nuxie-image-codec" }
"nuxie-render-api" = { "path" = "../nuxie-render-api" }
"nuxie-renderer" = { "path" = "../nuxie-renderer", "optional" = true, "default-features" = false }
"nuxie-runtime" = { "path" = "../nuxie-runtime", "default-features" = false }
"nuxie-schema" = { "path" = "../nuxie-schema" }
"nuxie-scripting" = { "path" = "../nuxie-scripting", "optional" = true, "default-features" = false }
"sha2" = { "version" = "0.10" }

[dev-dependencies]
"nuxie-ore-metal" = { "path" = "../nuxie-ore-metal", "default-features" = false }
"nuxie-renderer" = { "path" = "../nuxie-renderer", "default-features" = false }
"luaur-common" = { "version" = "=0.1.8", "path" = "../luaur-common", "default-features" = false, "features" = ["__bazel_dependency_default"] }
"luaur-compiler" = { "version" = "=0.1.8", "path" = "../luaur-compiler", "default-features" = false, "features" = ["__bazel_dependency_default"] }
"ed25519-dalek" = { "version" = "2", "default-features" = false, "features" = ["std"] }
"nuxie" = { "path" = "../nuxie", "default-features" = false, "features" = ["scripting", "test-support"] }
"nuxie-binary" = { "path" = "../nuxie-binary", "features" = ["test-support"] }
"nuxie-render-stream" = { "path" = "../nuxie-render-stream" }
"nuxie-schema" = { "path" = "../nuxie-schema" }
"serde_json" = { "version" = "1" }
"silver-corpus" = { "path" = "../silver-corpus" }
"runtime-test-support" = { "path" = "../runtime-test-support" }

[target."cfg(any(target_os = \"ios\", target_os = \"macos\"))".dependencies]
"nuxie-ore-metal" = { "path" = "../nuxie-ore-metal", "optional" = true }
"objc2" = { "version" = "0.6.4", "optional" = true }
"objc2-metal" = { "version" = "0.3.2", "optional" = true, "default-features" = false, "features" = ["MTLAllocation", "MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }
