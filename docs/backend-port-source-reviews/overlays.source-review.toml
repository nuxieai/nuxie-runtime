[[findings]]
id = "SR-OVL-05-01"
overlay_id = "shared-ore-contracts"
severity = "P1"
summary = "WebGPU ORE pipeline validation rejects every concrete BindGroupLayoutWGPU handle when the reflected shader binding map is nonempty. Source passes the derived layout through BindGroupLayout* and validates its base, but target WebGPU forwards an erased concrete handle to the shared validator, which exact-downcasts to the Rust BindGroupLayout payload instead of using the authored base projection. The first referenced group therefore reports that its handle is not a BindGroupLayout and makePipeline returns None; Vulkan and GL already use the base-aware validation seam."
citations = [
  "external:renderer/include/rive/renderer/ore/ore_bind_group_layout.hpp:23-30",
  "external:renderer/include/rive/renderer/ore/ore_bind_group_layout.hpp:67-78",
  "source:renderer/src/ore/wgpu/ore_bind_group_layout_wgpu.hpp:9-20",
  "source:renderer/src/ore/wgpu/ore_context_wgpu.cpp:848-868",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_bind_group_layout_wgpu_hpp__decl.rs:22-75",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_context_wgpu_cpp__impl.rs:754-783",
  "support:crates/nuxie-ore-metal/src/mechanical_port/source/renderer/src/ore/ore_bind_group_layout_cpp.rs:95-139",
  "target:crates/nuxie-renderer/src/mechanical_port/webgpu/renderer_src_ore_wgpu_ore_context_wgpu_cpp__impl.rs:682-700",
  "target:crates/nuxie-renderer/src/mechanical_port/vulkan/renderer_src_ore_vulkan_ore_pipeline_vulkan_cpp__impl.rs:209-240",
