[canonicalization]
logical_lines = "len(exact_file_bytes.splitlines()); an unterminated nonempty final line counts once."
tsv_row_key = "For prefix K and raw TSV record R, K + colon + U+001F-join of name=value for every header sorted by UTF-8 header bytes. Values are exact decoded TSV cells with no trimming or normalization."
authority_set_sha256 = "Reject duplicate keys; sort complete UTF-8 keys bytewise; join with one LF and no final LF; SHA-256 the resulting bytes. The empty set is SHA-256 of zero bytes."
file_binding_key = "For source/target/support and physical file records, apply the same sorted name=value/U+001F rule to every schema field and prepend the declared typed prefix."
source_review_receipt_binding_key = "source-review-receipt-binding: followed by sorted fields byte_count,id,path,sha256."
scc_partition_key = "scc-partition: followed by component_id,order_group,units fields under the generic sorted-field rule; units is the semicolon-joined lexical unit set."
owner_family_key = "owner-family: followed by campaign,component_id,family_id,ownership_unit under the generic sorted-field rule."
field_profile_key = "field-profile: followed by campaign,component_id,profile_id under the generic sorted-field rule; applicability is by component campaign."
dependency_unit_seam_key = "For each of 452 cross-component unit edges, dependency-unit-seam: followed by dependency_component,dependency_unit,source_component,source_unit under the generic sorted-field rule."
component_dependency_key = "Literal component-dependency:<source component id>-><dependency component id>; one per unique cross-component pair."
component_order_sha256 = "SHA-256 over UTF-8 component_ids in first SCC-ledger appearance order, joined by one LF with no final LF."
tree_sha256 = "For every regular file recursively below a tree root, sort root-relative POSIX paths bytewise; append UTF-8 path, NUL, complete file bytes, NUL for each member; SHA-256 the concatenation. Directories add no record; non-regular members are rejected."
record_order = "Component IDs follow first appearance in the SCC ledger within their wave. Units follow SCC ledger row order. Owner-family/profile ID arrays follow pinned TOML declaration order. Dependency component IDs and every physical path array are lexical."
empty_authority_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

