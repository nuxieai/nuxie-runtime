<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebGPU source oracle</title>
  </head>
  <body data-status="loading">
    <canvas id="canvas" width="1" height="1"></canvas>
    <pre id="status">loading pinned C++ WebGPU source oracle</pre>
    <script>
      const status = document.querySelector("#status");
      const stdout = [];
      const stderr = [];
      let resolveRuntime;
      window.webgpuSourceReady = new Promise((resolve) => {
        resolveRuntime = resolve;
      });
      window.Module = {
        canvas: document.querySelector("#canvas"),
        noInitialRun: true,
        print: (line) => stdout.push(String(line)),
        printErr: (line) => stderr.push(String(line)),
        onRuntimeInitialized: () => {
          document.body.dataset.status = "ready";
          status.textContent = "ready: pinned C++ WebGPU source oracle";
          resolveRuntime();
        },
      };

      window.runWebgpuSource = async ({ stream, mode, frame = 0 }) => {
        await window.webgpuSourceReady;
        stdout.length = 0;
        stderr.length = 0;
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const input = `/source-${suffix}.rive-stream`;
        const output = `/source-${suffix}.png`;
        Module.FS.writeFile(input, stream);
        try {
          let exitCode = Module.callMain([
            "--stream",
            input,
            "--output",
            output,
            "--backend",
            "ffi-dawn",
            "--mode",
            mode,
            "--frame",
            String(frame),
          ]);
          if (Module.Asyncify.currData !== null) {
            exitCode = await Module.Asyncify.whenDone();
          }
          const png = Module.FS.readFile(output);
          const digest = await crypto.subtle.digest("SHA-256", png);
          const sha256 = Array.from(new Uint8Array(digest), (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");
          let binary = "";
          for (let offset = 0; offset < png.length; offset += 32768) {
            binary += String.fromCharCode(...png.subarray(offset, offset + 32768));
          }
          return {
            exitCode,
            stdout: [...stdout],
            stderr: [...stderr],
            pngBase64: btoa(binary),
            pngBytes: png.length,
            sha256,
          };
        } finally {
          try {
            Module.FS.unlink(input);
          } catch (_) {}
          try {
            Module.FS.unlink(output);
          } catch (_) {}
        }
      };

      const delay = (milliseconds) =>
        new Promise((resolve) => setTimeout(resolve, milliseconds));
      const postJson = (path, payload) =>
        fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
      const work = async () => {
        await window.webgpuSourceReady;
        const registration = await postJson("/worker/register", {
          name: "chrome",
          user_agent: navigator.userAgent,
          webgpu: Boolean(navigator.gpu),
        });
        if (!registration.ok) {
          throw new Error(`source registration failed: ${registration.status}`);
        }
        document.body.dataset.status = "worker-ready";
        status.textContent = "ready: pinned C++ WebGPU corpus worker";
        let completedRenders = 0;
        for (;;) {
          const response = await fetch("/worker/next", { cache: "no-store" });
          if (response.status === 204) {
            await delay(10);
            continue;
          }
          if (!response.ok) {
            throw new Error(`source work request failed: ${response.status}`);
          }
          const job = await response.json();
          try {
            const result = await window.runWebgpuSource(job);
            const completion = await postJson("/worker/complete", {
              id: job.id,
              result,
            });
            if (!completion.ok) {
              throw new Error(`source completion failed: ${completion.status}`);
            }
          } catch (error) {
            await postJson("/worker/complete", {
              id: job.id,
              error: error?.stack || String(error),
            });
          }
          completedRenders += 1;
          if (completedRenders >= 16) {
            location.reload();
            return;
          }
        }
      };
      if (new URLSearchParams(location.search).has("source-worker")) {
        work().catch((error) => {
          document.body.dataset.status = "worker-failed";
          status.textContent = error?.stack || String(error);
        });
      }
    </script>
    <script src="/target/renderer-webgpu-live-reference/wasm32-unknown-emscripten/release/renderer-replay.js"></script>
  </body>
</html>
