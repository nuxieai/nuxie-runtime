[rules]
authority = "The immutable source-review barrier, pinned upstream bytes, exact translated target and support bytes, four raw state ledgers, SCC graph, owner contracts, field profiles, and all 117 source-review receipts are primary. Other backends are diagnostic only."
read_only = "Review contexts create only canonical ownership-review receipts; they do not edit source, target, support, prerequisite source-review receipts, or authority and do not use compiler diagnostics, tests, features, fixtures, or behavioral failures to select or delimit review work."
complete_bytes = "Every source, translated target, and support artifact is rebound to its exact SHA-256, logical-line count, byte count, and full-file citation before ownership claims are admitted."
complete_state = "Review field/layout, ownership transfer, provenance/aliasing, callbacks/threading, synchronization/mapping, failure/loss, teardown/destruction, unsafe/FFI/ABI, and configuration owner graphs for every component and support artifact."
ledger_scope = "The 1,946 field, 2,431 lifecycle, 5,409 configuration, and 924 dependency rows are exhaustive prompts and graph authority, never line-scope delimiters. A component with zero extracted rows still receives complete full-file ownership/lifetime/ABI review."
owner_authority = "Each of 135 units maps to exactly one same-campaign owner family by declared prefix. Field profiles apply by component campaign, independently of whether a component has extracted field rows."
dependency_closure = "All 511 declared unit edges are replayed. Every cross-component dependency is lower-wave; each component lists the lexical deduplicated dependency component set and binds the exact already-admitted ownership receipt bytes for those components."
unsafe_boundary = "Every raw pointer, cast, alias, callback user-data path, native handle, mapping, FFI call, ABI record, and unsafe block must state and preserve its source preconditions, provenance, synchronization, and destruction owner."
no_phase_jump = "This pass records findings only. It performs no correction, compiler work, tests, feature work, fixture work, rooted execution, editor wiring, fallback work, or legacy deletion."
finding_stability = "Every mismatch receives a stable ID, severity, review-domain set, relevant authority keys, and exact in-range citations. Findings remain open for the later correction gate."
structural_red = "A complete receipt set with open P0-P3 findings is successful structural red; zero findings is structural green. Open findings do not block the next structural wave."
skill_exclusion = "Actively ignore and do not use the implement or tdd skills."
wave_order = "Review g0 through g6 in order, then support, then all nine overlays in fixed order, then global. Within a wave parallelize only by complete component_id and never split an SCC."
component_atomicity = "One receipt covers the full source/target and state-authority union of one frozen SCC; fields, lifecycle rows, configurations, dependencies, or source files never split a component."
overlay_gate = "The overlay receipt is admitted only after all 115 component receipts and support receipt. Its nine records expose strengthened ownership unions and explicit physical bindings; they do not reuse the smaller source-overlay digest as the new ownership digest."
two_commit_launch = "Launch Commit A records ownership_review_launch_ref=pending and the complete launch authority. Activation Commit B is the unique reachable single-parent direct child of A and changes only that manifest field to A's full SHA. B's committed ownership receipt tree and the live admission receipt directory are empty. Admission rejects pending; then the exact plan/schema/ownership-checker/source-checker regular bytes must match across A, HEAD, index, and worktree, and the sole effective phony ownership Make definitions must validate independently in all four layers. Activated/completed manifest index and worktree bytes must be clean against HEAD. Squash, rebase, or history rewriting that discards A or B invalidates the chain."
two_commit_close = "Close Commit C is distinct from B and closes the exact 117 ownership receipts while the queue/status remain ownership-review/active and no completion pins exist. Across any number of wave commits, the exact B-to-C added-path set is those 117 canonical receipts and no other path. Transition Commit D is the unique reachable single-parent direct child of C, changes only the campaign manifest, sets status complete, advances only to correction, and pins C plus its exact receipt tree, line/byte totals, finding total/severity counts, and finding-ID digest. Later replay uses an ephemeral detached checkout at C, requires the live tracked regular non-symlink receipt working tree, index, HEAD, bytes, and statistics identical to C, and permits only active_queue to advance after D."
product_scope = "Port Vulkan, WebGPU, and WebGL2 exactly; expose WebGPU and WebGL2 as explicit editor choices; retain legacy Rust-WGPU until all three independently pass frozen closeout, then delete it."

[launch_contract]
launch_ref_field = "ownership_review_launch_ref"
pending_ref = "pending"
active_queue = "ownership-review"
active_status = "active"
manifest_path = "docs/backend-port-campaign.toml"
frozen_paths = [
  "docs/backend-port-ownership-review-plan.toml",
  "docs/backend-port-ownership-review-schema.md",
  "tools/backend-port/check_ownership_review.py",
  "tools/backend-port/check_source_review.py",
]
makefile_path = "Makefile"
make_tool_assignment = "BACKEND_PORT_OWNERSHIP_REVIEW_TOOL ?= $(CURDIR)/tools/backend-port/check_ownership_review.py"
make_admission_target = "backend-port-ownership-review-admission"
make_admission_recipe = "PYTHONDONTWRITEBYTECODE=1 python3 \"$(BACKEND_PORT_OWNERSHIP_REVIEW_TOOL)\" --repo-root \"$(CURDIR)\" --upstream-root \"$(RIVE_RUNTIME_DIR)\" --manifest \"$(BACKEND_PORT_CAMPAIGN)\" --admission"
