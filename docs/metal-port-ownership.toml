# mask, and specialized draw owners as one transaction. Overlapping prepared
# leases retain distinct concrete generations, while injected texture and real
# synthesized compiler failures publish nothing and leave the coordinator
# reusable. The final static ImageRect vertex/index buffers are retained with
# byte-exact upstream contents. Public asynchronous scheduling remains outside
# this ownership row and does not own these resource identities.
