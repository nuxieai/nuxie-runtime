[[findings]]
id = "SR-C109-10"
severity = "P3"
summary = "Authored default-call forms are absent. Source permits omitted error outputs, buffer offsets, dynamic-offset arrays and counts, viewport depths, and draw arguments; target requires every corresponding argument explicitly and supplies no convenience forms."
