name: Trusted macOS CI

on:
  workflow_call:
    inputs:
      force_hosted:
        description: >-
          Run every macOS job on GitHub-hosted macOS. This is a one-way safety
          override: fork pull requests remain hosted even when this is false.
        required: false
        type: boolean
        default: false
      runtime_differentials_only:
        description: Run only the sharded exhaustive runtime differential jobs.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RIVE_RUNTIME_REF: 4ac7b32798da0482e441ef09304dc3b480ed3ee5
  RIVE_RUNTIME_DIR: ${{ github.workspace }}/rive-runtime
  RIVE_PREMAKE_TAG: v5.0.0-beta7

jobs:
  # SECURITY: The nuxie-macos runner group must select only this reusable
  # workflow at a protected nuxie-runtime ref. The decision below is made from
  # the immutable event context inside that trusted workflow. A caller can set
  # force_hosted to broaden execution to GitHub-hosted macOS, but can never use
  # it to put a fork pull request on a persistent Nuxie runner.
  golden-compare:
    name: Golden compare
    # Push-only: the pinned C++ oracle build and comparison are expensive; PRs
    # run make golden-compare locally and the merge's push run still enforces
    # it. The C ABI smoke job below stays on PRs.
    if: github.event_name != 'pull_request' && !inputs.runtime_differentials_only
    runs-on: ${{ fromJSON((inputs.force_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["macos-14"]' || '["self-hosted","macOS","ARM64","nuxie-pr"]') }}
    # Hang guard at >2x the observed worst case (~51 min hosted). This gate
    # must always end in a real conclusion; see the concurrency note in
    # ci.yml for the 24-hour queue-expiry failure mode it pairs with.
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4
        with:
          path: rive-rust

      - name: Checkout reference rive-runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_RUNTIME_REF }}
          path: rive-runtime

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update

      # The scorecard record wrapper (tools/parity-scorecard) needs
      # Python >= 3.11 (tomllib). setup-python assumes the hosted image's
      # /Users/runner tool-cache layout and fails on the self-hosted pool, so
      # persistent runners must provide a system python3 instead.
      - name: Install Python (hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify system Python (self-hosted)
        if: runner.environment != 'github-hosted'
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'

      - name: Build reference Rive runtime
        working-directory: ${{ env.RIVE_RUNTIME_DIR }}
        run: |
          RIVE_PREMAKE_ARGS="--file=premake5_v2.lua --with_rive_text --with_rive_layout" build/build_rive.sh debug
          echo "${RIVE_RUNTIME_DIR}/build/dependencies/premake-core/bin/${RIVE_PREMAKE_TAG}_release" >> "${GITHUB_PATH}"

      - name: Fetch pinned test assets
        working-directory: ${{ github.workspace }}/rive-rust
        run: make fixtures

      # The gate commands below are unchanged; the record wrapper streams
      # their output, captures the raw summary and exit code as scorecard
      # evidence, and exits with the gate's own exit code -- the gate stays
      # exactly as blocking as a bare `make` invocation. This job is the
      # single source of the oracle floor evidence; ci.yml used to re-run the
      # same floor on a second hosted runner just to capture these files.
      - name: Run golden compare
        working-directory: ${{ github.workspace }}/rive-rust
        run: |
          python3 tools/parity-scorecard/parity_scorecard.py record \
            --gate golden-compare \
            --output target/parity-scorecard/evidence/golden-compare.json \
            -- make golden-compare

      # Its own step rather than a prerequisite of cpp-oracle-workspace-tests:
      # an audit drift is a distinct failure and must not stop the workspace
      # tests below from running and reporting.
      - name: Verify B-6 audit
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}/rive-rust
        run: make b6-audit-check

      - name: Run Rust workspace tests with the pinned C++ oracle
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}/rive-rust
        run: |
          python3 tools/parity-scorecard/parity_scorecard.py record \
            --gate cargo-test-workspace \
            --output target/parity-scorecard/evidence/cargo-test-workspace.json \
            -- make cpp-oracle-workspace-tests

      - name: Upload oracle scorecard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-scorecard-evidence-oracle-${{ github.run_attempt }}
          path: rive-rust/target/parity-scorecard/evidence/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload runtime differential fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-differentials-${{ github.run_attempt }}
          path: rive-rust/target/runtime-differentials/*.json
          if-no-files-found: warn
          retention-days: 30

  # The expensive exhaustive lanes are independent jobs with independent hang
  # guards and artifacts. A setup failure or timeout in one cannot hide the
  # other; runtime-differentials.yml schedules both twice weekly in addition
  # to main pushes.
  runtime-differentials:
    name: Runtime differential (${{ matrix.lane }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((inputs.force_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["macos-14"]' || '["self-hosted","macOS","ARM64","nuxie-pr"]') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane:
          - scripted-golden
          - silver
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4
        with:
          path: rive-rust

      - name: Checkout reference rive-runtime
        uses: actions/checkout@v4
        with:
          repository: rive-app/rive-runtime
          ref: ${{ env.RIVE_RUNTIME_REF }}
          path: rive-runtime

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update

      - name: Install Python (hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify system Python (self-hosted)
        if: runner.environment != 'github-hosted'
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'

      - name: Build reference Rive runtime
        if: matrix.lane == 'scripted-golden'
        working-directory: ${{ env.RIVE_RUNTIME_DIR }}
        run: |
          RIVE_PREMAKE_ARGS="--file=premake5_v2.lua --with_rive_text --with_rive_layout" build/build_rive.sh debug
          echo "${RIVE_RUNTIME_DIR}/build/dependencies/premake-core/bin/${RIVE_PREMAKE_TAG}_release" >> "${GITHUB_PATH}"

      - name: Fetch pinned test assets
        working-directory: ${{ github.workspace }}/rive-rust
        run: make fixtures

      - name: Run forced-scripted golden compare
        if: matrix.lane == 'scripted-golden'
        working-directory: ${{ github.workspace }}/rive-rust
        run: |
          python3 tools/parity-scorecard/parity_scorecard.py record \
            --gate scripted-golden-compare \
            --output target/parity-scorecard/evidence/scripted-golden-compare.json \
            -- make scripted-golden-compare

      - name: Run executable silver corpus
        if: matrix.lane == 'silver'
        working-directory: ${{ github.workspace }}/rive-rust
        run: |
          python3 tools/parity-scorecard/parity_scorecard.py record \
            --gate silver-corpus-validate \
            --output target/parity-scorecard/evidence/silver-corpus-validate.json \
            -- make silver-corpus-validate

      - name: Upload lane differential fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-differentials-${{ matrix.lane }}-${{ github.run_attempt }}
          path: rive-rust/target/runtime-differentials/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload lane scorecard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-scorecard-evidence-${{ matrix.lane }}-${{ github.run_attempt }}
          path: rive-rust/target/parity-scorecard/evidence/*.json
          if-no-files-found: warn
          retention-days: 7

  capi-smoke:
    name: C ABI smoke test
    if: ${{ !inputs.runtime_differentials_only }}
    runs-on: ${{ fromJSON((inputs.force_hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["macos-14"]' || '["self-hosted","macOS","ARM64","nuxie-pr"]') }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rive-rust
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update

      # The scorecard record wrapper (tools/parity-scorecard) needs
      # Python >= 3.11 (tomllib). setup-python assumes the hosted image's
      # /Users/runner tool-cache layout and fails on the self-hosted pool, so
      # persistent runners must provide a system python3 instead.
      - name: Install Python (hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify system Python (self-hosted)
        if: runner.environment != 'github-hosted'
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'

      - name: Fetch pinned test assets
        run: make fixtures

      # Same wrapper contract as the golden-compare job: identical command,
      # identical exit code, plus the raw evidence file for the scorecard.
      - name: Build and run C smoke test
        run: |
          python3 tools/parity-scorecard/parity_scorecard.py record \
            --gate capi-smoke \
            --output target/parity-scorecard/evidence/capi-smoke.json \
            -- make capi-smoke

      - name: Upload C ABI scorecard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-scorecard-evidence-capi-${{ github.run_attempt }}
          path: target/parity-scorecard/evidence/capi-smoke.json
          if-no-files-found: warn
          retention-days: 7
