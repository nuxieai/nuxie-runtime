# Generated dependency metadata. Rust sources stay in their owning package.
[package]
name = "nux-capi"
version = "0.10.14"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = "build.rs"

[lib]
path = "lib.rs"

[features]
"default" = ["android-authored-wgsl", "android-vulkan", "apple-authored-msl", "apple-metal", "scripting"]
"scripting" = ["nuxie/scripting"]
"apple-metal" = ["nuxie/renderer-metal", "dep:dispatch2", "dep:nuxie-image-codec", "dep:nuxie-renderer", "nuxie-renderer/renderer-metal", "dep:objc2", "dep:objc2-metal", "dep:objc2-quartz-core"]
"android-vulkan" = ["nuxie/renderer-vulkan", "dep:nuxie-image-codec", "dep:nuxie-renderer", "nuxie-renderer/renderer-vulkan"]
"apple-authored-msl" = ["nuxie/ore-metal-authored-msl"]
"android-authored-wgsl" = ["scripting", "nuxie/android-authored-wgsl", "dep:nuxie-project-data-scripting"]

[dependencies]
"nuxie" = { "path" = "../nuxie", "default-features" = false }
"nuxie-binary" = { "path" = "../nuxie-binary" }
"nuxie-image-codec" = { "path" = "../nuxie-image-codec", "optional" = true }
"nuxie-project-data-scripting" = { "path" = "../nuxie-project-data-scripting", "optional" = true }
"nuxie-renderer" = { "path" = "../nuxie-renderer", "optional" = true, "default-features" = false }
"nuxie-ore-metal" = { "path" = "../nuxie-ore-metal", "default-features" = false }

[dev-dependencies]
"nuxie-video-host" = { "path" = "../nuxie-video-host" }
"nuxie-binary" = { "path" = "../nuxie-binary", "features" = ["test-support"] }
"luaur-common" = { "version" = "=0.1.8", "path" = "../luaur-common", "default-features" = false, "features" = ["__bazel_dependency_default"] }
"luaur-compiler" = { "version" = "=0.1.8", "path" = "../luaur-compiler", "default-features" = false, "features" = ["__bazel_dependency_default"] }
"nuxie" = { "path" = "../nuxie", "default-features" = false, "features" = ["test-support"] }
"nuxie-render-api" = { "path" = "../nuxie-render-api" }
"nuxie-runtime" = { "path" = "../nuxie-runtime", "default-features" = false, "features" = ["policy-pass-counter"] }
"nuxie-project-data" = { "path" = "../nuxie-project-data" }
"nuxie-schema" = { "path" = "../nuxie-schema" }
"serde_json" = { "version" = "1" }
"sha2" = { "version" = "0.10" }
"runtime-test-support" = { "path" = "../runtime-test-support" }

[build-dependencies]
"cbindgen" = { "version" = "=0.29.2" }

[target."cfg(any(target_os = \"ios\", target_os = \"macos\"))".dependencies]
"dispatch2" = { "version" = "0.3.1", "default-features" = false, "features" = ["std"], "optional" = true }
"objc2" = { "version" = "0.6.4", "optional" = true }
"objc2-metal" = { "version" = "0.3.2", "optional" = true, "default-features" = false, "features" = ["MTLDevice"] }
"objc2-quartz-core" = { "version" = "0.3.2", "optional" = true, "default-features" = false, "features" = ["std", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }

[target."cfg(any(target_os = \"ios\", target_os = \"macos\"))".dev-dependencies]
"objc2" = { "version" = "0.6.4" }
"objc2-core-foundation" = { "version" = "0.3.2", "default-features" = false, "features" = ["std", "CFCGTypes"] }
"objc2-metal" = { "version" = "0.3.2", "default-features" = false, "features" = ["MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLTexture", "MTLTypes"] }
"objc2-quartz-core" = { "version" = "0.3.2", "default-features" = false, "features" = ["std", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }
