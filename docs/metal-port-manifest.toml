  "renderer/include/rive/renderer/metal/*",
  "renderer/src/metal/*",
  "renderer/include/rive/renderer/ore/ore_*.hpp",
  "renderer/src/ore/metal/*",
  "renderer/src/shaders/metal/*",
]
