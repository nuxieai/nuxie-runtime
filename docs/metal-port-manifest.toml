upstream = "renderer/src/metal/render_context_metal_impl.mm"
lane = "renderer-platform"
issue = "UNIV-2086"
status = "in-progress"
# Adaptation: upstream attaches a product-supplied target texture after target
# construction. The headless tracer creates and attaches a shared readback
# texture while building the same complete `RenderTargetMetal` owner. Resize
# constructs a replacement before assignment; the integration test proves an
# in-flight frame retains the previous generation and the new target renders.
# The dormant presentation adapter uses that same setter for a retained BGRA
# texture from a caller-acquired drawable, then presents the borrowed drawable
# on the next command buffer from the same queue.
# Same-flush atlas resources additionally port the pinned fill/stroke and
# scissor ordering, unscissored batch coalescing, flush-wide tessellation
# relocation, and synchronous specialized AtlasBlit selection.
# Resource preparation now stages gradient, tessellation, atlas, mask-pair, and
# specialized draw owners as one retained candidate generation and publishes it
# only after every fallible realization and upload step succeeds. This is a
# Rust typed-error adaptation: focused tests inject later allocation and the
# upstream-shaped synthesized compiler failure, verify no partial publication,
# retain overlapping concrete generations, and retry on the same coordinator.
# The context also retains byte-exact shared ImageRect vertex/index buffers from
# the pinned constructor; drawing them remains a later atomic-encoder slice.
# UNIV-2088's bounded generic-atomic slices port the fixed-function opaque
# SrcOver initialize/midpoint/resolve topology from 1363-1385, 1759-1812,
# 1857-1925, and 1989-1997, then add the one-draw linear-gradient ramp resource
# and generated fragment texture-8 binding from 1041-1058, 1298-1385, and
# 1404-1450. The third materializes one canonical-equivalent solid multi-draw
# flush and ports disjoint grouping plus initial, draw-group-transition, and pre-resolve
# barriers from render_context.cpp:1740-1802, 1955-1964, and 2223-2241 and the
# exact Metal realization at 1857-1889. The fourth ports nested path clipping,
# midpoint plus outer-curve/interior geometry, flush-wide clipped pipeline
# keys, dynamic replacement/parent IDs, and the exact five-group/six-barrier
# schedule from render_context.cpp:1689-1802, 3033-3054, 3948-3971,
# gpu.hpp:807-825, and Metal 1763-1925. The fifth ports one same-flush simple
# linear gradient between two solid fills, including its outer-curve/interior
# split, ramp/tessellation resources, exact four-group/five-barrier schedule,
# and unclipped combined pipeline keys from render_context.cpp:500-663,
# 1104-1473, 1680-1808, 1953-1965, 2223-2241, 3029-3059, and Metal
# 1298-1450, 1759-1925, 1989-1997. This full source row remains in-progress:
# clip rectangles and clip mutation after content, gradients in clipped
# flushes, more than one gradient in a flush, radial/complex gradients,
# atlas, images, strokes, advanced blends, multi-flush/general scheduling,
# simulator coverage, and fallback remain.
